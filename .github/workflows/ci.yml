name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Run SVG contract tests
        run: bun test

      - name: Validate migrated SVG assets
        run: bun run validate

      - name: Typecheck
        run: bun run typecheck
