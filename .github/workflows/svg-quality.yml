name: SVG Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Run SVG contract tests
        run: bun run test

      - name: Validate migrated SVG assets
        run: bun run validate

      - name: SVGO check
        run: bun run svgo:check
