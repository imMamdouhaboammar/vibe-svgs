name: Regenerate Reduced Motion Packs

on:
  push:
    branches:
      - daily/2026-08-24-browser-reduced-motion-proof

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[regen-packs]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: daily/2026-08-24-browser-reduced-motion-proof

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate and format mascot packs
        run: |
          bun run generate:mascot-packs
          bun run svgo:write

      - name: Commit generated pack drift
        run: |
          if git diff --quiet -- svgs/packs asset-manifest.json; then
            echo "Generated mascot packs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add svgs/packs asset-manifest.json
          git commit -m "fix(assets): sync reduced-motion mascot packs [regen-packs]"
          git push origin HEAD:daily/2026-08-24-browser-reduced-motion-proof
