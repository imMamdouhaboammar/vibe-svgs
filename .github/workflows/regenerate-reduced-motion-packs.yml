name: Regenerate Reduced Motion Packs

on:
  push:
    branches:
      - daily/2026-08-24-browser-reduced-motion-proof

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[regen-packs]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: daily/2026-08-24-browser-reduced-motion-proof
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: |
          bun run generate:mascot-packs
          bun run svgo:write
      - name: Commit generated packs
        run: |
          if git diff --quiet -- svgs/packs asset-manifest.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add svgs/packs asset-manifest.json
          git commit -m "fix(assets): preserve reduced-motion selectors [regen-packs]"
          git push origin HEAD:daily/2026-08-24-browser-reduced-motion-proof
