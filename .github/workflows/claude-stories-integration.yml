name: Claude Stories Integration

on:
  push:
    branches:
      - feat/claude-stories-motion-pack

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/claude-stories-motion-pack
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integrate collection files
        run: bun run scripts/integrate-claude-stories.ts

      - name: Format SVG assets
        run: bun run svgo:write

      - name: Run repository gates
        run: bun run check

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-manifest.json README.md tests/svg-contracts.test.ts svgs/scenes scripts/integrate-claude-stories.ts .github/workflows/claude-stories-integration.yml
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "feat: integrate verified Claude Stories pack"
          git push origin HEAD:feat/claude-stories-motion-pack
