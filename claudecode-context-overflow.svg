<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-labelledby="ctx-t ctx-d">
<title id="ctx-t">Claude Code mascot under a growing stack of context tokens</title>
<desc id="ctx-d">Six token blocks fall one by one onto the mascot. Each impact compresses it like a damped spring, the stack rides down with it, and the context meter fills until it turns red, then everything springs back.</desc>
