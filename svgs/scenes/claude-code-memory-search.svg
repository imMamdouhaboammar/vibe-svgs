<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-code-memory-search-title claude-code-memory-search-desc" role="img" viewBox="0 0 320 220"><title id="claude-code-memory-search-title">Claude Code Memory Search</title><desc id="claude-code-memory-search-desc">A magnifying lens scans memory cards with damped travel; each card lifts as the scan passes over it.</desc><style>@keyframes claude-code-memory-search-body{0%,to{transform:translateY(0)}45%{transform:translateY(-2px)}}@keyframes claude-code-memory-search-lens{0%,10%,82%,to{transform:translateX(-26px) rotate(-8deg)}45%{transform:translateX(56px) rotate(7deg)}}@keyframes claude-code-memory-search-card-a{0%,14%,42%,to{transform:translateY(0)}28%{transform:translateY(-8px)}}@keyframes claude-code-memory-search-card-b{0%,34%,63%,to{transform:translateY(0)}49%{transform:translateY(-8px)}}@keyframes claude-code-memory-search-card-c{0%,55%,84%,to{transform:translateY(0)}70%{transform:translateY(-8px)}}@keyframes claude-code-memory-search-beam{0%,to{opacity:.08}45%{opacity:.25}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="77" cy="194" fill="#2b2725" opacity=".16" rx="42" ry="7"/><g><g data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-memory-search-body 4.6s ease-in-out infinite"><path fill="#d97757" fill-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" clip-rule="evenodd" transform="matrix(3.8 0 0 3.8 34 102)"/></g></g><g><g data-animated="true" style="animation:claude-code-memory-search-card-a 4.6s ease-in-out infinite" transform="translate(140 61)"><rect width="48" height="96" fill="#f6e8e0" stroke="#d9c5bb" stroke-width="3" rx="8"/><path stroke="#6b8fb8" stroke-linecap="round" stroke-width="5" d="M12 23h24M12 40h18M12 57h24"/></g><g