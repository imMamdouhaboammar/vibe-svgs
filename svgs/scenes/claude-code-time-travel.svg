a-animated="true" opacity=".22" rx="50" ry="7"/><rect width="140" height="90" x="180" y="52" fill="var(--panel)" stroke="var(--dim)" stroke-width="3" rx="12"/><g data-animated="true" style="animation:claude-code-time-travel-diff-a 4.8s ease-in-out infinite"><rect width="50" height="62" x="194" y="66" fill="var(--ink)" rx="6"/><path stroke="var(--ok)" stroke-linecap="round" stroke-width="4" d="M202 78h34M202 92h24M202 106h28"/></g><g data-animated="true" style="animation:claude-code-time-travel-diff-b 4.8s ease-in-out infinite"><rect width="50" height="62" x="256" y="66" fill="var(--ink)" rx="6"/><path stroke="#c65a4c" stroke-linecap="round" stroke-width="4" d="M264 78h34M264 92h20M264 106h26"/></g><g data-animated="true" style="animation:claude-code-time-travel-dial 4.8s ease-in-out infinite;transform-origin:258px 165px"><circle cx="258" cy="165" r="18" fill="var(--gold)" stroke="var(--ink)" stroke-width="3"/><path stroke="var(--ink)" stroke-linecap="round" stroke-width="4" d="M258 165l-12-10"/></g><g transform="translate(96 204)"><g data-animated="true" style="animation:claude-code-time-travel-x 4.8s linear infinite"><g data-animated="true" style="animation:claude-code-time-travel-y 4.8s linear infinite"><g class="motion pivot-center" data-animated="true" style="animation:claude-code-time-travel-r 4.8s linear infinite"><g class="motion" data-animated="true" style="transform-origin:50% 100%;animation:claude-code-time-travel-s 4.8s linear infinite"><use data-mascot="true" href="#claude-code-time-travel-mascot" transform="scale(4) translate(-12 -20)"/></g></g></g></g></g></svg>