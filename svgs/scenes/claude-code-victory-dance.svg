<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-code-victory-dance-title claude-code-victory-dance-desc" role="img" viewBox="0 0 320 220"><title id="claude-code-victory-dance-title">Claude Code Victory Dance</title><desc id="claude-code-victory-dance-desc">Claude Code performs a squash-and-stretch victory dance with two airborne beats, responsive shadowing, expanding energy ring, and falling confetti.</desc><style>@keyframes claude-code-victory-dance-dance{0%,to{transform:translateY(0) rotate(0) scale(1)}15%{transform:translateY(5px) rotate(-5deg) scale(1.06,.94)}32%{transform:translateY(-24px) rotate(9deg) scale(.96,1.04)}48%{transform:translateY(0) rotate(-5deg) scale(1.04,.96)}62%{transform:translateY(-15px) rotate(-9deg) scale(.98,1.02)}78%{transform:translateY(0) rotate(4deg) scale(1.02,.98)}}@keyframes claude-code-victory-dance-shadow{0%,48%,78%,to{transform:scaleX(1);opacity:.2}32%{transform:scaleX(.62);opacity:.1}62%{transform:scaleX(.72);opacity:.12}}@keyframes claude-code-victory-dance-conf-a{0%{transform:translate(0,-50px) rotate(0)}to{transform:translate(22px,245px) rotate(420deg)}}@keyframes claude-code-victory-dance-conf-b{0%{transform:translate(0,-60px) rotate(0)}to{transform:translate(-28px,250px) rotate(-480deg)}}@keyframes claude-code-victory-dance-conf-c{0%{transform:translate(0,-45px) rotate(0)}to{transform:translate(17px,235px) rotate(380deg)}}@keyframes claude-code-victory-dance-conf-d{0%{transform:translate(0,-70px) rotate(0)}to{transform:translate(-19px,255px) rotate(-520deg)}}@keyframes claude-code-victory-dance-ring{0%{transform:scale(.4);opacity:.65}55%,to{transform:scale(1.55);opacity:0}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><circle cx="160" cy="112" r="62" fill="none" stroke="#4d9a73" stroke-width="5" data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-victory-dance-ring 2.6s ease-out infinite"/><ellipse cx="160" cy="196" fill="#2b2725" data-animated="true" rx="52" ry="8" style="transform-box:fill-box;transform-origin:center;animation:claude-code-victory-dance-shadow 2.6s ease-in-out infinite"/><g><g data-animated="true" style="transform-box:fill-box;transform-origin:50% 100%;animation:claude-code-victory-dance-dance 2.6s cubic-bezier(.35,0,.2,1) infinite"><path fill="#d97757" fill-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" clip-rule="evenodd" transform="matrix(4 0 0 4 112 101)"/></g></g><g stroke-linecap="round" stroke-width="5"><path stroke="#6b8fb8" d="M48 0l12 7" data-animated="true" style="animation:claude-code-victory-dance-conf-a 2.6s linear infinite"/><path stroke="#c65a4c" d="M108-20l-9 13" data-animated="true" style="animation:claude-code-victory-dance-conf-b 2.9s .4s linear infinite"/><path stroke="#e7b85c" d="M232-10l13 6" data-animated="true" style="animation:claude-code-victory-dance-conf-c 2.3s .7s linear infinite"/><path stroke="#8a78a8" d="M282-28l-8 14" data-animated="true" style="animation:claude-code-victory-dance-conf-d 3.1s 1s linear infinite"/></g><path fill="none" stroke="#4d9a73" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" d="M49 75l8 8 15-19M247 77l8 8 15-19"/></svg>