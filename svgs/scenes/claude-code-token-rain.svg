<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-code-token-rain-title claude-code-token-rain-desc" role="img" viewBox="0 0 320 220"><title id="claude-code-token-rain-title">Claude Code Token Rain</title><desc id="claude-code-token-rain-desc">Tokens accelerate under gravity and spin at different rates while an umbrella compresses on impact over Claude Code.</desc><style>@keyframes claude-code-token-rain-body{0%,38%,to{transform:translateY(0) scale(1)}22%{transform:translateY(2px) scale(1.02,.98)}}@keyframes claude-code-token-rain-umbrella{0%,to{transform:translateY(0) scaleX(1)}22%{transform:translateY(4px) scaleX(1.05)}38%{transform:translateY(-2px) scaleX(.99)}}@keyframes claude-code-token-rain-fall-a{0%{transform:translate(0,-55px) rotate(0);opacity:0}12%{opacity:1}to{transform:translate(15px,220px) rotate(220deg);opacity:1}}@keyframes claude-code-token-rain-fall-b{0%{transform:translate(0,-65px) rotate(0);opacity:0}12%{opacity:1}to{transform:translate(-11px,230px) rotate(-260deg);opacity:1}}@keyframes claude-code-token-rain-fall-c{0%{transform:translate(0,-45px) rotate(0);opacity:0}12%{opacity:1}to{transform:translate(9px,215px) rotate(190deg);opacity:1}}@keyframes claude-code-token-rain-fall-d{0%{transform:translate(0,-60px) rotate(0);opacity:0}12%{opacity:1}to{transform:translate(-14px,225px) rotate(-240deg);opacity:1}}.cc-token-a{animation:claude-code-token-rain-fall-a 2.1s linear infinite}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="160" cy="200" fill="#2b2725" opacity=".16" rx="50" ry="8"/><g><g data-animated="true" style="transform-box:fill-box;transform-origin:50% 100%;animation:claude-code-token-rain-body 3.5s ease-in-out infinite"><path fill="#d97757" fill-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" clip-rule="evenodd" transform="matrix(4 0 0 4 112 112)"/></g></g><g data-animated="true" style="transform-box:fill-box;transform-origin:50% 100%;animation:claude-code-token-rain-umbrella 3.5s cubic-bezier(.2,.9,.2,1) infinite"><path fill="#6b8fb8" stroke="#2b2725" stroke-linejoin="round" stroke-width="4" d="M91 111c8-50 130-50 138 0-16-9-28-9-45 0-16-9-32-9-48 0-16-9-29-9-45 0z"/><path fill="none" stroke="#2b2725" stroke-linecap="round" stroke-width="5" d="M160 111v66c0 20 25 20 25 0"/></g><g fill="#e7b85c" stroke="#2b2725" stroke-width="2"><circle cx="54" cy="0" r="12" class="cc-token-a" data-animated="true"/><path d="M49 0h10" class="cc-token-a" data-animated="true"/><circle cx="124" cy="-20" r="10" data-animated="true" style="animation:claude-code-token-rain-fall-b 2.6s .5s linear infinite"/><circle cx="232" cy="-10" r="13" data-animated="true" style="animation:claude-code-token-rain-fall-c 1.8s .8s linear infinite"/><circle cx="285" cy="-30" r="9" data-animated="true" style="animation:claude-code-token-rain-fall-d 2.3s 1.1s linear infinite"/></g></svg>