<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" aria-labelledby="claude-code-focus-lock-title claude-code-focus-lock-desc" role="img" style="--ink:#2b2725;--dim:#d9cfc8;--panel:#f6e8e0;--brand:#d97757;--gold:#e7b85c;--ok:#4d9a73;--blue:#6b8fb8" viewBox="0 0 360 240"><title id="claude-code-focus-lock-title">Claude Code Focus Lock</title><desc id="claude-code-focus-lock-desc">Claude Code breathes at center while bounded distraction cards orbit a focus target, shrink under damping, and return without touching the frame.</desc><defs><path id="claude-code-focus-lock-mascot" fill="#d97757" fill-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" clip-rule="evenodd"/></defs><style>@keyframes claude-code-focus-lock-x{0%,to{transform:translateX(0)}}@keyframes claude-code-focus-lock-y{0%,to{transform:translateY(0)}}@keyframes claude-code-focus-lock-r{0%,to{transform:rotate(0)}}@keyframes claude-code-focus-lock-s{0%,50%,to{transform:scale(1)}25%,75%{transform:scale(1.025,.975)}}@keyframes claude-code-focus-lock-orbit{0%{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes claude-code-focus-lock-fade{0%,56.25%,to{opacity:1;transform:scale(1)}72.917%{opacity:.15;transform:scale(.72)}}.motion{transform-box:fill-box}.pivot-center{transform-origin:50% 50%}@media (prefers-color-scheme:dark){svg{--ink:#e8e1dc;--dim:#544c47;--panel:#322b28}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}.claude-code-focus-lock-fade{animation:claude-code-focus-lock-fade 4.8s cubic-bezier(.5,1,.89,1) infinite}</style><ellipse cx="96" cy="214" fill="var(--ink)" class="claude-code-focus-lock-shadow motion pivot-center" data-animated="true" opacity=".22" rx="50" ry="7"/><circle cx="258" cy="119" r="52" fill="none" stroke="var(--blue)" stroke-dasharray="8 9" stroke-width="4"/><circle cx="258" cy="119" r="25" fill="var(--panel)" stroke="var(--ok)" stroke-width="5"/><circle cx="258" cy="119" r="8" fill="var(--ok)"/><g data-animated="true" style="animation:claude-code-focus-lock-orbit 4.8s linear infinite;transform-origin:258px 119px"><g class="claude-code-focus-lock-fade motion pivot-center" data-animated="true"><rect width="38" height="28" x="248" y="45" fill="var(--gold)" rx="7"/></g><g class="claude-code-focus-lock-fade motion pivot-center" data-animated="true" style="animation-delay:.35s"><rect width="36" height="28" x="306" y="105" fill="var(--blue)" rx="7"/></g><g class="claude-code-focus-lock-fade motion pivot-center" data-animated="true" style="animation-delay:.7s"><rect width="42" height="28" x="228" y="168" fill="var(--dim)" rx="7"/></g></g><g transform="translate(96 204)"><g data-animated="true" style="animation:claude-code-focus-lock-x 4.8s linear infinite"><g data-animated="true" style="animation:claude-code-focus-lock-y 4.8s linear infinite"><g class="motion pivot-center" data-animated="true" style="animation:claude-code-focus-lock-r 4.8s linear infinite"><g class="motion" data-animated="true" style="transform-origin:50% 100%;animation:claude-code-focus-lock-s 4.8s linear infinite"><use data-mascot="true" href="#claude-code-focus-lock-mascot" transform="scale(4) translate(-12 -20)"/></g></g></g></g></g></svg>