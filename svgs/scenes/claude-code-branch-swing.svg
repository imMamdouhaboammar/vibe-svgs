,.63,1) infinite;transform-origin:220px 30px"><path stroke="var(--ink)" stroke-linecap="round" stroke-width="5" d="M220 30v94"/><g transform="translate(220 174)"><g class="motion pivot-center" data-animated="true" style="animation:claude-code-branch-swing-upright 4.8s cubic-bezier(.37,0,.63,1) infinite"><use data-mascot="true" href="#claude-code-branch-swing-mascot" transform="scale(4) translate(-12 -20)"/></g></g></g></svg>