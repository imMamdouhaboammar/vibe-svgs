<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-code-branch-swing-title claude-code-branch-swing-desc" role="img" viewBox="0 0 320 220"><title id="claude-code-branch-swing-title">Claude Code Branch Swing</title><desc id="claude-code-branch-swing-desc">Claude Code swings from a Git branch as a pendulum; the body counter-rotates to preserve balance and the shadow tracks arc position.</desc><style>@keyframes claude-code-branch-swing-rope{0%,to{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}@keyframes claude-code-branch-swing-upright{0%,to{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}@keyframes claude-code-branch-swing-tail{0%,to{transform:rotate(10deg)}50%{transform:rotate(-10deg)}}@keyframes claude-code-branch-swing-shadow{0%,to{transform:translateX(-39px) scaleX(.82);opacity:.12}50%{transform:translateX(39px) scaleX(.82);opacity:.12}25%,75%{transform:translateX(0) scaleX(1);opacity:.2}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><path stroke="#2b2725" stroke-linecap="round" stroke-width="8" d="M28 24h264"/><circle cx="160" cy="24" r="10" fill="#e7b85c" stroke="#2b2725" stroke-width="3"/><ellipse cx="160" cy="202" fill="#2b2725" data-animated="true" rx="54" ry="8" style="transform-box:fill-box;transform-origin:center;animation:claude-code-branch-swing-shadow 4.6s ease-in-out infinite"/><g data-animated="true" style="transform-box:view-box;transform-origin:160px 24px;animation:claude-code-branch-swing-rope 4.6s cubic-bezier(.45,0,.55,1) infinite"><path stroke="#2b2725" stroke-linecap="round" stroke-width="5" d="M160 24v99"/><path stroke="#2b2725" stroke-linecap="round" stroke-width="5" d="M160 122h44" data-animated="true" style="transform-box:fill-box;transform-origin:0 50%;animation:claude-code-branch-swing-tail 4.6s ease-in-out infinite"/><g data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-branch-swing-upright 4.6s cubic-bezier(.45,0,.55,1) infinite"><g><g class="cc-static" data-animated="true"><path fill="#d97757" fill-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" clip-rule="evenodd" transform="matrix(3.7 0 0 3.7 116 108)"/></g></g></g></g></svg>