<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" aria-labelledby="claude-code-pinball-bumper-title claude-code-pinball-bumper-desc" role="img" style="--ink:#2b2725;--dim:#d9cfc8;--panel:#f6e8e0;--brand:#d97757;--gold:#e7b85c;--ok:#4d9a73;--blue:#6b8fb8" viewBox="0 0 360 240"><title id="claude-code-pinball-bumper-title">Claude Code Pinball Bumper</title><desc id="claude-code-pinball-bumper-desc">Claude Code mascot launches like a pinball, ricocheting elastically off neon bumpers with score light flashes.</desc><defs><path id="claude-code-pinball-bumper-mascot" fill="#d97757" fill-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" clip-rule="evenodd"/></defs><style>@keyframes claude-code-pinball-bumper-x{0%,to{transform:translateX(-30px)}8.333%{transform:translateX(30px)}16.667%{transform:translateX(-15px)}25%{transform:translateX(35px)}33.333%{transform:translateX(0)}}@keyframes claude-code-pinball-bumper-y{0%,33.333%,to{transform:translateY(0)}8.333%{transform:translateY(-40px)}16.667%{transform:translateY(-20px)}25%{transform:translateY(-45px)}}@keyframes claude-code-pinball-bumper-r{0%{transform:rotate(0)}8.333%{transform:rotate(180deg)}16.667%{transform:rotate(-90deg)}25%{transform:rotate(270deg)}33.333%,to{transform:rotate(360deg)}}@keyframes claude-code-pinball-bumper-s{0%,33.333%,to{transform:scale(1)}8.333%{transform:scale(.8,1.3)}16.667%{transform:scale(1.2,.8)}25%{transform:scale(.85,1.2)}}@keyframes claude-code-pinball-bumper-bumper-flash{0%,10.417%,7.917%,to{opacity:.5;transform:scale(1)}8.75%{opacity:1;transform:scale(1.2)}}.motion{transform-box:fill-box}.pivot-center{transform-origin:50% 50%}@media (prefers-color-scheme:dark){svg{--ink:#e8e1dc;--dim:#544c47;--panel:#322b28}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}.claude-code-pinball-bumper-bumper-flash{animation:claude-code-pinball-bumper-bumper-flash 4.8s linear infinite}</style><ellipse cx="180" cy="214" fill="var(--ink)" class="claude-code-pinball-bumper-shadow motion pivot-center" data-animated="true" opacity=".22" rx="60" ry="7"/><g class="claude-code-pinball-bumper-bumper-flash motion pivot-center" data-animated="true"><circle cx="230" cy="120" r="22" fill="var(--gold)" stroke="var(--ink)" stroke-width="4"/><text x="230" y="125" fill="var(--ink)" font-size="12" font-weight="700" text-anchor="middle">1000</text></g><g class="claude-code-pinball-bumper-bumper-flash motion pivot-center" data-animated="true" style="animation-delay:.8s"><circle cx="280" cy="80" r="22" fill="var(--blue)" stroke="var(--ink)" stroke-width="4"/><text x="280" y="85" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">5000</text></g><g transform="translate(160 204)"><g data-animated="true" style="animation:claude-code-pinball-bumper-x 4.8s linear infinite"><g data-animated="true" style="animation:claude-code-pinball-bumper-y 4.8s linear infinite"><g class="motion pivot-center" data-animated="true" style="animation:claude-code-pinball-bumper-r 4.8s linear infinite"><g class="motion" data-animated="true" style="transform-origin:50% 100%;animation:claude-code-pinball-bumper-s 4.8s linear infinite"><use data-mascot="true" href="#claude-code-pinball-bumper-mascot" transform="scale(4) translate(-12 -20)"/></g></g></g></g></g></svg>