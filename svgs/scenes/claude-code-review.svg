<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-code-review-title claude-code-review-desc" role="img" viewBox="0 0 160 140"><title id="claude-code-review-title">Claude community mascot reviewing code</title><desc id="claude-code-review-desc">A fan-made terracotta coding character scans a diff panel and applies an animated approval check.</desc><defs><linearGradient id="claude-code-review-body-gradient" x1=".1" x2=".85" y1="0" y2="1"><stop offset="0" stop-color="#f7b58e"/><stop offset=".52" stop-color="#e98452"/><stop offset="1" stop-color="#b7512a"/></linearGradient><linearGradient id="claude-code-review-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ea8f5e"/><stop offset="1" stop-color="#aa4524"/></linearGradient><radialGradient id="claude-code-review-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3c2118" stop-opacity=".34"/><stop offset="1" stop-color="#3c2118" stop-opacity="0"/></radialGradient><filter id="claude-code-review-soft-shadow" width="150%" height="160%" x="-25%" y="-25%"><feDropShadow dx="0" dy="2" flood-color="#552718" flood-opacity=".18" stdDeviation="2"/></filter></defs><style>@keyframes claude-code-review-scan{0%,to{transform:translateY(-10px)}50%{transform:translateY(16px)}}@keyframes claude-code-review-stamp{0%,62%,to{transform:translateY(0) scale(1)}72%{transform:translateY(5px) scale(1.08,.9)}82%{transform:translateY(0) scale(.96,1.04)}}@keyframes claude-code-review-check{0%,68%{stroke-dashoffset:22;opacity:.2}86%,to{stroke-dashoffset:0;opacity:1}}@keyframes claude-code-review-lean{0%,to{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}@keyframes claude-code-review-panel{0%,to{transform:translateY(0)}50%{transform:translateY(-2px)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="74" cy="123" fill="url(#claude-code-review-shadow-gradient)" rx="35" ry="7"/><g data-animated="true" style="animation:claude-code-review-lean 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:80px 112px"><g filter="url(#claude-code-review-soft-shadow)"><g aria-hidden="true"><path fill="url(#claude-code-review-limb-gradient)" d="M59 92c-2 9-1 17 4 21 4 3 9 0 9-5l-1-16Z"/><ellipse cx="66" cy="111" fill="#8d3921" rx="8.5" ry="4"/><path fill="url(#claude-code-review-limb-gradient)" d="m87 92-1 16c0 5 5 8 9 5 6-4 6-13 3-21Z"/><ellipse cx="93" cy="111" fill="#8d3921" rx="8.5" ry="4"/></g><path fill="url(#claude-code-review-limb-gradient)" d="M54 62c-10 2-15 10-11 18 3 5 9 4 13-1l8-10Z"/><g data-animated="true" style="animation:claude-code-review-stamp 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:112px 80px"><path fill="url(#claude-code-review-limb-gradient)" d="M106 62c10 2 15 10 11 18-3 5-9 4-13-1l-8-10Z"/><circle cx="115" cy="82" r="5" fill="#d86d43"/></g><rect width="64" height="62" x="48" y="38" fill="url(#claude-code-review-body-gradient)" rx="24"/><path fill="#ffd2b7" d="M54 48c11-10 35-12 49-1-12-4-30-2-42 6-4 3-7 2-7-5" opacity=".34"/><path fill="#8f3a20" d="M50 78c13 13 43 20 60-2v10c-6 10-17 14-31 14-15 0-25-5-29-14Z" opacity=".18"/><ellipse cx="68" cy="62" fill="#21150f" rx="5.6" ry="7"/><ellipse cx="91" cy="62" fill="#21150f" rx="5.6" ry="7"/><circle cx="66.4" cy="59.8" r="1.7" fill="#fff" opacity=".92"/><circle cx="89.4" cy="59.8" r="1.7" fill="#fff" opacity=".92"/><path fill="none" stroke="#71311d" stroke-linecap="round" stroke-width="2.5" d="M72 80h13"/><path fill="#fff3ea" d="m80 45 2.4 7.5 7.6-2.3-5.6 5.8 5.6 5.8-7.6-2.3L80 67l-2.4-7.5-7.6 2.3 5.6-5.8-5.6-5.8 7.6 2.3Z" opacity=".12"/></g></g><g data-animated="true" style="animation:claude-code-review-panel 3s ease-in-out infinite;transform-box:view-box;transform-origin:134px 66px"><rect width="40" height="72" x="113" y="28" fill="#fcfaf8" stroke="#8b5e4b" stroke-width="2" rx="8"/><path stroke="#5d7a67" stroke-linecap="round" stroke-width="3" d="M121 41h24m-24 10h17"/><path stroke="#b85d57" stroke-linecap="round