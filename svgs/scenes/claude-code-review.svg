<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" role="img" aria-labelledby="claude-code-review-title claude-code-review-desc"><title id="claude-code-review-title">Claude community mascot reviewing code</title><desc id="claude-code-review-desc">A fan-made terracotta coding character scans a diff panel and applies an animated approval check.</desc><defs><linearGradient id="claude-code-review-body-gradient" x1=".1" x2=".85" y1="0" y2="1"><stop offset="0" stop-color="#F7B58E"/><stop offset=".52" stop-color="#E98452"/><stop offset="1" stop-color="#B7512A"/></linearGradient><linearGradient id="claude-code-review-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#EA8F5E"/><stop offset="1" stop-color="#AA4524"/></linearGradient><radialGradient id="claude-code-review-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3C2118" stop-opacity=".34"/><stop offset="1" stop-color="#3C2118" stop-opacity="0"/></radialGradient><filter id="claude-code-review-soft-shadow" width="150%" height="160%" x="-25%" y="-25%"><feDropShadow dx="0" dy="2" flood-color="#552718" flood-opacity=".18" stdDeviation="2"/></filter></defs><style>@keyframes claude-code-review-scan{0%,100%{transform:translateY(-10px)}50%{transform:translateY(16px)}}@keyframes claude-code-review-stamp{0%,62%,100%{transform:translateY(0) scale(1)}72%{transform:translateY(5px) scale(1.08,.9)}82%{transform:translateY(0) scale(.96,1.04)}}@keyframes claude-code-review-check{0%,68%{stroke-dashoffset:22;opacity:.2}86%,100%{stroke-dashoffset:0;opacity:1}}@keyframes claude-code-review-lean{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}@keyframes claude-code-review-panel{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@media (prefers-reduced-motion: reduce){[data-animated]{animation:none!important}}</style><ellipse cx="74" cy="123" rx="35" ry="7" fill="url(#claude-code-review-shadow-gradient)"/><g data-animated="true" style="animation:claude-code-revi