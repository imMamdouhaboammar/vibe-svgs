<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" role="img" aria-labelledby="claude-shipping-title claude-shipping-desc"><title id="claude-shipping-title">Claude community mascot shipping a release</title><desc id="claude-shipping-desc">A fan-made terracotta coding character launches a small deploy rocket with anticipation, ignition, lift, and recovery.</desc><defs><linearGradient id="claude-shipping-body-gradient" x1=".1" x2=".85" y1="0" y2="1"><stop offset="0" stop-color="#F7B58E"/><stop offset=".52" stop-color="#E98452"/><stop offset="1" stop-color="#B7512A"/></linearGradient><linearGradient id="claude-shipping-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#EA8F5E"/><stop offset="1" stop-color="#AA4524"/></linearGradient><radialGradient id="claude-shipping-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3C2118" stop-opacity=".34"/><stop offset="1" stop-color="#3C2118" stop-opacity="0"/></radialGradient><filter id="claude-shipping-soft-shadow" width="150%" height="160%" x="-25%" y="-25%"><feDropShadow dx="0" dy="2" flood-color="#552718" flood-opacity=".18" stdDeviation="2"/></filter></defs><style>@keyframes claude-shipping-body{0%,18%,100%{transform:translateY(0) scaleY(1)}28%{transform:translateY(2px) scaleY(.94)}52%,66%{transform:translateY(-8px) scaleY(1.04)}82%{transform:translateY(0) scaleY(.97)}}@keyframes claude-shipping-rocket{0%,24%{transform:translateY(0) rotate(-4deg)}58%,72%{transform:translateY(-48px) rotate(2deg)}100%{transform:translateY(0) rotate(-4deg)}}@keyframes claude-shipping-flame{0%,24%,100%{transform:scaleY(.5);opacity:.25}42%,72%{transform:scaleY(1.25);opacity:1}}@keyframes claude-shipping-shadow{0%,24%,100%{transform:scaleX(1);opacity:.34}58%,72%{transform:scaleX(.65);opacity:.16}}@keyframes claude-shipping-arm{0%,24%,100%{transform:rotate(0deg)}52%,72%{transform:rotate(-24deg)}}@media (prefers-reduced-motion: reduce){[data-animated]{animation:none!important}}</style><ellipse