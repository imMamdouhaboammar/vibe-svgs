<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-bug-hunting-title claude-bug-hunting-desc" role="img" viewBox="0 0 160 140"><title id="claude-bug-hunting-title">Claude community mascot bug hunting</title><desc id="claude-bug-hunting-desc">A fan-made terracotta coding character examines a scuttling bug through a magnifying glass with a glowing focus beam.</desc><defs><linearGradient id="claude-bug-hunting-body-gradient" x1=".1" x2=".85" y1="0" y2="1"><stop offset="0" stop-color="#f7b58e"/><stop offset=".52" stop-color="#e98452"/><stop offset="1" stop-color="#b7512a"/></linearGradient><linearGradient id="claude-bug-hunting-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ea8f5e"/><stop offset="1" stop-color="#aa4524"/></linearGradient><radialGradient id="claude-bug-hunting-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3c2118" stop-opacity=".34"/><stop offset="1" stop-color="#3c2118" stop-opacity="0"/></radialGradient><filter id="claude-bug-hunting-soft-shadow" width="150%" height="160%" x="-25%" y="-25%"><feDropShadow dx="0" dy="2" flood-color="#552718" flood-opacity=".18" stdDeviation="2"/></filter></defs><style>@keyframes claude-bug-hunting-body-sway{0%,to{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@keyframes claude-bug-hunting-lens-scan{0%,to{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(8px,6px) rotate(6deg)}}@keyframes claude-bug-hunting-bug-move{0%,to{transform:translate(0,0) scale(1)}25%{transform:translate(-4px,3px) scale(1.05)}75%{transform:translate(5px,-2px) scale(.95)}}@keyframes claude-bug-hunting-beam-pulse{0%,to{opacity:.2;transform:scale(.95)}50%{opacity:.5;transform:scale(1.08)}}@keyframes claude-bug-hunting-shadow{0%,to{transform:scaleX(1);opacity:.34}50%{transform:scaleX(1.05);opacity:.3}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="80" cy="122" fill="url(#claude-bug-hunting-shadow-gradient)" data-animated="true" rx="38" ry="7" style="animation:claude-bug-hunting-shadow 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:80px 122px"/><g data-animated="true" style="animation:claude-bug-hunting-body-sway 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:80px 108px"><g filter="url(#claude-bug-hunting-soft-shadow)"><g aria-hidden="true"><path fill="url(#claude-bug-hunting-limb-gradient)" d="M59 92c-2 9-1 17 4 21 4 3 9 0 9-5l-1-16Z"/><ellipse cx="66" cy="111" fill="#8d3921" rx="8.5" ry="4"/><path fill="url(#claude-bug-hunting-limb-gradient)" d="m87 92-1 16c0 5 5 8 9 5 6-4 6-13 3-21Z"/><ellipse cx="93" cy="111" fill="#8d3921" rx="8.5" ry="4"/></g><rect width="64" height="62" x="48" y="38" fill="url(#claude-bug-hunting-body-gradient)" rx="24"/><path fill="#ffd2b7" d="M54 48c11-10 35-12 49-1-12-4-30-2-42 6-4 3-7 2-7-5" opacity=".34"/><path fill="#8f3a20" d="M50 78c13 13 43 20 60-2v10c-6 10-17 14-31 14-15 0-25-5-29-14Z" opacity=".18"/><ellipse cx="68" cy="62" fill="#21150f" rx="5.6" ry="7"/><ellipse cx="91" cy="62" fill="#21150f" rx="5.6" ry="7"/><circle cx="66.4" cy="59.8" r="1.7" fill="#fff" opacity=".92"/><circle cx="89.4" cy="59.8" r="1.7" fill="#fff" opacity=".92"/><path fill="none" stroke="#71311d" stroke-linecap="round" stroke-width="3" d="M68 78c6 5 15 5 21 0"/><path fill="#fff3ea" d="m80 45 2.4 7.5 7.6-2.3-5.6 5.8 5.6 5.8-7.6-2.3L80 67l-2.4-7.5-7.6 2.3 5.6-5.8-5.6-5.8 7.6 2.3Z" opacity=".12"/></g></g><g data-animated="true" style="animation:claude-bug-hunting-lens-scan 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:115px 70px"><path stroke="#71311d" stroke-linecap="round" stroke-width="4" d="m115 80 18 18"/><circle cx="108" cy="68" r="16" fill="none" stroke="#d97757" stroke-width="3"/><circle cx="108" cy="68" r="14" fill="#eaf4ff" opacity=".35"/><circle cx="108" cy="68" r="10" fill="#ffd27d" data-animated="true" opacity=".3" style="animation:claude-bug-hunting-beam-pulse 1.6s ease-in-out infinite;transform-box:view