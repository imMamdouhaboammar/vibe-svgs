-dim:#544c47;--panel:#322b28}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="96" cy="214" fill="var(--ink)" class="claude-code-release-launch-shadow motion pivot-center" data-animated="true" opacity=".22" rx="50" ry="7"/><g class="motion pivot-center" data-animated="true" style="animation:claude-code-release-launch-rocket 4.8s cubic-bezier(.5,0,.75,1) infinite"><path fill="var(--blue)" stroke="var(--ink)" stroke-width="3" d="M269 158c0-28 13-49 26-60 13 11 26 32 26 60l-13 15h-26z"/><circle cx="295" cy="128" r="8" fill="var(--panel)"/><path stroke="var(--gold)" stroke-linecap="round" stroke-width="7" d="M282 168l-12 16M308 168l12 16"/></g><g fill="var(--dim)" class="motion pivot-center" data-animated="true" style="animation:claude-code-release-launch-smoke 4.8s linear infinite"><circle cx="281" cy="202" r="13"/><circle cx="298" cy="204" r="17"/><circle cx="316" cy="201" r="12"/></g><path stroke="var(--dim)" stroke-linecap="round" stroke-width="5" d="M250 214h84"/><g transform="translate(96 204)"><g data-animated="true" style="animation:claude-code-release-launch-x 4.8s linear infinite"><g data-animated="true" style="animation:claude-code-release-launch-y 4.8s linear infinite"><g class="motion pivot-center" data-animated="true" style="animation:claude-code-release-launch-r 4.8s linear infinite"><g class="motion" data-animated="true" style="transform-origin:50% 100%;animation:claude-code-release-launch-s 4.8s linear infinite"><use data-mascot="true" href="#claude-code-release-launch-mascot" transform="scale(4) translate(-12 -20)"/></g></g></g></g></g></svg>