ue" style="animation:claude-code-lighthouse-audit-beam 4.8s ease-in-out infinite;transform-origin:140px 110px"><path fill="var(--gold)" d="M140 110L280 50v100Z" opacity=".35"/><circle cx="140" cy="110" r="14" fill="var(--gold)" stroke="var(--ink)" stroke-width="3"/></g><g class="motion pivot-center" data-animated="true" style="animation:claude-code-lighthouse-audit-score-glow 4.8s ease-in-out infinite"><circle cx="280" cy="100" r="32" fill="var(--ok)" stroke="var(--ink)" stroke-width="4"/><text x="280" y="107" fill="#fff" font-family="ui-monospace,monospace" font-size="20" font-weight="700" text-anchor="middle">100</text></g><g transform="translate(96 204)"><g data-animated="true" style="animation:claude-code-lighthouse-audit-x 4.8s linear infinite"><g data-animated="true" style="animation:claude-code-lighthouse-audit-y 4.8s linear infinite"><g class="motion pivot-center" data-animated="true" style="animation:claude-code-lighthouse-audit-r 4.8s linear infinite"><g class="motion" data-animated="true" style="transform-origin:50% 100%;animation:claude-code-lighthouse-audit-s 4.8s linear infinite"><use data-mascot="true" href="#claude-code-lighthouse-audit-mascot" transform="scale(4) translate(-12 -20)"/></g></g></g></g></g></svg>