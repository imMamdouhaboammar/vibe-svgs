prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="96" cy="214" fill="var(--ink)" class="claude-code-context-juggle-shadow motion pivot-center" data-animated="true" opacity=".22" rx="50" ry="7"/><g class="motion pivot-center" data-animated="true" style="animation:claude-code-context-juggle-card-0 4.8s linear infinite"><rect width="43" height="54" x="196" y="118" fill="var(--panel)" stroke="var(--dim)" stroke-width="3" rx="8"/><path stroke="var(--blue)" stroke-linecap="round" stroke-width="4" d="M206 136h23M206 147h18M206 158h25"/></g><g class="motion pivot-center" data-animated="true" style="animation:claude-code-context-juggle-card-1 4.8s linear infinite"><rect width="43" height="54" x="248" y="94" fill="var(--panel)" stroke="var(--dim)" stroke-width="3" rx="8"/><path stroke="var(--blue)" stroke-linecap="round" stroke-width="4" d="M258 112h23M258 123h18M258 134h25"/></g><g class="motion pivot-center" data-animated="true" style="animation:claude-code-context-juggle-card-2 4.8s linear infinite"><rect width="43" height="54" x="300" y="120" fill="var(--panel)" stroke="var(--dim)" stroke-width="3" rx="8"/><path stroke="var(--blue)" stroke-linecap="round" stroke-width="4" d="M310 138h23M310 149h18M310 160h25"/></g><g transform="translate(96 204)"><g data-animated="true" style="animation:claude-code-context-juggle-x 4.8s linear infinite"><g data-animated="true" style="animation:claude-code-context-juggle-y 4.8s linear infinite"><g class="motion pivot-center" data-animated="true" style="animation:claude-code-context-juggle-r 4.8s linear infinite"><g class="motion" data-animated="true" style="transform-origin:50% 100%;animation:claude-code-context-juggle-s 4.8s linear infinite"><use data-mascot="true" href="#claude-code-context-juggle-mascot" transform="scale(4) translate(-12 -20)"/></g></g></g></g></g></svg>