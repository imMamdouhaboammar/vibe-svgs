<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-code-context-juggle-title claude-code-context-juggle-desc" role="img" viewBox="0 0 320 220"><title id="claude-code-context-juggle-title">Claude Code Context Juggle</title><desc id="claude-code-context-juggle-desc">Three context cards follow staggered parabolic arcs with rotational inertia while Claude Code maintains balance.</desc><style>@keyframes claude-code-context-juggle-body{0%,to{transform:translateY(0) rotate(0)}25%{transform:translateY(-2px) rotate(-2deg)}50%{transform:translateY(1px) rotate(0)}75%{transform:translateY(-2px) rotate(2deg)}}@keyframes claude-code-context-juggle-a{0%,to{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(45px,-74px) rotate(6deg)}50%{transform:translate(91px,0) rotate(12deg)}75%{transform:translate(45px,34px) rotate(2deg)}}@keyframes claude-code-context-juggle-b{0%,to{transform:translate(91px,0) rotate(8deg)}25%{transform:translate(45px,34px) rotate(-2deg)}50%{transform:translate(0,0) rotate(-12deg)}75%{transform:translate(45px,-74px) rotate(-6deg)}}@keyframes claude-code-context-juggle-c{0%,to{transform:translate(45px,-74px) rotate(0)}25%{transform:translate(91px,0) rotate(8deg)}50%{transform:translate(45px,34px) rotate(0)}75%{transform:translate(0,0) rotate(-8deg)}}@keyframes claude-code-context-juggle-shadow{0%,to{transform:scaleX(1)}25%,75%{transform:scaleX(.94)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="157" cy="202" fill="#2b2725" data-animated="true" opacity=".17" rx="52" ry="8" style="transform-box:fill-box;transform-origin:center;animation:claude-code-context-juggle-shadow 3.6s ease-in-out infinite"/><g><g data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-context-juggle-body 3.6s ease-in-out infinite"><path fill="#d97757" fill-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.