l)" rx="18"/><ellipse cx="99" cy="211" fill="var(--ink)" class="claude-code-build-sleep-shadow motion pivot-center" data-animated="true" opacity=".18" rx="54" ry="7"/><g fill="#8a78a8" font-family="ui-monospace,monospace" font-weight="700"><text x="146" y="118" class="claude-code-build-sleep-z" data-animated="true" font-size="22">Z</text><text x="169" y="95" class="claude-code-build-sleep-z" data-animated="true" font-size="17" style="animation-delay:1s">Z</text></g><rect width="111" height="126" x="216" y="62" fill="var(--ink)" rx="13"/><circle cx="237" cy="84" r="8" fill="var(--ok)"/><path stroke="var(--ok)" stroke-linecap="round" stroke-width="5" d="M255 84h47M233 111h69M233 136h55M233 161h62"/><g class="motion pivot-center" data-animated="true" style="animation:claude-code-build-sleep-success 4.8s cubic-bezier(.3,.85,.4,1) infinite"><path fill="var(--ok)" d="M224 25h99v40h-22l-10 11v-11h-67z"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" d="M247 45l9 9 18-20"/></g><g transform="translate(99 197)"><g data-animated="true" style="animation:claude-code-build-sleep-x 4.8s linear infinite"><g data-animated="true" style="animation:claude-code-build-sleep-y 4.8s linear infinite"><g class="motion pivot-center" data-animated="true" style="animation:claude-code-build-sleep-r 4.8s linear infinite"><g class="motion" data-animated="true" style="transform-origin:50% 100%;animation:claude-code-build-sleep-s 4.8s linear infinite"><use data-mascot="true" href="#claude-code-build-sleep-mascot" transform="scale(4) translate(-12 -20)"/></g></g></g></g></g></svg>