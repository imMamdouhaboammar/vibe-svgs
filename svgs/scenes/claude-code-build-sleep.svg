<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-code-build-sleep-title claude-code-build-sleep-desc" role="img" viewBox="0 0 320 220"><title id="claude-code-build-sleep-title">Claude Code Build Sleep</title><desc id="claude-code-build-sleep-desc">Claude Code sleeps through a build with slow breathing, synchronized shadow expansion, buoyant Zs, and a gentle success notification.</desc><style>@keyframes claude-code-build-sleep-breath{0%,to{transform:scale(1)}50%{transform:scale(1.03,.97) translateY(2px)}}@keyframes claude-code-build-sleep-shadow{0%,to{transform:scaleX(1)}50%{transform:scaleX(1.04)}}@keyframes claude-code-build-sleep-z-a{0%{transform:translate(0,0) scale(.7);opacity:0}25%{opacity:.7}to{transform:translate(18px,-46px) scale(1.2);opacity:0}}@keyframes claude-code-build-sleep-z-b{0%{transform:translate(0,0) scale(.7);opacity:0}25%{opacity:.6}to{transform:translate(15px,-42px) scale(1.15);opacity:0}}@keyframes claude-code-build-sleep-z-c{0%{transform:translate(0,0) scale(.7);opacity:0}25%{opacity:.5}to{transform:translate(12px,-38px) scale(1.1);opacity:0}}@keyframes claude-code-build-sleep-build{0%,to{opacity:.25}50%{opacity:1}}@keyframes claude-code-build-sleep-bubble{0%,58%{transform:translateY(14px) scale(.7);opacity:0}72%{transform:translateY(-3px) scale(1.08);opacity:1}82%,to{transform:translateY(0) scale(1);opacity:1}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><rect width="154" height="32" x="33" y="161" fill="#f6e8e0" rx="16"/><ellipse cx="105" cy="189" fill="#2b2725" data-animated="true" opacity=".14" rx="58" ry="8" style="transform-box:fill-box;transform-origin:center;animation:claude-code-build-sleep-shadow 5.2s ease-in-out infinite"/><g><g><g data-animated="true" style="transform-box:fill-box;transform-origin:50% 100%;animation:claude-code-build-sleep-breath 5.2s ease-in-out infinite"><path fill="#d97757" fill-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" clip-rule="evenodd" transform="rotate(7 -698.443 454.697)scale(4.2)"/></g></g></g><g fill="#8a78a8" font-family="monospace" font-weight="700"><text x="132" y="103" data-animated="true" font-size="24" style="animation:claude-code-build-sleep-z-a 3s ease-out infinite">Z</text><text x="151" y="83" data-animated="true" font-size="19" style="animation:claude-code-build-sleep-z-b 3s 1s ease-out infinite">Z</text><text x="168" y="67" data-animated="true" font-size="15" style="animation:claude-code-build-sleep-z-c 3s 2s ease-out infinite">Z</text></g><rect width="85" height="83" x="207" y="62" fill="#2b2725" rx="12"/><circle cx="227" cy="82" r="8" fill="#4d9a73" data-animated="true" style="animation:claude-code-build-sleep-build 2.2s ease-in-out infinite"/><path stroke="#4d9a73" stroke-linecap="round" stroke-width="5" d="M244 82h28M221 105h54M221 124h37"/><g data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-build-sleep-bubble 5.2s cubic-bezier(.2,.9,.2,1) infinite"><path fill="#4d9a73" d="M213 31h76v37h-18l-8 10v-10h-50z"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" d="M231 49l8 8 15-18"/></g></svg>