<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-code-incident-response-title claude-code-incident-response-desc" role="img" viewBox="0 0 320 220"><title id="claude-code-incident-response-title">Claude Code Incident Response</title><desc id="claude-code-incident-response-desc">Claude Code dashes toward an incident and fires an extinguishing blast that displaces flame and releases fading smoke.</desc><style>@keyframes claude-code-incident-response-dash{0%,12%{transform:translateX(-22px) rotate(-7deg)}34%{transform:translateX(40px) rotate(7deg)}48%,to{transform:translateX(56px) rotate(1deg)}}@keyframes claude-code-incident-response-alert{to{transform:scale(1.08) rotate(2deg)}}@keyframes claude-code-incident-response-flame{0%{transform:scale(.9,1.05) rotate(-2deg)}to{transform:scale(1.08,.9) rotate(3deg)}}@keyframes claude-code-incident-response-blast{0%,40%{stroke-dashoffset:90;opacity:0}58%{stroke-dashoffset:0;opacity:1}78%,to{stroke-dashoffset:-90;opacity:0}}@keyframes claude-code-incident-response-smoke{0%,48%{transform:translate(0,0) scale(.4);opacity:0}62%{opacity:.5}to{transform:translate(26px,-38px) scale(1.5);opacity:0}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><g data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-incident-response-alert .5s ease-in-out infinite alternate" transform="translate(35 32)"><path fill="#e7b85c" stroke="#2b2725" stroke-linejoin="round" stroke-width="4" d="M34 0l34 58H0z"/><path stroke="#2b2725" stroke-linecap="round" stroke-width="6" d="M34 18v20"/><circle cx="34" cy="47" r="4" fill="#2b2725"/></g><ellipse cx="137" cy="194" fill="#2b2725" opacity=".16" rx="50" ry="8"/><g><g data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-incident-response-dash 4.2s cubic-bezier(.3,0,.2,1) infinite"><path fill="#d97757" fill-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" clip-rule="evenodd" transform="matrix(3.9 0 0 3.9 58 101)"/></g></g><path fill="none" stroke="#6b8fb8" stroke-linecap="round" stroke-width="12" d="M186 141c28-18 51-25 78-17" data-animated="true" style="stroke-dasharray:90;stroke-dashoffset:90;animation:claude-code-incident-response-blast 4.2s ease-out infinite"/><g data-animated="true" style="transform-box:fill-box;transform-origin:50% 100%;animation:claude-code-incident-response-flame .22s ease-in-out infinite alternate"><path fill="#c65a4c" d="M0 55c-14-18 5-28-2-51 24 15 38 29 28 51z" transform="translate(270 97)"/><path fill="#e7b85c" d="M8 55c-7-10 4-18 3-29 12 8 19 18 14 29z" transform="translate(270 97)"/></g><circle cx="271" cy="112" r="17" fill="#d9c5bb" data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-incident-response-smoke 4.2s ease-out infinite"/></svg>