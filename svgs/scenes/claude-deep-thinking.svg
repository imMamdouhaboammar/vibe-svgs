ransform-box:view-box;transform-origin:80px 112px"><g filter="url(#claude-deep-thinking-soft-shadow)"><g aria-hidden="true"><path fill="url(#claude-deep-thinking-limb-gradient)" d="M59 92c-2 9-1 17 4 21 4 3 9 0 9-5l-1-16Z"/><ellipse cx="66" cy="111" fill="#8D3921" rx="8.5" ry="4"/><path fill="url(#claude-deep-thinking-limb-gradient)" d="m87 92-1 16c0 5 5 8 9 5 6-4 6-13 3-21Z"/><ellipse cx="93" cy="111" fill="#8D3921" rx="8.5" ry="4"/></g><g data-animated="true" style="animation:claude-deep-thinking-hand 2.8s ease-in-out infinite;transform-box:view-box;transform-origin:55px 68px"><path fill="url(#claude-deep-thinking-limb-gradient)" d="M54 62c-11 3-15 12-10 19 4 5 10 3 13-3l7-10Z"/><circle cx="46" cy="80" r="5.2" fill="#D86D43"/></g><path fill="url(#claude-deep-thinking-limb-gradient)" d="M106 63c8 3 12 10 9 16-3 5-9 3-12-2l-6-9Z"/><rect width="64" height="62" x="48" y="38" fill="url(#claude-deep-thinking-body-gradient)" rx="24"/><path fill="#FFD2B7" d="M54 48c11-10 35-12 49-1-12-4-30-2-42 6-4 3-7 2-7-5" opacity=".34"/><path fill="#8F3A20" d="M50 78c13 13 43 20 60-2v10c-6 10-17 14-31 14-15 0-25-5-29-14Z" opacity=".18"/><ellipse cx="68" cy="62" fill="#21150F" rx="5.6" ry="7"/><ellipse cx="91" cy="62" fill="#21150F" rx="5.6" ry="7"/><circle cx="66.4" cy="59.8" r="1.7" fill="#FFF" opacity=".92"/><circle cx="89.4" cy="59.8" r="1.7" fill="#FFF" opacity=".92"/><path fill="none" stroke="#71311D" stroke-linecap="round" stroke-width="2.5" d="M72 80h13"/><path fill="#FFF3EA" d="m80 45 2.4 7.5 7.6-2.3-5.6 5.8 5.6 5.8-7.6-2.3-2.4 7.5-2.4-7.5-7.6 2.3 5.6-5.8-5.6-5.8 7.6 2.3Z" opacity=".12"/></g></g><g data-animated="true" style="animation:claude-deep-thinking-orbit-a 6s linear infinite;transform-box:view-box;transform-origin:80px 48px"><circle cx="80" cy="17" r="5" fill="#D97757"/><circle cx="111" cy="48" r="4" fill="#F0A27B"/></g><g data-animated="true" style="animation:claude-deep-thinking-orbit-b 8s linear infinite;transform-box:view-box;transform-origin:80px 48px"><rect x="44