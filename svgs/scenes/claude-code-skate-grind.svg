ated="true" style="animation:claude-code-skate-grind-board 4.8s ease-in-out infinite"><path stroke="var(--gold)" stroke-linecap="round" stroke-width="5" d="M155 196h50"/><circle cx="162" cy="201" r="3" fill="var(--ink)"/><circle cx="198" cy="201" r="3" fill="var(--ink)"/></g><g transform="translate(180 204)"><g data-animated="true" style="animation:claude-code-skate-grind-x 4.8s linear infinite"><g data-animated="true" style="animation:claude-code-skate-grind-y 4.8s linear infinite"><g class="motion pivot-center" data-animated="true" style="animation:claude-code-skate-grind-r 4.8s linear infinite"><g class="motion" data-animated="true" style="transform-origin:50% 100%;animation:claude-code-skate-grind-s 4.8s linear infinite"><use data-mascot="true" href="#claude-code-skate-grind-mascot" transform="scale(4) translate(-12 -20)"/></g></g></g></g></g></svg>