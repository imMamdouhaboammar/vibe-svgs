e-hot-reload-shadow motion pivot-center" data-animated="true" opacity=".22" rx="50" ry="7"/><rect width="110" height="110" x="220" y="50" fill="var(--ink)" stroke="var(--dim)" stroke-width="3" rx="12"/><g class="motion pivot-center" data-animated="true" style="animation:claude-code-hot-reload-flash 4.8s linear infinite"><rect width="80" height="78" x="235" y="66" fill="var(--panel)" rx="8"/><path stroke="var(--ok)" stroke-linecap="round" stroke-width="5" d="M247 82h56M247 98h42M247 114h48"/></g><g data-animated="true" style="animation:claude-code-hot-reload-switch 4.8s ease-in-out infinite;transform-origin:195px 120px"><rect width="30" height="16" x="180" y="112" fill="var(--gold)" stroke="var(--ink)" stroke-width="3" rx="8"/><circle cx="195" cy="120" r="6" fill="var(--ink)"/></g><g transform="translate(96 204)"><g data-animated="true" style="animation:claude-code-hot-reload-x 4.8s linear infinite"><g data-animated="true" style="animation:claude-code-hot-reload-y 4.8s linear infinite"><g class="motion pivot-center" data-animated="true" style="animation:claude-code-hot-reload-r 4.8s linear infinite"><g class="motion" data-animated="true" style="transform-origin:50% 100%;animation:claude-code-hot-reload-s 4.8s linear infinite"><use data-mascot="true" href="#claude-code-hot-reload-mascot" transform="scale(4) translate(-12 -20)"/></g></g></g></g></g></svg>