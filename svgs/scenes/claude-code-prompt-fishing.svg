<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-code-prompt-fishing-title claude-code-prompt-fishing-desc" role="img" viewBox="0 0 320 220"><title id="claude-code-prompt-fishing-title">Claude Code Prompt Fishing</title><desc id="claude-code-prompt-fishing-desc">Claude Code waits for a prompt bite, then loads the rod, stretches the line, and lifts a catch with elastic overshoot.</desc><style>@keyframes claude-code-prompt-fishing-body{0%,48%,to{transform:rotate(0) translateX(0)}62%{transform:rotate(-8deg) translateX(-5px)}74%{transform:rotate(4deg) translateX(3px)}84%{transform:rotate(0)}}@keyframes claude-code-prompt-fishing-rod{0%,45%,84%,to{transform:rotate(0)}58%{transform:rotate(-18deg)}72%{transform:rotate(7deg)}}@keyframes claude-code-prompt-fishing-line{0%,45%{stroke-dashoffset:0}58%{stroke-dashoffset:-34}84%,to{stroke-dashoffset:-10}}@keyframes claude-code-prompt-fishing-bobber{0%,36%,64%,to{transform:translateY(0)}45%{transform:translateY(8px)}54%{transform:translateY(-9px)}}@keyframes claude-code-prompt-fishing-catch{0%,52%{transform:translate(0,0) scale(.2);opacity:0}66%{transform:translate(-38px,-68px) scale(1.15);opacity:1}84%,to{transform:translate(-62px,-92px) scale(1);opacity:1}}@keyframes claude-code-prompt-fishing-ripple{0%{transform:scale(.2);opacity:.5}to{transform:scale(1.4);opacity:0}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="84" cy="194" fill="#2b2725" opacity=".16" rx="45" ry="7"/><g><g data-animated="true" style="transform-box:fill-box;transform-origin:50% 80%;animation:claude-code-prompt-fishing-body 5s cubic-bezier(.3,0,.2,1) infinite"><path fill="#d97757" fill-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" clip-rule="evenodd" transform="matrix(3.9 0 0 3.9 39 101)"/></g></g><g data-animated="true" style="transform-box:fill-box;transform-origin:10% 90%;animation:claude-code-prompt-fishing-rod 5s cubic-bezier(.2,.9,.2,1) infinite"><path fill="none" stroke="#2b2725" stroke-linecap="round" stroke-width="5" d="M120 133C169 73 220 60 278 69"/><path fill="none" stroke="#6b8fb8" stroke-width="3" d="M278 69v91" data-animated="true" style="stroke-dasharray:170;stroke-dashoffset:0;animation:claude-code-prompt-fishing-line 5s ease-in-out infinite"/></g><g data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-prompt-fishing-bobber 5s cubic-bezier(.2,.8,.2,1) infinite"><circle cx="278" cy="160" r="9" fill="#c65a4c"/><path stroke="#fff" stroke-width="3" d="M278 151v18"/></g><ellipse cx="278" cy="173" fill="#6b8fb8" opacity=".22" rx="31" ry="8"/><ellipse cx="278" cy="173" fill="none" stroke="#6b8fb8" stroke-width="3" data-animated="true" rx="27" ry="7" style="transform-box:fill-box;transform-origin:center;animation:claude-code-prompt-fishing-ripple 2s ease-out infinite"/><g data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-prompt-fishing-catch 5s cubic-bezier(.15,1.4,.25,1) infinite"><path fill="#e7b85c" stroke="#2b2725" stroke-linejoin="round" stroke-width="3" d="M0 0c23-15 35 4 42 13-8 9-22 26-42 11l-14 8 3-15-3-15z" transform="translate(278 151)"/><path stroke="#2b2725" stroke-linecap="round" stroke-width="3" d="M10 10h19" transform="translate(278 151)"/></g></svg>