2M176 124h54"/><path stroke="#c65a4c" stroke-linecap="round" stroke-width="5" d="M177 145h27"/><path stroke="#4d9a73" stroke-linecap="round" stroke-width="5" d="M213 145h42" data-animated="true" style="animation:claude-code-review-pass-comment 4s ease-out infinite;transform-origin:left center"/><circle cx="247" cy="164" r="23" fill="#4d9a73"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" d="M234 164l9 9 18-22" data-animated="true" style="stroke-dasharray:58;stroke-dashoffset:58;animation:claude-code-review-pass-check 4s ease-out infinite"/></g></svg>