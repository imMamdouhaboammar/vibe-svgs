otion pivot-center" data-animated="true" style="animation:claude-code-review-pass-sheet 4.8s cubic-bezier(.3,.85,.4,1) infinite"><rect width="148" height="154" x="182" y="44" fill="var(--panel)" stroke="var(--dim)" stroke-width="3" rx="14"/><path stroke="var(--blue)" stroke-linecap="round" stroke-width="6" d="M204 77h86M204 103h105M204 129h79"/><circle cx="295" cy="161" r="22" fill="var(--ok)"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" d="M283 161l9 9 17-20" data-animated="true" style="stroke-dasharray:34;animation:claude-code-review-pass-check 4.8s linear infinite"/></g><g transform="translate(96 204)"><g data-animated="true" style="animation:claude-code-review-pass-x 4.8s linear infinite"><g data-animated="true" style="animation:claude-code-review-pass-y 4.8s linear infinite"><g class="motion pivot-center" data-animated="true" style="animation:claude-code-review-pass-r 4.8s linear infinite"><g class="motion" data-animated="true" style="transform-origin:50% 100%;animation:claude-code-review-pass-s 4.8s linear infinite"><use data-mascot="true" href="#claude-code-review-pass-mascot" transform="scale(4) translate(-12 -20)"/></g></g></g></g></g></svg>