<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-code-agent-conductor-title claude-code-agent-conductor-desc" role="img" viewBox="0 0 320 220"><title id="claude-code-agent-conductor-title">Claude Code Agent Conductor</title><desc id="claude-code-agent-conductor-desc">Claude Code conducts three task cards through a synchronized pipeline with baton rhythm and phase-shifted card motion.</desc><style>@keyframes claude-code-agent-conductor-body{0%,to{transform:translateY(0) rotate(0)}25%{transform:translateY(-2px) rotate(-2deg)}75%{transform:translateY(-2px) rotate(2deg)}}@keyframes claude-code-agent-conductor-baton{0%,to{transform:rotate(-32deg)}50%{transform:rotate(38deg)}}@keyframes claude-code-agent-conductor-card-a{0%,to{transform:translate(0,0) rotate(-4deg)}33%{transform:translate(84px,-37px) rotate(3deg)}66%{transform:translate(160px,14px) rotate(0)}}@keyframes claude-code-agent-conductor-card-b{0%,to{transform:translate(84px,-37px) rotate(3deg)}33%{transform:translate(160px,14px) rotate(0)}66%{transform:translate(0,0) rotate(-4deg)}}@keyframes claude-code-agent-conductor-card-c{0%,to{transform:translate(160px,14px) rotate(0)}33%{transform:translate(0,0) rotate(-4deg)}66%{transform:translate(84px,-37px) rotate(3deg)}}@keyframes claude-code-agent-conductor-pulse{0%{transform:scale(.3);opacity:.6}to{transform:scale(1.5);opacity:0}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="83" cy="194" fill="#2b2725" opacity=".16" rx="44" ry="7"/><g><g data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-agent-conductor-body 4s ease-in-out infinite"><path fill="#d97757" fill-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" clip-rule="evenodd" transform="matrix(3.9 0 0 3.9 38 101)"/></g></g><g data-animated="true" style="transform-box:fill-box;transform-origin:0 100%;animation:claude-code-agent-conductor-baton 1.6s cubic-bezier(.4,0,.2,1) infinite" transform="translate(128 129)"><path stroke="#2b2725" stroke-linecap="round" stroke-width="5" d="M0 0L52-58"/><circle cx="52" cy="-58" r="7" fill="#e7b85c"/></g><g><g data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-agent-conductor-card-a 4s cubic-bezier(.2,.8,.2,1) infinite" transform="translate(143 132)"><rect width="61" height="43" fill="#6b8fb8" rx="9"/><path stroke="#fff" stroke-linecap="round" stroke-width="4" d="M14 15h32M14 28h22"/></g><g data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-agent-conductor-card-b 4s cubic-bezier(.2,.8,.2,1) infinite" transform="translate(143 132)"><rect width="61" height="43" fill="#4d9a73" rx="9"/><path stroke="#fff" stroke-linecap="round" stroke-width="4" d="M14 15h32M14 28h22"/></g><g data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-agent-conductor-card-c 4s cubic-bezier(.2,.8,.2,1) infinite" transform="translate(143 132)"><rect width="61" height="43" fill="#8a78a8" rx="9"/><path stroke="#fff" stroke-linecap="round" stroke-width="4" d="M14 15h32M14 28h22"/></g></g><circle cx="180" cy="62" r="20" fill="none" stroke="#e7b85c" stroke-width="4" data-animated="true" style="transform-box:fill-box;transform-origin:center;animation:claude-code-agent-conductor-pulse 1.6s ease-out infinite"/></svg>