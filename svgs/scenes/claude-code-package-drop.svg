00%}.pivot-center{transform-origin:50% 50%}@media (prefers-color-scheme:dark){svg{--ink:#e8e1dc;--dim:#544c47;--panel:#322b28}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="96" cy="214" fill="var(--ink)" class="claude-code-package-drop-shadow motion pivot-center" data-animated="true" opacity=".22" rx="50" ry="7"/><g class="motion pivot-bottom" data-animated="true" style="animation:claude-code-package-drop-box 4.8s cubic-bezier(.11,0,.5,0) infinite"><rect width="82" height="62" x="220" y="42" fill="var(--gold)" stroke="var(--ink)" stroke-width="4" rx="9"/><path stroke="var(--ink)" stroke-width="4" d="M261 42v62M220 66h82"/><g class="motion pivot-center" data-animated="true" style="animation:claude-code-package-drop-lid 4.8s cubic-bezier(.3,.85,.4,1) infinite"><path fill="var(--panel)" stroke="var(--ink)" stroke-width="4" d="M216 43h90v18h-90z"/></g></g><path stroke="var(--dim)" stroke-linecap="round" stroke-width="5" d="M190 216h139"/><g transform="translate(96 204)"><g data-animated="true" style="animation:claude-code-package-drop-x 4.8s linear infinite"><g data-animated="true" style="animation:claude-code-package-drop-y 4.8s linear infinite"><g class="motion pivot-center" data-animated="true" style="animation:claude-code-package-drop-r 4.8s linear infinite"><g class="motion pivot-bottom" data-animated="true" style="animation:claude-code-package-drop-s 4.8s linear infinite"><use data-mascot="true" href="#claude-code-package-drop-mascot" transform="scale(4) translate(-12 -20)"/></g></g></g></g></g></svg>