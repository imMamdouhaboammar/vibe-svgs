<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="claude-logo-title claude-logo-desc">
  <title id="claude-logo-title">Claude Community Brand Mark</title>
  <desc id="claude-logo-desc">A fan-made terracotta asterisk star mark representing Claude workflows.</desc>
  <defs>
    <linearGradient id="claude-logo-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7B58E"/>
      <stop offset="0.5" stop-color="#E98452"/>
      <stop offset="1" stop-color="#B7512A"/>
    </linearGradient>
  </defs>
  <style>
    .claude-logo-spin {
      animation: claude-logo-spin 12s linear infinite;
      transform-box: view-box;
      transform-origin: 60px 60px;
    }
    @keyframes claude-logo-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <g class="claude-logo-spin" data-animated="true">
    <path d="M60 20 L64.8 45 L88.3 35 L70 55 L95 60 L70 65 L88.3 85 L64.8 75 L60 100 L55.2 75 L31.7 85 L50 65 L25 60 L50 55 L31.7 35 L55.2 45 Z" fill="url(#claude-logo-gradient)"/>
  </g>
</svg>
