<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="openai-logo-title openai-logo-desc">
  <title id="openai-logo-title">OpenAI Community Brand Mark</title>
  <desc id="openai-logo-desc">A fan-made vector loop mark inspired by OpenAI workflows.</desc>
  <defs>
    <linearGradient id="openai-logo-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <style>
    .openai-logo-pulse {
      animation: openai-logo-pulse 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 60px;
    }
    @keyframes openai-logo-pulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.05) rotate(180deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <g class="openai-logo-pulse" data-animated="true">
    <path d="M60 25 C40 25 25 40 25 60 C25 80 40 95 60 95 C80 95 95 80 95 60" fill="none" stroke="url(#openai-logo-gradient)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="12" fill="url(#openai-logo-gradient)"/>
  </g>
</svg>
