<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="openaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10A37F" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="openaiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .swirl-spin {
      animation: spin-swirl 12s linear infinite;
      transform-origin: 30px 30px;
    }
    @keyframes spin-swirl {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .brand-title {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 24px;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .brand-tag {
      font-family: monospace;
      font-weight: 600;
      font-size: 10px;
      fill: #10A37F;
      letter-spacing: 1px;
    }
    @media (prefers-reduced-motion: reduce) {
      .swirl-spin { animation: none !important; }
    }
  </style>

  <!-- OpenAI Spiral Swirl Mark -->
  <g id="icon-mark" class="swirl-spin" filter="url(#openaiGlow)">
    <circle cx="30" cy="30" r="20" fill="none" stroke="url(#openaiGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="100 20" />
    <circle cx="30" cy="30" r="10" fill="none" stroke="url(#openaiGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 10" />
  </g>

  <!-- Combination Mark Text -->
  <g id="brand-text" transform="translate(62, 35)">
    <text x="0" y="0" class="brand-title">OpenAI</text>
    <text x="0" y="16" class="brand-tag">GPT-4.5 &amp; CODEX</text>
  </g>
</svg>
