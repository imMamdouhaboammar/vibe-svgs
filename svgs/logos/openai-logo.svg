<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="openai-logo-title openai-logo-desc" role="img" viewBox="0 0 120 120"><title id="openai-logo-title">OpenAI Community Brand Mark</title><desc id="openai-logo-desc">A fan-made vector loop mark inspired by OpenAI workflows.</desc><defs><linearGradient id="openai-logo-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs><style>@keyframes openai-logo-pulse{0%,to{transform:scale(1) rotate(0deg)}50%{transform:scale(1.05) rotate(180deg)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><g data-animated="true" style="animation:openai-logo-pulse 3s ease-in-out infinite;transform-box:view-box;transform-origin:60px 60px"><path fill="none" stroke="url(#openai-logo-gradient)" stroke-linecap="round" stroke-width="10" d="M60 25c-20 0-35 15-35 35s15 35 35 35 35-15 35-35"/><circle cx="60" cy="60" r="12" fill="url(#openai-logo-gradient)"/></g></svg>