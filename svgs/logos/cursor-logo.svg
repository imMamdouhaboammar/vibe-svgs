<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="cursorLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="cursorLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .cube-pulse {
      animation: pulse-cube 3s infinite ease-in-out alternate;
      transform-origin: 30px 30px;
    }
    @keyframes pulse-cube {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.04); }
    }
    .brand-title {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 24px;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .brand-tag {
      font-family: monospace;
      font-weight: 600;
      font-size: 10px;
      fill: #10B981;
      letter-spacing: 1px;
    }
    @media (prefers-reduced-motion: reduce) {
      .cube-pulse { animation: none !important; }
    }
  </style>

  <!-- Cursor Cube Mark -->
  <g id="icon-mark" class="cube-pulse" filter="url(#cursorLogoGlow)">
    <polygon points="30,10 48,20 48,40 30,50 12,40 12,20" fill="url(#cursorLogoGrad)" />
    <line x1="30" y1="10" x2="30" y2="50" stroke="#064E3B" stroke-width="1.5" />
    <line x1="30" y1="30" x2="48" y2="20" stroke="#064E3B" stroke-width="1.5" />
    <line x1="30" y1="30" x2="12" y2="20" stroke="#064E3B" stroke-width="1.5" />
  </g>

  <!-- Combination Mark Text -->
  <g id="brand-text" transform="translate(62, 35)">
    <text x="0" y="0" class="brand-title">Cursor</text>
    <text x="0" y="16" class="brand-tag">THE AI CODE EDITOR</text>
  </g>
</svg>
