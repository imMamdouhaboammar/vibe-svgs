<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="cursor-logo-title cursor-logo-desc" role="img" viewBox="0 0 120 120"><title id="cursor-logo-title">Cursor Community Brand Mark</title><desc id="cursor-logo-desc">A fan-made dark graphite cube mark inspired by Cursor editor workflows.</desc><defs><linearGradient id="cursor-logo-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/></linearGradient></defs><style>@keyframes cursor-logo-bounce{0%,to{transform:translateY(0)}50%{transform:translateY(-4px)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><g data-animated="true" style="animation:cursor-logo-bounce 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:60px 60px"><path fill="#1e293b" stroke="url(#cursor-logo-gradient)" stroke-width="4" d="m60 25 35 20v35l-35 20-35-20V45Z"/><path fill="none" stroke="url(#cursor-logo-gradient)" stroke-width="3" d="M60 25v75m0-40 35-15M60 60 25 45"/></g></svg>