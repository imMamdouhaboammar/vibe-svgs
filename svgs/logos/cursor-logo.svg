<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="cursor-logo-title cursor-logo-desc">
  <title id="cursor-logo-title">Cursor Community Brand Mark</title>
  <desc id="cursor-logo-desc">A fan-made dark graphite cube mark inspired by Cursor editor workflows.</desc>
  <defs>
    <linearGradient id="cursor-logo-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <style>
    .cursor-logo-bounce {
      animation: cursor-logo-bounce 2.4s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 60px;
    }
    @keyframes cursor-logo-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <g class="cursor-logo-bounce" data-animated="true">
    <path d="M60 25 L95 45 L95 80 L60 100 L25 80 L25 45 Z" fill="#1E293B" stroke="url(#cursor-logo-gradient)" stroke-width="4"/>
    <path d="M60 25 L60 100 M60 60 L95 45 M60 60 L25 45" fill="none" stroke="url(#cursor-logo-gradient)" stroke-width="3"/>
  </g>
</svg>
