<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="gemini-logo-title gemini-logo-desc">
  <title id="gemini-logo-title">Gemini Community Brand Mark</title>
  <desc id="gemini-logo-desc">A fan-made blue-violet four-point sparkle mark inspired by Gemini workflows.</desc>
  <defs>
    <linearGradient id="gemini-logo-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <style>
    .gemini-logo-pulse {
      animation: gemini-logo-pulse 2.4s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 60px;
    }
    @keyframes gemini-logo-pulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.1) rotate(45deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <g class="gemini-logo-pulse" data-animated="true">
    <path d="M60 20 Q60 60 100 60 Q60 60 60 100 Q60 60 20 60 Q60 60 60 20 Z" fill="url(#gemini-logo-gradient)"/>
  </g>
</svg>
