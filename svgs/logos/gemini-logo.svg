<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="gemini-logo-title gemini-logo-desc" role="img" viewBox="0 0 120 120"><title id="gemini-logo-title">Gemini Community Brand Mark</title><desc id="gemini-logo-desc">A fan-made blue-violet four-point sparkle mark inspired by Gemini workflows.</desc><defs><linearGradient id="gemini-logo-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><style>@keyframes gemini-logo-pulse{0%,to{transform:scale(1) rotate(0deg)}50%{transform:scale(1.1) rotate(45deg)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><g data-animated="true" style="animation:gemini-logo-pulse 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:60px 60px"><path fill="url(#gemini-logo-gradient)" d="M60 20q0 40 40 40-40 0-40 40 0-40-40-40 40 0 40-40"/></g></svg>