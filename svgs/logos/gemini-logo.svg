<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="geminiLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <filter id="geminiLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .star-scale {
      animation: scale-star 2.5s infinite ease-in-out alternate;
      transform-origin: 30px 30px;
    }
    @keyframes scale-star {
      0% { transform: scale(0.92); }
      100% { transform: scale(1.08); }
    }
    .brand-title {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 24px;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .brand-tag {
      font-family: monospace;
      font-weight: 600;
      font-size: 10px;
      fill: #A5B4FC;
      letter-spacing: 1px;
    }
    @media (prefers-reduced-motion: reduce) {
      .star-scale { animation: none !important; }
    }
  </style>

  <!-- Google Gemini 4-Point Sparkle Mark -->
  <g id="icon-mark" class="star-scale" filter="url(#geminiLogoGlow)">
    <path d="M30 10 C33 22 38 27 50 30 C38 33 33 38 30 50 C27 38 22 33 10 30 C22 27 27 22 30 10 Z" fill="url(#geminiLogoGrad)" />
  </g>

  <!-- Combination Mark Text -->
  <g id="brand-text" transform="translate(62, 35)">
    <text x="0" y="0" class="brand-title">Gemini</text>
    <text x="0" y="16" class="brand-tag">GOOGLE ANTIGRAVITY</text>
  </g>
</svg>
