<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" role="img" aria-labelledby="codex-suite-hd-title codex-suite-hd-desc">
  <title id="codex-suite-hd-title">Codex Community Suite Banner</title>
  <desc id="codex-suite-hd-desc">A showcase banner displaying rounded 2.5D violet-cyan Codex mascot artwork and terminal scenes.</desc>
  <defs>
    <linearGradient id="codex-suite-hd-bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F0C1B"/>
      <stop offset="0.5" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="codex-suite-hd-body-gradient" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="codex-suite-hd-shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="codex-suite-hd-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .codex-suite-hd-main-char {
      animation: codex-suite-hd-float 3.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 250px 110px;
    }
    @keyframes codex-suite-hd-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <!-- Background -->
  <rect width="500" height="220" rx="16" fill="url(#codex-suite-hd-bg-gradient)"/>
  <rect width="496" height="216" x="2" y="2" rx="14" fill="none" stroke="#6366F1" stroke-width="1.5" opacity="0.3"/>

  <!-- Title Text -->
  <text x="30" y="45" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#DDD6FE" opacity="0.95">CODEX MASCOT SUITE</text>
  <text x="30" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#67E8F9" opacity="0.8">Community 2.5D Vector Artwork</text>

  <!-- Main Mascot Showcase Center -->
  <g class="codex-suite-hd-main-char" data-animated="true" filter="url(#codex-suite-hd-soft-shadow)">
    <ellipse cx="250" cy="180" rx="42" ry="9" fill="url(#codex-suite-hd-shadow-gradient)"/>
    <rect x="215" y="85" width="70" height="68" rx="26" fill="url(#codex-suite-hd-body-gradient)"/>
    <path d="M222 96 C235 85 262 83 278 95 C264 91 244 93 230 101 C226 104 222 103 222 96 Z" fill="#DDD6FE" opacity=".38"/>

    <!-- Eyes -->
    <ellipse cx="237" cy="112" rx="6" ry="7.5" fill="#0F172A"/>
    <ellipse cx="263" cy="112" rx="6" ry="7.5" fill="#0F172A"/>
    <circle cx="235.3" cy="109.6" r="1.8" fill="#22D3EE"/>
    <circle cx="261.3" cy="109.6" r="1.8" fill="#22D3EE"/>

    <!-- Terminal Prompt -->
    <path d="M241 127 L246 130 L241 133" fill="none" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="249" y1="133" x2="255" y2="133" stroke="#67E8F9" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
