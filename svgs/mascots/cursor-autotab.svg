<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 300"><defs><linearGradient id="cursor-bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a100d"/><stop offset="100%" stop-color="#020504"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#10b981"/></linearGradient><filter id="green-glow-effect"><feGaussianBlur result="blur" stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes tab-slam{0%{transform:translateY(0) scale(1)}to{transform:translateY(8px) scale(.96)}}@keyframes spark-fade{0%{opacity:.2;transform:scale(.8)}to{opacity:1;transform:scale(1.2)}}@keyframes type-code{0%{stroke-dashoffset:120}50%,to{stroke-dashoffset:0}}</style><path d="M0 0h400v300H0z" style="fill:url(#cursor-bg);rx:16px"/><g opacity=".85" transform="translate(60 50)"><rect width="280" height="70" fill="#111c16" stroke="#059669" stroke-width="1" rx="8"/><text x="15" y="28" fill="#a7f3d0" font-family="monospace" font-size="13">const app = await ai.buildApp();</text><path stroke="#10b981" stroke-linecap="round" stroke-width="3" d="M15 48h205" style="stroke-dasharray:120;stroke-dashoffset:120;animation:type-code 1.8s infinite linear"/><path fill="#34d399" d="M225 38h8v15h-8z"><animate attributeName="opacity" dur="0.8s" repeatCount="indefinite" values="1;0;1"/></path></g><g style="animation:tab-slam .6s infinite ease-in-out alternate;transform-origin:200px 140px" transform="translate(0 20)"><rect width="140" height="60" x="130" y="120" fill="#047857" rx="12"/><rect width="140" height="60" x="130" y="112" fill="url(#cyan-glow)" filter="url(#green-glow-effect)" rx="12"/><text x="180" y="148" fill="#fff" font-family="system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle">TAB</text><path stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="