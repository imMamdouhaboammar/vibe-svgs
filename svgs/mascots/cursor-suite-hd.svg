<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" role="img" aria-labelledby="cursor-suite-hd-title cursor-suite-hd-desc">
  <title id="cursor-suite-hd-title">Cursor Community Suite Banner</title>
  <desc id="cursor-suite-hd-desc">A showcase banner displaying rounded 2.5D dark graphite Cursor mascot artwork and auto-tab scenes.</desc>
  <defs>
    <linearGradient id="cursor-suite-hd-bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="0.5" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cursor-suite-hd-body-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.6" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="cursor-suite-hd-shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="cursor-suite-hd-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <style>
    .cursor-suite-hd-main-char {
      animation: cursor-suite-hd-float 3.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 250px 110px;
    }
    @keyframes cursor-suite-hd-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <!-- Background -->
  <rect width="500" height="220" rx="16" fill="url(#cursor-suite-hd-bg-gradient)"/>
  <rect width="496" height="216" x="2" y="2" rx="14" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.3"/>

  <!-- Title Text -->
  <text x="30" y="45" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#E2E8F0" opacity="0.95">CURSOR MASCOT SUITE</text>
  <text x="30" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#06B6D4" opacity="0.8">Community 2.5D Vector Artwork</text>

  <!-- Main Mascot Showcase Center -->
  <g class="cursor-suite-hd-main-char" data-animated="true" filter="url(#cursor-suite-hd-soft-shadow)">
    <ellipse cx="250" cy="180" rx="42" ry="9" fill="url(#cursor-suite-hd-shadow-gradient)"/>
    <rect x="215" y="85" width="70" height="68" rx="24" fill="url(#cursor-suite-hd-body-gradient)"/>
    <path d="M222 96 C235 85 262 83 278 95 C264 91 244 93 230 101 C226 104 222 103 222 96 Z" fill="#94A3B8" opacity=".35"/>

    <!-- Eyes -->
    <ellipse cx="237" cy="112" rx="6" ry="7.5" fill="#020617"/>
    <ellipse cx="263" cy="112" rx="6" ry="7.5" fill="#020617"/>
    <circle cx="237" cy="112" r="2.5" fill="#06B6D4"/>
    <circle cx="263" cy="112" r="2.5" fill="#06B6D4"/>

    <!-- Prompt arrow held -->
    <path d="M250 128 L256 134 L250 140 L244 134 Z" fill="#06B6D4"/>
  </g>
</svg>
