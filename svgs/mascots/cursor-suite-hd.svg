<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a120e" />
      <stop offset="50%" stop-color="#111c16" />
      <stop offset="100%" stop-color="#040a07" />
    </linearGradient>

    <linearGradient id="csBodyGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#4A493A"/>
      <stop offset="30%" stop-color="#363528"/>
      <stop offset="70%" stop-color="#26251E"/>
      <stop offset="100%" stop-color="#141410"/>
    </linearGradient>

    <radialGradient id="csShadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="csGreenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .card-bg { fill: url(#cs-bg); rx: 20px; stroke: #10b981; stroke-width: 2px; }
    .cursor-float { animation: float-cs 3.5s infinite ease-in-out alternate; }
    @keyframes float-cs { 0% { transform: translateY(0px); } 100% { transform: translateY(-8px); } }
    .eye-blink { animation: blink-cs 4s infinite; transform-origin: center; }
    @keyframes blink-cs { 0%, 94%, 98%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    .tab-slam { animation: slam-cs 0.6s infinite ease-in-out alternate; }
    @keyframes slam-cs { 0% { transform: translateY(0); } 100% { transform: translateY(6px); } }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; fill: #ffffff; font-size: 22px; }
    .sub-text { font-family: monospace; fill: #6ee7b7; font-size: 13px; font-weight: 600; }
  </style>

  <rect width="500" height="280" class="card-bg" />

  <!-- Platform Badge -->
  <g transform="translate(30, 25)">
    <rect width="120" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="60" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#a7f3d0">CURSOR AI</text>
  </g>

  <!-- Title & Info -->
  <g transform="translate(30, 85)">
    <text x="0" y="0" class="title-text">Cursor IDE Auto-Tab Agent</text>
    <text x="0" y="24" class="sub-text">⚡ 5,000 Multi-line Edits Per Minute</text>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="370" cy="225" rx="55" ry="9" fill="url(#csShadowGrad)" />

  <!-- 3D Mascot Character (Right Side) -->
  <g class="cursor-float" transform="translate(270, 70)" filter="url(#csGreenGlow)">
    <!-- Main Body -->
    <rect x="58" y="44" width="84" height="90" rx="36" fill="url(#csBodyGrad)" />

    <!-- Eyes -->
    <g class="eye-blink">
      <circle cx="86" cy="78" r="10" fill="#FFFFFF" />
      <circle cx="88" cy="78" r="4" fill="#141410" />

      <circle cx="114" cy="78" r="10" fill="#FFFFFF" />
      <circle cx="112" cy="78" r="4" fill="#141410" />
    </g>

    <!-- Smile -->
    <path d="M 94 96 Q 100 104 106 96" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- TAB Key in hand -->
    <g class="tab-slam" transform="translate(130, 90)">
      <rect width="60" height="30" rx="8" fill="#047857" stroke="#10b981" stroke-width="2" />
      <text x="30" y="20" text-anchor="middle" font-family="system-ui" font-weight="900" font-size="12" fill="#FFFFFF">TAB ⚡</text>
    </g>
  </g>
</svg>
