<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="280" height="168">
  <defs>
    <!-- 3D body gradient -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F4A67A"/>
      <stop offset="30%" stop-color="#E8854F"/>
      <stop offset="65%" stop-color="#E07C4C"/>
      <stop offset="100%" stop-color="#B85A28"/>
    </linearGradient>

    <!-- Ear gradient -->
    <linearGradient id="earGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0966A"/>
      <stop offset="100%" stop-color="#C0612E"/>
    </linearGradient>

    <!-- Arm gradients -->
    <linearGradient id="armL" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#C0612E"/>
      <stop offset="50%" stop-color="#E07C4C"/>
      <stop offset="100%" stop-color="#D06838"/>
    </linearGradient>
    <linearGradient id="armR" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#E8854F"/>
      <stop offset="60%" stop-color="#E07C4C"/>
      <stop offset="100%" stop-color="#B85A28"/>
    </linearGradient>

    <!-- Leg gradient -->
    <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E07C4C"/>
      <stop offset="50%" stop-color="#C86030"/>
      <stop offset="100%" stop-color="#A04D1E"/>
    </linearGradient>

    <!-- Eye radial -->
    <radialGradient id="eyeGrad" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Ground shadow radial -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .claude-float {
      animation: float-anim 3s infinite ease-in-out alternate;
    }
    @keyframes float-anim {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
    .eye-blink {
      animation: blink-anim 4s infinite;
      transform-origin: center;
    }
    @keyframes blink-anim {
      0%, 94%, 98%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .sparkle-spin {
      animation: spin-sparkle 6s linear infinite;
      transform-origin: 160px 25px;
    }
    @keyframes spin-sparkle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="108" rx="42" ry="7" fill="url(#shadowGrad)" />

  <g class="claude-float" filter="url(#dropShadow)">
    <!-- Ears -->
    <path d="M 68 28 Q 62 12 76 18 Q 80 26 76 34 Z" fill="url(#earGrad)" stroke="#B85A28" stroke-width="0.8"/>
    <path d="M 132 28 Q 138 12 124 18 Q 120 26 124 34 Z" fill="url(#earGrad)" stroke="#B85A28" stroke-width="0.8"/>

    <!-- Left Arm -->
    <path d="M 62 55 Q 46 60 52 74 Q 60 76 66 66 Z" fill="url(#armL)" />

    <!-- Right Arm holding Claude star badge -->
    <path d="M 138 55 Q 154 60 148 74 Q 140 76 134 66 Z" fill="url(#armR)" />

    <!-- Legs -->
    <path d="M 82 82 L 80 98 Q 88 102 92 96 L 90 82 Z" fill="url(#legGrad)" />
    <path d="M 110 82 L 108 96 Q 112 102 120 98 L 118 82 Z" fill="url(#legGrad)" />

    <!-- Main Body -->
    <rect x="62" y="24" width="76" height="62" rx="31" fill="url(#bodyGrad)" />

    <!-- Eyes Group -->
    <g class="eye-blink">
      <!-- Left Eye -->
      <circle cx="86" cy="48" r="7" fill="url(#eyeGrad)" />
      <circle cx="84" cy="46" r="2.2" fill="#FFFFFF" />

      <!-- Right Eye -->
      <circle cx="114" cy="48" r="7" fill="url(#eyeGrad)" />
      <circle cx="112" cy="46" r="2.2" fill="#FFFFFF" />
    </g>

    <!-- Mouth -->
    <path d="M 94 58 Q 100 64 106 58" fill="none" stroke="#2A180E" stroke-width="2.5" stroke-linecap="round" />

    <!-- Official Claude Star floating sparkle -->
    <g class="sparkle-spin">
      <path d="M 160 15 L 162 21 L 168 23 L 162 25 L 160 31 L 158 25 L 152 23 L 158 21 Z" fill="#D97757" />
    </g>
  </g>
</svg>
