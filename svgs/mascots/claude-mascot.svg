<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="claude-mascot-title claude-mascot-desc">
  <title id="claude-mascot-title">Claude community mascot holding a small wrench</title>
  <desc id="claude-mascot-desc">A rounded terracotta coding character with connected limbs, soft upper-left lighting, and a grounded contact shadow.</desc>
  <defs>
    <linearGradient id="claude-mascot-body-gradient" x1="0.12" y1="0.05" x2="0.82" y2="0.95">
      <stop offset="0" stop-color="#F6B28A"/>
      <stop offset="0.48" stop-color="#E78351"/>
      <stop offset="1" stop-color="#B9552B"/>
    </linearGradient>
    <linearGradient id="claude-mascot-limb-gradient" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#EA8E5E"/>
      <stop offset="1" stop-color="#B64E27"/>
    </linearGradient>
    <linearGradient id="claude-mascot-wrench-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDF2F7"/>
      <stop offset="0.5" stop-color="#AAB7C4"/>
      <stop offset="1" stop-color="#66727E"/>
    </linearGradient>
    <radialGradient id="claude-mascot-shadow-gradient" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#4B2518" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#4B2518" stop-opacity="0"/>
    </radialGradient>
    <filter id="claude-mascot-soft-shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.2" flood-color="#5B2B18" flood-opacity="0.22"/>
    </filter>
  </defs>
  <style>
    .claude-mascot-idle {
      animation: claude-mascot-idle-motion 3.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 99px;
    }
    .claude-mascot-right-arm {
      animation: claude-mascot-tool-wave 2.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 91px 59px;
    }
    .claude-mascot-eyes {
      animation: claude-mascot-blink 4.4s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 54px;
    }
    @keyframes claude-mascot-idle-motion {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-1.2px) scaleY(1.018); }
    }
    @keyframes claude-mascot-tool-wave {
      0%, 18%, 100% { transform: rotate(-8deg); }
      48% { transform: rotate(7deg); }
      68% { transform: rotate(2deg); }
    }
    @keyframes claude-mascot-blink {
      0%, 44%, 48%, 100% { transform: scaleY(1); }
      46% { transform: scaleY(0.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <ellipse cx="60" cy="106" rx="32" ry="7" fill="url(#claude-mascot-shadow-gradient)"/>

  <g class="claude-mascot-idle" data-animated="true" filter="url(#claude-mascot-soft-shadow)">
    <g aria-hidden="true">
      <path d="M39 84 C36 91 36 101 41 105 C45 108 50 105 50 101 L50 85 Z" fill="url(#claude-mascot-limb-gradient)"/>
      <path d="M70 85 L70 101 C70 106 76 108 80 104 C84 99 83 91 80 84 Z" fill="url(#claude-mascot-limb-gradient)"/>
      <ellipse cx="44" cy="103" rx="9" ry="4.5" fill="#8E3C23" opacity="0.9"/>
      <ellipse cx="77" cy="103" rx="9" ry="4.5" fill="#8E3C23" opacity="0.9"/>
    </g>

    <g aria-hidden="true">
      <path d="M31 55 C20 57 15 66 19 75 C22 81 29 80 33 75 L39 67 Z" fill="url(#claude-mascot-limb-gradient)"/>
      <circle cx="21" cy="73" r="5.5" fill="#D76B43"/>
    </g>

    <rect x="28" y="28" width="64" height="62" rx="24" fill="url(#claude-mascot-body-gradient)"/>
    <path d="M34 38 C46 27 70 25 84 37 C75 33 55 34 42 43 C38 46 35 45 34 38 Z" fill="#FFD0B4" opacity="0.34"/>
    <path d="M31 70 C43 84 75 91 89 68 L89 79 C84 88 74 92 60 92 C45 92 35 87 30 78 Z" fill="#8F3C22" opacity="0.18"/>

    <g class="claude-mascot-eyes" data-animated="true">
      <ellipse cx="49" cy="55" rx="5.7" ry="7.2" fill="#221711"/>
      <ellipse cx="72" cy="55" rx="5.7" ry="7.2" fill="#221711"/>
      <circle cx="47.4" cy="52.7" r="1.8" fill="#FFFFFF" opacity="0.88"/>
      <circle cx="70.4" cy="52.7" r="1.8" fill="#FFFFFF" opacity="0.88"/>
    </g>
    <path d="M52 70 C57 74 64 74 69 70" fill="none" stroke="#71331F" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 36 L62.7 44.5 L71.5 42 L65 48.5 L71.5 55 L62.7 52.5 L60 61 L57.3 52.5 L48.5 55 L55 48.5 L48.5 42 L57.3 44.5 Z" fill="#FFF3EA" opacity="0.13"/>

    <g class="claude-mascot-right-arm" data-animated="true">
      <path d="M88 55 C99 55 105 62 102 71 C100 77 94 79 89 75 L83 68 Z" fill="url(#claude-mascot-limb-gradient)"/>
      <circle cx="101" cy="69" r="5.5" fill="#D76B43"/>
      <g transform="translate(100 68) rotate(-18)">
        <rect x="-2.4" y="-22" width="4.8" height="22" rx="2.4" fill="url(#claude-mascot-wrench-gradient)"/>
        <path d="M-6 -28 C-6 -24 -3 -21 0 -21 C3 -21 6 -24 6 -28 L2.8 -26 L0 -29 L-2.8 -26 Z" fill="url(#claude-mascot-wrench-gradient)"/>
        <circle cx="0" cy="-2.5" r="1.4" fill="#5F6871"/>
      </g>
    </g>
  </g>
</svg>
