<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" role="img" aria-labelledby="gemini-suite-hd-title gemini-suite-hd-desc">
  <title id="gemini-suite-hd-title">Gemini Community Suite Banner</title>
  <desc id="gemini-suite-hd-desc">A showcase banner displaying rounded 2.5D blue-violet Gemini mascot artwork and sparkling scenes.</desc>
  <defs>
    <linearGradient id="gemini-suite-hd-bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140C1D"/>
      <stop offset="0.5" stop-color="#2E1065"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gemini-suite-hd-body-gradient" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="gemini-suite-hd-shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="gemini-suite-hd-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .gemini-suite-hd-main-char {
      animation: gemini-suite-hd-float 3.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 250px 110px;
    }
    @keyframes gemini-suite-hd-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <!-- Background -->
  <rect width="500" height="220" rx="16" fill="url(#gemini-suite-hd-bg-gradient)"/>
  <rect width="496" height="216" x="2" y="2" rx="14" fill="none" stroke="#A855F7" stroke-width="1.5" opacity="0.3"/>

  <!-- Title Text -->
  <text x="30" y="45" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#F0ABFC" opacity="0.95">GEMINI MASCOT SUITE</text>
  <text x="30" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#38BDF8" opacity="0.8">Community 2.5D Vector Artwork</text>

  <!-- Main Mascot Showcase Center -->
  <g class="gemini-suite-hd-main-char" data-animated="true" filter="url(#gemini-suite-hd-soft-shadow)">
    <ellipse cx="250" cy="180" rx="42" ry="9" fill="url(#gemini-suite-hd-shadow-gradient)"/>
    <rect x="215" y="85" width="70" height="68" rx="26" fill="url(#gemini-suite-hd-body-gradient)"/>
    <path d="M222 96 C235 85 262 83 278 95 C264 91 244 93 230 101 C226 104 222 103 222 96 Z" fill="#F0ABFC" opacity=".35"/>

    <!-- Eyes -->
    <ellipse cx="237" cy="112" rx="6" ry="7.5" fill="#0F172A"/>
    <ellipse cx="263" cy="112" rx="6" ry="7.5" fill="#0F172A"/>
    <circle cx="235.3" cy="109.6" r="1.8" fill="#F472B6"/>
    <circle cx="261.3" cy="109.6" r="1.8" fill="#F472B6"/>

    <!-- Four-Point Sparkle Core -->
    <path d="M250 125 Q250 130 255 130 Q250 130 250 135 Q250 130 245 130 Q250 130 250 125 Z" fill="#FFFFFF"/>
  </g>
</svg>
