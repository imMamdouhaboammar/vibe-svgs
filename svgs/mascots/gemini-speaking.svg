<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="gemini-speaking-title gemini-speaking-desc" role="img" viewBox="0 0 120 120"><title id="gemini-speaking-title">Claude and Gemini community mascot speaking</title><desc id="gemini-speaking-desc">A rounded blue-violet character speaking with an animated speech bubble containing sparkling star symbols.</desc><defs><linearGradient id="gemini-speaking-body-gradient" x1=".1" x2=".9" y1="0" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><linearGradient id="gemini-speaking-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#9333ea"/><stop offset="1" stop-color="#2563eb"/></linearGradient><radialGradient id="gemini-speaking-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1e1b4b" stop-opacity=".35"/><stop offset="1" stop-color="#1e1b4b" stop-opacity="0"/></radialGradient><filter id="gemini-speaking-soft-shadow" width="140%" height="150%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#312e81" flood-opacity=".22" stdDeviation="2.2"/></filter></defs><style>@keyframes gemini-speaking-shadow-idle{0%,to{transform:scaleX(1);opacity:.35}50%{transform:scaleX(1.03);opacity:.38}}@keyframes gemini-speaking-char-gesture{0%,to{transform:rotate(0deg)}50%{transform:rotate(-2deg)}}@keyframes gemini-speaking-bubble-pulse{0%,to{transform:scale(1)}50%{transform:scale(1.05)}}@keyframes gemini-speaking-sparkle-bounce{0%,to{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.2)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="106" fill="url(#gemini-speaking-shadow-gradient)" data-animated="true" rx="33" ry="6.5" style="animation:gemini-speaking-shadow-idle 3s ease-in-out infinite;transform-box:view-box;transform-origin:60px 106px"/><g data-animated="true" filter="url(#gemini-speaking-soft-shadow)" style="animation:gemini-speaking-char-gesture 3s ease-in-out infinite;transform-box:view-box;transform-origin:60px 96px"><g aria-hidden="true"><path fill="url(#gemini-speaking-limb-gradient)" d="M40 82c-2 8-1 16 4 20 4 3 9 0 9-5l-1-15Z"/><ellipse cx="47" cy="100" fill="#1e1b4b" rx="8.5" ry="4"/><path fill="url(#gemini-speaking-limb-gradient)" d="m68 82-1 15c0 5 5 8 9 5 6-4 6-13 3-20Z"/><ellipse cx="74" cy="100" fill="#1e1b4b" rx="8.5" ry="4"/></g><path fill="url(#gemini-speaking-limb-gradient)" d="M34 56c-10 4-12 14-4 20 6 4 12-2 8-10Z"/><path fill="url(#gemini-speaking-limb-gradient)" d="M86 56c10-6 18-2 14 8-4 6-10 8-16 0Z"/><rect width="64" height="60" x="28" y="30" fill="url(#gemini-speaking-body-gradient)" rx="24"/><path fill="#f0abfc" d="M34 40c11-10 37-12 52-1-12-4-31-2-44 6-4 3-8 2-8-5" opacity=".35"/><ellipse cx="49" cy="53" fill="#0f172a" rx="5.6" ry="7"/><ellipse cx="71" cy="53" fill="#0f172a" rx="5.6" ry="7"/><circle cx="47.4" cy="50.8" r="1.8" fill="#f472b6"/><circle cx="69.4" cy="50.8" r="1.8" fill="#f472b6"/><path fill="#0f172a" d="M52 66c4 7 12 7 16 0Z"/><path fill="#fff" d="M60 74q0 3 3 3-3 0-3 3 0-3-3-3 3 0 3-3"/></g><g data-animated="true" filter="url(#gemini-speaking-soft-shadow)" style="animation:gemini-speaking-bubble-pulse 3s ease-in-out infinite;transform-box:view-box;transform-origin:85px 32px"><path fill="#fff" stroke="#8b5cf6" stroke-width="2.5" d="M65 32c0-10 10-16 20-16s20 6 20 16c0 8-8 14-18 14-3 0-6 2-9 5 1-4-1-5-3-6-6-2-10-7-10-13Z"/><path fill="#8b5cf6" d="M77 27q0 4 3 4-3 0-3 4 0-4-3-4 3 0 3-4" data-animated="true" style="animation:gemini-speaking-sparkle-bounce 1.6s ease-in-out infinite;transform-box:view-box;transform-origin:77px 31px"/><path fill="#ec4899" d="M90 27q0 4 3 4-3 0-3 4 0-4-3-4 3 0 3-4" data-animated="true" style="animation:gemini-speaking-sparkle-bounce 1.6s ease-in-out .3s infinite;transform-box:view-box;transform-origin:90px 31px"/></g></svg>