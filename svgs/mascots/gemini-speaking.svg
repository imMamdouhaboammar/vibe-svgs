<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="gemini-speaking-title gemini-speaking-desc">
  <title id="gemini-speaking-title">Claude and Gemini community mascot speaking</title>
  <desc id="gemini-speaking-desc">A rounded blue-violet character speaking with an animated speech bubble containing sparkling star symbols.</desc>
  <defs>
    <linearGradient id="gemini-speaking-body-gradient" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="gemini-speaking-limb-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9333EA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="gemini-speaking-shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1E1B4B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
    <filter id="gemini-speaking-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#312E81" flood-opacity="0.22"/>
    </filter>
  </defs>
  <style>
    .gemini-speaking-shadow {
      animation: gemini-speaking-shadow-idle 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 106px;
    }
    .gemini-speaking-character {
      animation: gemini-speaking-char-gesture 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 96px;
    }
    .gemini-speaking-bubble {
      animation: gemini-speaking-bubble-pulse 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 85px 32px;
    }
    .gemini-speaking-sparkle-1 {
      animation: gemini-speaking-sparkle-bounce 1.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 77px 31px;
    }
    .gemini-speaking-sparkle-2 {
      animation: gemini-speaking-sparkle-bounce 1.6s ease-in-out 0.3s infinite;
      transform-box: view-box;
      transform-origin: 90px 31px;
    }
    @keyframes gemini-speaking-shadow-idle {
      0%, 100% { transform: scaleX(1); opacity: .35; }
      50% { transform: scaleX(1.03); opacity: .38; }
    }
    @keyframes gemini-speaking-char-gesture {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-2deg); }
    }
    @keyframes gemini-speaking-bubble-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes gemini-speaking-sparkle-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <ellipse class="gemini-speaking-shadow" data-animated="true" cx="60" cy="106" rx="33" ry="6.5" fill="url(#gemini-speaking-shadow-gradient)"/>

  <g class="gemini-speaking-character" data-animated="true" filter="url(#gemini-speaking-soft-shadow)">
    <!-- Legs -->
    <g aria-hidden="true">
      <path d="M40 82 C38 90 39 98 44 102 C48 105 53 102 53 97 L52 82 Z" fill="url(#gemini-speaking-limb-gradient)"/>
      <ellipse cx="47" cy="100" rx="8.5" ry="4" fill="#1E1B4B"/>
      <path d="M68 82 L67 97 C67 102 72 105 76 102 C82 98 82 89 79 82 Z" fill="url(#gemini-speaking-limb-gradient)"/>
      <ellipse cx="74" cy="100" rx="8.5" ry="4" fill="#1E1B4B"/>
    </g>

    <!-- Arms -->
    <path d="M34 56 C24 60 22 70 30 76 C36 80 42 74 38 66 Z" fill="url(#gemini-speaking-limb-gradient)"/>
    <path d="M86 56 C96 50 104 54 100 64 C96 70 90 72 84 64 Z" fill="url(#gemini-speaking-limb-gradient)"/>

    <!-- Main Body -->
    <rect x="28" y="30" width="64" height="60" rx="24" fill="url(#gemini-speaking-body-gradient)"/>
    <path d="M34 40 C45 30 71 28 86 39 C74 35 55 37 42 45 C38 48 34 47 34 40 Z" fill="#F0ABFC" opacity=".35"/>

    <!-- Eyes -->
    <ellipse cx="49" cy="53" rx="5.6" ry="7" fill="#0F172A"/>
    <ellipse cx="71" cy="53" rx="5.6" ry="7" fill="#0F172A"/>
    <circle cx="47.4" cy="50.8" r="1.8" fill="#F472B6"/>
    <circle cx="69.4" cy="50.8" r="1.8" fill="#F472B6"/>

    <!-- Speaking Open Mouth -->
    <path d="M52 66 C56 73 64 73 68 66 Z" fill="#0F172A"/>

    <!-- Sparkle Core on Chest -->
    <path d="M60 74 Q60 77 63 77 Q60 77 60 80 Q60 77 57 77 Q60 77 60 74 Z" fill="#FFFFFF"/>
  </g>

  <!-- Speech Bubble with sparkles -->
  <g class="gemini-speaking-bubble" data-animated="true" filter="url(#gemini-speaking-soft-shadow)">
    <path d="M65 32 C65 22 75 16 85 16 C95 16 105 22 105 32 C105 40 97 46 87 46 C84 46 81 48 78 51 C79 47 77 46 75 45 C69 43 65 38 65 32 Z" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.5"/>
    <path class="gemini-speaking-sparkle-1" data-animated="true" d="M77 27 Q77 31 80 31 Q77 31 77 35 Q77 31 74 31 Q77 31 77 27 Z" fill="#8B5CF6"/>
    <path class="gemini-speaking-sparkle-2" data-animated="true" Q77 31 d="M90 27 Q90 31 93 31 Q90 31 90 35 Q90 31 87 31 Q90 31 90 27 Z" fill="#EC4899"/>
  </g>
</svg>
