<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="cursor-rage-autotab-title cursor-rage-autotab-desc">
  <title id="cursor-rage-autotab-title">Cursor community mascot in fast auto-tab coding mode</title>
  <desc id="cursor-rage-autotab-desc">A dark graphite character typing intensely while cyan Tab indicators and cursor arrows float rapidly around.</desc>
  <defs>
    <linearGradient id="cursor-rage-autotab-body-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.6" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cursor-rage-autotab-limb-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="cursor-rage-autotab-shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#020617" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="cursor-rage-autotab-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .cursor-rage-autotab-shadow {
      animation: cursor-rage-autotab-shadow-shake 0.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 106px;
    }
    .cursor-rage-autotab-character {
      animation: cursor-rage-autotab-char-type 0.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 96px;
    }
    .cursor-rage-autotab-tab-1 {
      animation: cursor-rage-autotab-float-1 1.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 25px 35px;
    }
    .cursor-rage-autotab-tab-2 {
      animation: cursor-rage-autotab-float-2 1.6s ease-in-out 0.8s infinite;
      transform-box: view-box;
      transform-origin: 95px 30px;
    }
    @keyframes cursor-rage-autotab-shadow-shake {
      0%, 100% { transform: scaleX(1); opacity: .45; }
      50% { transform: scaleX(1.05); opacity: .5; }
    }
    @keyframes cursor-rage-autotab-char-type {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-2px) rotate(1deg); }
      75% { transform: translateY(1px) rotate(-1deg); }
    }
    @keyframes cursor-rage-autotab-float-1 {
      0% { transform: translate(0, 0) scale(0.7); opacity: 0; }
      30% { opacity: 0.95; }
      80% { transform: translate(-10px, -18px) scale(1.05); opacity: 0.7; }
      100% { transform: translate(-15px, -26px) scale(1.1); opacity: 0; }
    }
    @keyframes cursor-rage-autotab-float-2 {
      0% { transform: translate(0, 0) scale(0.7); opacity: 0; }
      30% { opacity: 0.95; }
      80% { transform: translate(10px, -18px) scale(1.05); opacity: 0.7; }
      100% { transform: translate(15px, -26px) scale(1.1); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <ellipse class="cursor-rage-autotab-shadow" data-animated="true" cx="60" cy="106" rx="34" ry="7" fill="url(#cursor-rage-autotab-shadow-gradient)"/>

  <g class="cursor-rage-autotab-character" data-animated="true" filter="url(#cursor-rage-autotab-soft-shadow)">
    <!-- Legs -->
    <g aria-hidden="true">
      <path d="M40 82 C38 90 39 98 44 102 C48 105 53 102 53 97 L52 82 Z" fill="url(#cursor-rage-autotab-limb-gradient)"/>
      <ellipse cx="47" cy="100" rx="8.5" ry="4" fill="#090D16"/>
      <path d="M68 82 L67 97 C67 102 72 105 76 102 C82 98 82 89 79 82 Z" fill="url(#cursor-rage-autotab-limb-gradient)"/>
      <ellipse cx="74" cy="100" rx="8.5" ry="4" fill="#090D16"/>
    </g>

    <!-- Arms typing fast forward -->
    <path d="M34 56 C24 62 20 72 32 76 C40 78 44 70 38 64 Z" fill="url(#cursor-rage-autotab-limb-gradient)"/>
    <path d="M86 56 C96 62 100 72 88 76 C80 78 76 70 82 64 Z" fill="url(#cursor-rage-autotab-limb-gradient)"/>

    <!-- Main Body -->
    <rect x="28" y="30" width="64" height="60" rx="22" fill="url(#cursor-rage-autotab-body-gradient)"/>
    <path d="M34 40 C45 30 71 28 86 39 C74 35 55 37 42 45 C38 48 34 47 34 40 Z" fill="#94A3B8" opacity=".35"/>

    <!-- Intense Focused Cyan Eyes -->
    <ellipse cx="49" cy="52" rx="6" ry="6" fill="#020617"/>
    <ellipse cx="71" cy="52" rx="6" ry="6" fill="#020617"/>
    <circle cx="49" cy="52" r="2.5" fill="#06B6D4"/>
    <circle cx="71" cy="52" r="2.5" fill="#06B6D4"/>

    <!-- Determined Mouth -->
    <line x1="53" y1="66" x2="67" y2="66" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Floating Tab Pills -->
  <g class="cursor-rage-autotab-tab-1" data-animated="true">
    <rect x="15" y="30" width="28" height="15" rx="4" fill="#06B6D4"/>
    <text x="29" y="41" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#0F172A" text-anchor="middle">Tab ⇥</text>
  </g>
  <g class="cursor-rage-autotab-tab-2" data-animated="true">
    <rect x="80" y="24" width="28" height="15" rx="4" fill="#06B6D4"/>
    <text x="94" y="35" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#0F172A" text-anchor="middle">Tab ⇥</text>
  </g>
</svg>
