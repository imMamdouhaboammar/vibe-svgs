<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="cursor-rage-autotab-title cursor-rage-autotab-desc" role="img" viewBox="0 0 120 120"><title id="cursor-rage-autotab-title">Cursor community mascot in fast auto-tab coding mode</title><desc id="cursor-rage-autotab-desc">A dark graphite character typing intensely while cyan Tab indicators and cursor arrows float rapidly around.</desc><defs><linearGradient id="cursor-rage-autotab-body-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#334155"/><stop offset=".6" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient><linearGradient id="cursor-rage-autotab-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#0f172a"/></linearGradient><radialGradient id="cursor-rage-autotab-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#020617" stop-opacity=".45"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient><filter id="cursor-rage-autotab-soft-shadow" width="140%" height="150%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".3" stdDeviation="2.2"/></filter></defs><style>@keyframes cursor-rage-autotab-shadow-shake{0%,to{transform:scaleX(1);opacity:.45}50%{transform:scaleX(1.05);opacity:.5}}@keyframes cursor-rage-autotab-char-type{0%,to{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-2px) rotate(1deg)}75%{transform:translateY(1px) rotate(-1deg)}}@keyframes cursor-rage-autotab-float-1{0%{transform:translate(0,0) scale(.7);opacity:0}30%{opacity:.95}80%{transform:translate(-10px,-18px) scale(1.05);opacity:.7}to{transform:translate(-15px,-26px) scale(1.1);opacity:0}}@keyframes cursor-rage-autotab-float-2{0%{transform:translate(0,0) scale(.7);opacity:0}30%{opacity:.95}80%{transform:translate(10px,-18px) scale(1.05);opacity:.7}to{transform:translate(15px,-26px) scale(1.1);opacity:0}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="106" fill="url(#cursor-rage-autotab-shadow-gradient)" data-animated="true" rx="34" ry="7" style="animation:cursor-rage-autotab-shadow-shake .6s ease-in-out infinite;transform-box:view-box;transform-origin:60px 106px"/><g data-animated="true" filter="url(#cursor-rage-autotab-soft-shadow)" style="animation:cursor-rage-autotab-char-type .6s ease-in-out infinite;transform-box:view-box;transform-origin:60px 96px"><g aria-hidden="true"><path fill="url(#cursor-rage-autotab-limb-gradient)" d="M40 82c-2 8-1 16 4 20 4 3 9 0 9-5l-1-15Z"/><ellipse cx="47" cy="100" fill="#090d16" rx="8.5" ry="4"/><path fill="url(#cursor-rage-autotab-limb-gradient)" d="m68 82-1 15c0 5 5 8 9 5 6-4 6-13 3-20Z"/><ellipse cx="74" cy="100" fill="#090d16" rx="8.5" ry="4"/></g><path fill="url(#cursor-rage-autotab-limb-gradient)" d="M34 56c-10 6-14 16-2 20 8 2 12-6 6-12Z"/><path fill="url(#cursor-rage-autotab-limb-gradient)" d="M86 56c10 6 14 16 2 20-8 2-12-6-6-12Z"/><rect width="64" height="60" x="28" y="30" fill="url(#cursor-rage-autotab-body-gradient)" rx="22"/><path fill="#94a3b8" d="M34 40c11-10 37-12 52-1-12-4-31-2-44 6-4 3-8 2-8-5" opacity=".35"/><circle cx="49" cy="52" r="6" fill="#020617"/><circle cx="71" cy="52" r="6" fill="#020617"/><circle cx="49" cy="52" r="2.5" fill="#06b6d4"/><circle cx="71" cy="52" r="2.5" fill="#06b6d4"/><path stroke="#06b6d4" stroke-linecap="round" stroke-width="2.5" d="M53 66h14"/></g><g data-animated="true" style="animation:cursor-rage-autotab-float-1 1.6s ease-in-out infinite;transform-box:view-box;transform-origin:25px 35px"><rect width="28" height="15" x="15" y="30" fill="#06b6d4" rx="4"/><text x="29" y="41" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Tab ⇥</text></g><g data-animated="true" style="animation:cursor-rage-autotab-float-2 1.6s ease-in-out .8s infinite;transform-box:view-box;transform-origin:95px 30px"><rect width="28" height="15" x="80" y="24" fill="#06b6d4" rx="4"/><text x="94" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Tab ⇥</text></g></svg>