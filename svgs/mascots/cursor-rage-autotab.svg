<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="280" height="168">
  <defs>
    <linearGradient id="crBodyGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#4A493A"/>
      <stop offset="30%" stop-color="#363528"/>
      <stop offset="70%" stop-color="#26251E"/>
      <stop offset="100%" stop-color="#141410"/>
    </linearGradient>
    <radialGradient id="crEyeGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F0F0"/>
      <stop offset="100%" stop-color="#D8D8D8"/>
    </radialGradient>
    <radialGradient id="crShadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="crGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .tab-rage {
      animation: tab-slam-anim 0.3s infinite ease-in-out alternate;
    }
    @keyframes tab-slam-anim {
      0% { transform: translateY(0); }
      100% { transform: translateY(5px); }
    }
    .lightning-flash {
      animation: flash-anim 0.4s infinite ease-in-out alternate;
    }
    @keyframes flash-anim {
      0% { opacity: 0.3; }
      100% { opacity: 1; filter: drop-shadow(0 0 8px #10b981); }
    }
  </style>

  <ellipse cx="50" cy="82" rx="22" ry="5" fill="url(#crShadowGrad)"/>

  <g filter="url(#crGlow)">
    <!-- Gamer Headphones -->
    <path d="M 10 32 A 40 40 0 0 1 90 32" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
    <rect x="8" y="28" width="8" height="18" rx="4" fill="#047857" />
    <rect x="84" y="28" width="8" height="18" rx="4" fill="#047857" />

    <!-- Main Cursor Body -->
    <rect x="14" y="28" width="72" height="32" fill="url(#crBodyGrad)" />

    <!-- Determined Rage Eyes -->
    <rect x="38" y="34" width="8" height="10" fill="url(#crEyeGrad)"/>
    <path d="M 36 32 L 48 36" stroke="#10B981" stroke-width="2" />

    <rect x="68" y="34" width="8" height="10" fill="url(#crEyeGrad)"/>
    <path d="M 66 36 L 78 32" stroke="#10B981" stroke-width="2" />

    <!-- Rapid TAB Key Slamming -->
    <g class="tab-rage" transform="translate(110, 40)">
      <rect x="0" y="0" width="70" height="30" rx="6" fill="#047857" />
      <rect x="0" y="-4" width="70" height="30" rx="6" fill="#10B981" />
      <text x="35" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">TAB ⚡</text>
    </g>

    <!-- Green Code Lightning -->
    <path d="M 90 10 L 105 25 L 95 30 L 115 50" fill="none" stroke="#34D399" stroke-width="2.5" class="lightning-flash" />

    <!-- Legs -->
    <rect x="24" y="60" width="12" height="14" fill="#333228"/>
    <rect x="64" y="60" width="12" height="14" fill="#111110"/>
  </g>
</svg>
