<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="cursor-mascot-title cursor-mascot-desc" role="img" viewBox="0 0 120 120"><title id="cursor-mascot-title">Cursor community mascot holding a cyan prompt arrow</title><desc id="cursor-mascot-desc">A rounded dark graphite coding mascot with connected limbs, upper-left lighting, cyan accents, and a contact shadow.</desc><defs><linearGradient id="cursor-mascot-body-gradient" x1=".12" x2=".82" y1=".05" y2=".95"><stop offset="0" stop-color="#3a3f4d"/><stop offset=".48" stop-color="#242832"/><stop offset="1" stop-color="#14171e"/></linearGradient><linearGradient id="cursor-mascot-limb-gradient" x1=".1" x2=".9" y1="0" y2="1"><stop offset="0" stop-color="#343946"/><stop offset="1" stop-color="#181b22"/></linearGradient><linearGradient id="cursor-mascot-cursor-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#06b6d4"/><stop offset="1" stop-color="#0891b2"/></linearGradient><radialGradient id="cursor-mascot-shadow-gradient" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#0b0d12" stop-opacity=".38"/><stop offset="1" stop-color="#0b0d12" stop-opacity="0"/></radialGradient><filter id="cursor-mascot-soft-shadow" width="140%" height="155%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2.2" flood-color="#07090c" flood-opacity=".28" stdDeviation="2.2"/></filter></defs><style>@keyframes cursor-mascot-idle-motion{0%,to{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1.4px) scaleY(1.02)}}@keyframes cursor-mascot-prompt-gesture{0%,to{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}@keyframes cursor-mascot-blink{0%,44%,48%,to{transform:scaleY(1)}46%{transform:scaleY(.12)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="106" fill="url(#cursor-mascot-shadow-gradient)" rx="32" ry="7"/><g data-animated="true" filter="url(#cursor-mascot-soft-shadow)" style="animation:cursor-mascot-idle-motion 3.4s ease-in-out infinite;transform-box:view-box;transform-origin:60px 99px"><g aria-hidden="true"><path fill="url(#cursor-mascot-limb-gradient)" d="M39 84c-3 7-3 17 2 21 4 3 9 0 9-4V85Z"/><path fill="url(#cursor-mascot-limb-gradient)" d="M70 85v16c0 5 6 7 10 3 4-5 3-13 0-20Z"/><ellipse cx="44" cy="103" fill="#12151b" opacity=".9" rx="9" ry="4.5"/><ellipse cx="77" cy="103" fill="#12151b" opacity=".9" rx="9" ry="4.5"/></g><g aria-hidden="true"><path fill="url(#cursor-mascot-limb-gradient)" d="M31 55c-11 2-16 11-12 20 3 6 10 5 14 0l6-8Z"/><circle cx="21" cy="73" r="5.5" fill="#2a2f3b"/></g><rect width="64" height="62" x="28" y="28" fill="url(#cursor-mascot-body-gradient)" rx="24"/><path fill="#67e8f9" d="M34 38c12-11 36-13 50-1-9-4-29-3-42 6-4 3-7 2-8-5" opacity=".22"/><path fill="#090b0f" d="M31 70c12 14 44 21 58-2v11c-5 9-15 13-29 13-15 0-25-5-30-14Z" opacity=".3"/><g data-animated="true" style="animation:cursor-mascot-blink 4.6s ease-in-out infinite;transform-box:view-box;transform-origin:60px 54px"><ellipse cx="49" cy="54" fill="#0a0c10" rx="5.7" ry="7.2"/><ellipse cx="72" cy="54" fill="#0a0c10" rx="5.7" ry="7.2"/><circle cx="47.4" cy="51.7" r="1.8" fill="#67e8f9" opacity=".95"/><circle cx="70.4" cy="51.7" r="1.8" fill="#67e8f9" opacity=".95"/></g><path fill="none" stroke="#67e8f9" stroke-linecap="round" stroke-width="2.5" d="M53 69c4 4 10 4 14 0" opacity=".85"/><g data-animated="true" style="animation:cursor-mascot-prompt-gesture 2.8s ease-in-out infinite;transform-box:view-box;transform-origin:91px 59px"><path fill="url(#cursor-mascot-limb-gradient)" d="M88 55c11 0 17 7 14 16-2 6-8 8-13 4l-6-7Z"/><circle cx="101" cy="69" r="5.5" fill="#2a2f3b"/><g><path fill="url(#cursor-mascot-cursor-gradient)" d="M0-14 9 9 2 6l-5 8-3-2 4-8-6-1Z" transform="rotate(15 -192.564 415.586)"/></g></g></g></svg>