<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="280" height="168">
  <defs>
    <!-- 3D body gradient -->
    <linearGradient id="crBodyGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#4A493A"/>
      <stop offset="30%" stop-color="#363528"/>
      <stop offset="70%" stop-color="#26251E"/>
      <stop offset="100%" stop-color="#141410"/>
    </linearGradient>

    <linearGradient id="crArmL" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#1E1D18"/>
      <stop offset="50%" stop-color="#333228"/>
      <stop offset="100%" stop-color="#1A1A14"/>
    </linearGradient>

    <linearGradient id="crArmR" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#333228"/>
      <stop offset="50%" stop-color="#26251E"/>
      <stop offset="100%" stop-color="#141410"/>
    </linearGradient>

    <linearGradient id="crLegGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333228"/>
      <stop offset="50%" stop-color="#26251E"/>
      <stop offset="100%" stop-color="#111110"/>
    </linearGradient>

    <radialGradient id="crEyeGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F0F0"/>
      <stop offset="100%" stop-color="#D8D8D8"/>
    </radialGradient>

    <radialGradient id="crShadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="crDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .cursor-float {
      animation: cr-float 3.2s infinite ease-in-out alternate;
    }
    @keyframes cr-float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
    .eye-blink {
      animation: cr-blink 4s infinite;
      transform-origin: center;
    }
    @keyframes cr-blink {
      0%, 94%, 98%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .cube-pulse {
      animation: cr-cube 1.5s infinite ease-in-out alternate;
    }
    @keyframes cr-cube {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }
  </style>

  <!-- Shadow -->
  <ellipse cx="100" cy="108" rx="42" ry="7" fill="url(#crShadowGrad)" />

  <g class="cursor-float" filter="url(#crDropShadow)">
    <!-- Left Arm -->
    <path d="M 60 55 Q 44 60 50 74 Q 58 76 64 66 Z" fill="url(#crArmL)" />

    <!-- Right Arm -->
    <path d="M 140 55 Q 156 60 150 74 Q 142 76 136 66 Z" fill="url(#crArmR)" />

    <!-- Legs -->
    <path d="M 82 82 L 80 98 Q 88 102 92 96 L 90 82 Z" fill="url(#crLegGrad)" />
    <path d="M 110 82 L 108 96 Q 112 102 120 98 L 118 82 Z" fill="url(#crLegGrad)" />

    <!-- Body -->
    <rect x="60" y="24" width="80" height="62" rx="30" fill="url(#crBodyGrad)" />

    <!-- Glossy Eyes -->
    <g class="eye-blink">
      <circle cx="84" cy="48" r="8" fill="url(#crEyeGrad)" />
      <circle cx="86" cy="48" r="3.5" fill="#111110" />
      <circle cx="84" cy="46" r="1.5" fill="#FFFFFF" />

      <circle cx="116" cy="48" r="8" fill="url(#crEyeGrad)" />
      <circle cx="114" cy="48" r="3.5" fill="#111110" />
      <circle cx="116" cy="46" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Mouth -->
    <path d="M 94 62 Q 100 67 106 62" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <!-- Cursor Official 3D Arrow floating -->
    <g class="cube-pulse" transform="translate(155, 20)">
      <path d="M 0 0 L 16 10 L 10 12 L 14 20 L 10 22 L 6 14 L 0 18 Z" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
  </g>
</svg>
