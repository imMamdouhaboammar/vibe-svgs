<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="claude-debugging-title claude-debugging-desc">
  <title id="claude-debugging-title">Claude community mascot debugging code</title>
  <desc id="claude-debugging-desc">A rounded terracotta character inspecting a small bug with an animated magnifying glass.</desc>
  <defs>
    <linearGradient id="claude-debugging-body-gradient" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F7B58E"/>
      <stop offset="0.5" stop-color="#E98452"/>
      <stop offset="1" stop-color="#B7512A"/>
    </linearGradient>
    <linearGradient id="claude-debugging-limb-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EA8F5E"/>
      <stop offset="1" stop-color="#AA4524"/>
    </linearGradient>
    <radialGradient id="claude-debugging-shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3C2118" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#3C2118" stop-opacity="0"/>
    </radialGradient>
    <filter id="claude-debugging-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#552718" flood-opacity="0.2"/>
    </filter>
  </defs>
  <style>
    .claude-debugging-shadow {
      animation: claude-debugging-shadow-pulse 2.8s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 106px;
    }
    .claude-debugging-character {
      animation: claude-debugging-char-lean 2.8s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 96px;
    }
    .claude-debugging-glass-arm {
      animation: claude-debugging-glass-scan 2.8s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 40px 60px;
    }
    .claude-debugging-bug {
      animation: claude-debugging-bug-wiggle 1.4s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 88px 82px;
    }
    @keyframes claude-debugging-shadow-pulse {
      0%, 100% { transform: scaleX(1); opacity: .36; }
      50% { transform: scaleX(1.04); opacity: .4; }
    }
    @keyframes claude-debugging-char-lean {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-2deg); }
    }
    @keyframes claude-debugging-glass-scan {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(3px, -2px) rotate(4deg); }
      75% { transform: translate(-2px, 2px) rotate(-3deg); }
    }
    @keyframes claude-debugging-bug-wiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <ellipse class="claude-debugging-shadow" data-animated="true" cx="60" cy="106" rx="34" ry="7" fill="url(#claude-debugging-shadow-gradient)"/>

  <g class="claude-debugging-character" data-animated="true" filter="url(#claude-debugging-soft-shadow)">
    <!-- Legs -->
    <g aria-hidden="true">
      <path d="M40 82 C38 90 39 98 44 102 C48 105 53 102 53 97 L52 82 Z" fill="url(#claude-debugging-limb-gradient)"/>
      <ellipse cx="47" cy="100" rx="8.5" ry="4" fill="#8D3921"/>
      <path d="M68 82 L67 97 C67 102 72 105 76 102 C82 98 82 89 79 82 Z" fill="url(#claude-debugging-limb-gradient)"/>
      <ellipse cx="74" cy="100" rx="8.5" ry="4" fill="#8D3921"/>
    </g>

    <!-- Main Body -->
    <rect x="29" y="32" width="62" height="59" rx="23" fill="url(#claude-debugging-body-gradient)"/>
    <!-- Specular Highlight -->
    <path d="M35 42 C46 32 70 30 84 41 C72 37 54 39 42 47 C38 50 35 49 35 42 Z" fill="#FFD2B7" opacity=".34"/>
    <path d="M31 72 C44 85 74 92 89 70 L89 80 C83 90 73 93 60 93 C45 93 36 88 31 80 Z" fill="#8F3A20" opacity=".18"/>

    <!-- Curious Eyes focused right -->
    <ellipse cx="51" cy="54" rx="5.6" ry="7" fill="#21150F"/>
    <ellipse cx="73" cy="54" rx="5.6" ry="7" fill="#21150F"/>
    <circle cx="53" cy="53" r="1.8" fill="#FFF" opacity=".95"/>
    <circle cx="75" cy="53" r="1.8" fill="#FFF" opacity=".95"/>

    <!-- Concentrating mouth (small o) -->
    <circle cx="62" cy="68" r="3" fill="none" stroke="#71311D" stroke-width="2.5"/>

    <!-- Left Arm holding Magnifying Glass (animated) -->
    <g class="claude-debugging-glass-arm" data-animated="true">
      <path d="M34 56 C24 60 22 70 30 76 C36 80 42 74 38 66 Z" fill="url(#claude-debugging-limb-gradient)"/>
      <!-- Glass Rim and Handle -->
      <circle cx="68" cy="74" r="12" fill="#EBF8FF" fill-opacity="0.3" stroke="#D97706" stroke-width="3"/>
      <line x1="59" y1="83" x2="44" y2="92" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
      <path d="M62 67 C66 65 72 65 74 68" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Right Arm pointing -->
    <path d="M86 58 C94 62 98 70 94 76 C90 80 84 76 82 68 Z" fill="url(#claude-debugging-limb-gradient)"/>
  </g>

  <!-- Cute Bug on Ground (animated wiggle) -->
  <g class="claude-debugging-bug" data-animated="true">
    <ellipse cx="88" cy="82" rx="4" ry="3" fill="#EF4444"/>
    <circle cx="91" cy="82" r="1.5" fill="#111827"/>
    <!-- Legs -->
    <path d="M86 80 L84 78 M88 80 L88 77 M90 80 L92 78 M86 84 L84 86 M88 84 L88 87 M90 84 L92 86" stroke="#111827" stroke-width="1"/>
  </g>
</svg>
