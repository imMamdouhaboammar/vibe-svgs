<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-debugging-title claude-debugging-desc" role="img" viewBox="0 0 120 120"><title id="claude-debugging-title">Claude community mascot debugging code</title><desc id="claude-debugging-desc">A rounded terracotta character inspecting a small bug with an animated magnifying glass.</desc><defs><linearGradient id="claude-debugging-body-gradient" x1=".1" x2=".85" y1="0" y2="1"><stop offset="0" stop-color="#f7b58e"/><stop offset=".5" stop-color="#e98452"/><stop offset="1" stop-color="#b7512a"/></linearGradient><linearGradient id="claude-debugging-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ea8f5e"/><stop offset="1" stop-color="#aa4524"/></linearGradient><radialGradient id="claude-debugging-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3c2118" stop-opacity=".36"/><stop offset="1" stop-color="#3c2118" stop-opacity="0"/></radialGradient><filter id="claude-debugging-soft-shadow" width="140%" height="150%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#552718" flood-opacity=".2" stdDeviation="2"/></filter></defs><style>@keyframes claude-debugging-shadow-pulse{0%,to{transform:scaleX(1);opacity:.36}50%{transform:scaleX(1.04);opacity:.4}}@keyframes claude-debugging-char-lean{0%,to{transform:rotate(0deg)}50%{transform:rotate(-2deg)}}@keyframes claude-debugging-glass-scan{0%,to{transform:translate(0,0) rotate(0deg)}25%{transform:translate(3px,-2px) rotate(4deg)}75%{transform:translate(-2px,2px) rotate(-3deg)}}@keyframes claude-debugging-bug-wiggle{0%,to{transform:rotate(0deg)}50%{transform:rotate(8deg)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="106" fill="url(#claude-debugging-shadow-gradient)" data-animated="true" rx="34" ry="7" style="animation:claude-debugging-shadow-pulse 2.8s ease-in-out infinite;transform-box:view-box;transform-origin:60px 106px"/><g data-animated="true" filter="url(#claude-debugging-soft-shadow)" style="animation:claude-debugging-char-lean 2.8s ease-in-out infinite;transform-box:view-box;transform-origin:60px 96px"><g aria-hidden="true"><path fill="url(#claude-debugging-limb-gradient)" d="M40 82c-2 8-1 16 4 20 4 3 9 0 9-5l-1-15Z"/><ellipse cx="47" cy="100" fill="#8d3921" rx="8.5" ry="4"/><path fill="url(#claude-debugging-limb-gradient)" d="m68 82-1 15c0 5 5 8 9 5 6-4 6-13 3-20Z"/><ellipse cx="74" cy="100" fill="#8d3921" rx="8.5" ry="4"/></g><rect width="62" height="59" x="29" y="32" fill="url(#claude-debugging-body-gradient)" rx="23"/><path fill="#ffd2b7" d="M35 42c11-10 35-12 49-1-12-4-30-2-42 6-4 3-7 2-7-5" opacity=".34"/><path fill="#8f3a20" d="M31 72c13 13 43 20 58-2v10c-6 10-16 13-29 13-15 0-24-5-29-13Z" opacity=".18"/><ellipse cx="51" cy="54" fill="#21150f" rx="5.6" ry="7"/><ellipse cx="73" cy="54" fill="#21150f" rx="5.6" ry="7"/><circle cx="53" cy="53" r="1.8" fill="#fff" opacity=".95"/><circle cx="75" cy="53" r="1.8" fill="#fff" opacity=".95"/><circle cx="62" cy="68" r="3" fill="none" stroke="#71311d" stroke-width="2.5"/><g data-animated="true" style="animation:claude-debugging-glass-scan 2.8s ease-in-out infinite;transform-box:view-box;transform-origin:40px 60px"><path fill="url(#claude-debugging-limb-gradient)" d="M34 56c-10 4-12 14-4 20 6 4 12-2 8-10Z"/><circle cx="68" cy="74" r="12" fill="#ebf8ff" fill-opacity=".3" stroke="#d97706" stroke-width="3"/><path stroke="#b45309" stroke-linecap="round" stroke-width="4" d="m59 83-15 9"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2" d="M62 67c4-2 10-2 12 1" opacity=".7"/></g><path fill="url(#claude-debugging-limb-gradient)" d="M86 58c8 4 12 12 8 18-4 4-10 0-12-8Z"/></g><g data-animated="true" style="animation:claude-debugging-bug-wiggle 1.4s ease-in-out infinite;transform-box:view-box;transform-origin:88px 82px"><ellipse cx="88" cy="82" fill="#ef4444" rx="4" ry="3"/><circle cx="91" cy="82" r="1.5" fill="#111827"/><path stroke="#111827" stroke-width=