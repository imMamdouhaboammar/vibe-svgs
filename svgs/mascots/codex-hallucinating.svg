<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="280" height="168">
  <defs>
    <linearGradient id="cxBodyGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="50%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="cxEyeGrad" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </radialGradient>
    <radialGradient id="cxShadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="cxGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .math-float {
      animation: math-anim 2s infinite linear;
    }
    @keyframes math-anim {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-25px) rotate(15deg); opacity: 0; }
    }
    .eye-spin {
      animation: spin-eye 3s linear infinite;
      transform-origin: center;
    }
    @keyframes spin-eye {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <ellipse cx="50" cy="82" rx="22" ry="5" fill="url(#cxShadowGrad)"/>

  <!-- Floating Hallucinated Equations -->
  <g class="math-float" transform="translate(100, 30)">
    <text x="0" y="0" font-family="monospace" font-weight="bold" font-size="11" fill="#A855F7">2 + 2 = 5 ✨</text>
  </g>
  <g class="math-float" transform="translate(130, 45)" style="animation-delay: 1s;">
    <text x="0" y="0" font-family="monospace" font-weight="bold" font-size="10" fill="#38BDF8">π = 3.0000</text>
  </g>

  <g filter="url(#cxGlow)">
    <!-- Main Codex 3D Body -->
    <rect x="14" y="28" width="72" height="32" fill="url(#cxBodyGrad)" stroke="#404040" stroke-width="1" />

    <!-- Party Hat -->
    <polygon points="50,6 38,28 62,28" fill="#EC4899" stroke="#F43F5E" stroke-width="1" />
    <circle cx="50" cy="5" r="3" fill="#FDE047" />

    <!-- Spiral Hallucinating Eyes -->
    <g class="eye-spin">
      <rect x="38" y="34" width="8" height="10" fill="url(#cxEyeGrad)"/>
      <circle cx="42" cy="39" r="2" fill="#A855F7" />

      <rect x="68" y="34" width="8" height="10" fill="url(#cxEyeGrad)"/>
      <circle cx="72" cy="39" r="2" fill="#A855F7" />
    </g>

    <!-- Broad Confident Smile -->
    <path d="M 44 48 Q 50 56 56 48" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Arms -->
    <rect x="2" y="36" width="12" height="8" fill="#262626"/>
    <rect x="86" y="36" width="14" height="8" fill="#171717"/>

    <!-- Legs -->
    <rect x="24" y="60" width="12" height="14" fill="#171717"/>
    <rect x="64" y="60" width="12" height="14" fill="#0A0A0A"/>
  </g>
</svg>
