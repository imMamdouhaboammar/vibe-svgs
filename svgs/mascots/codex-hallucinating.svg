<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="codex-hallucinating-title codex-hallucinating-desc" role="img" viewBox="0 0 170 120"><title id="codex-hallucinating-title">Codex community mascot confidently hallucinating</title><desc id="codex-hallucinating-desc">A rounded violet and cyan coding mascot wears a party hat while unsupported visual equations float upward in a controlled comedy loop.</desc><defs><linearGradient id="codex-hallucinating-body-gradient" x1=".08" x2=".9" y1=".04" y2=".96"><stop offset="0" stop-color="#b58cff"/><stop offset=".48" stop-color="#7257e8"/><stop offset="1" stop-color="#27c6d9"/></linearGradient><linearGradient id="codex-hallucinating-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#8065ec"/><stop offset="1" stop-color="#289db9"/></linearGradient><linearGradient id="codex-hallucinating-hat-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff7ccb"/><stop offset="1" stop-color="#e83d8e"/></linearGradient><radialGradient id="codex-hallucinating-shadow-gradient" cx="50%" cy="48%" r="54%"><stop offset="0" stop-color="#1c163e" stop-opacity=".34"/><stop offset="1" stop-color="#1c163e" stop-opacity="0"/></radialGradient><filter id="codex-hallucinating-soft-shadow" width="150%" height="165%" x="-25%" y="-25%"><feDropShadow dx="0" dy="2.4" flood-color="#251b54" flood-opacity=".24" stdDeviation="2.4"/></filter></defs><style>@keyframes codex-hallucinating-shadow-motion{0%,to{transform:scaleX(1);opacity:.34}50%{transform:scaleX(.88);opacity:.25}}@keyframes codex-hallucinating-position-motion{0%,to{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes codex-hallucinating-rotation-motion{0%,to{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}@keyframes codex-hallucinating-squash-motion{0%,to{transform:scale(1)}50%{transform:scale(.98,1.025)}}@keyframes codex-hallucinating-left-arm-motion{0%,to{transform:rotate(15deg)}50%{transform:rotate(-18deg)}}@keyframes codex-hallucinating-right-arm-motion{0%,to{transform:rotate(-15deg)}50%{transform:rotate(18deg)}}@keyframes codex-hallucinating-left-eye-motion{to{transform:rotate(360deg)}}@keyframes codex-hallucinating-right-eye-motion{to{transform:rotate(-360deg)}}@keyframes codex-hallucinating-equation-one-motion{0%{transform:translateY(8px) rotate(-4deg);opacity:.15}35%,65%{opacity:.95}to{transform:translateY(-18px) rotate(7deg);opacity:.1}}@keyframes codex-hallucinating-equation-two-motion{0%{transform:translateY(7px) rotate(5deg);opacity:.12}35%,65%{opacity:.9}to{transform:translateY(-16px) rotate(-8deg);opacity:.08}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="58" cy="108" fill="url(#codex-hallucinating-shadow-gradient)" data-animated="true" rx="31" ry="6.5" style="animation:codex-hallucinating-shadow-motion 1.6s ease-in-out infinite;transform-box:view-box;transform-origin:58px 108px"/><g data-animated="true" style="animation:codex-hallucinating-equation-one-motion 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:128px 74px"><rect width="40" height="25" x="111" y="47" fill="#17152e" stroke="#8cf5ff" stroke-width="1.5" opacity=".92" rx="8"/><circle cx="119" cy="57" r="2.4" fill="#b99aff"/><circle cx="125" cy="57" r="2.4" fill="#b99aff"/><path stroke="#8cf5ff" stroke-linecap="round" stroke-width="1.5" d="M130 57h6m-3-3v6"/><circle cx="141" cy="57" r="2.4" fill="#67ddeb"/><path stroke="#eef9ff" stroke-linecap="round" stroke-width="1.5" d="M117 65h8m7 0h8"/><circle cx="145" cy="65" r="1.7" fill="#ff81c8"/></g><g data-animated="true" style="animation:codex-hallucinating-equation-two-motion 2.4s ease-in-out .8s infinite;transform-box:view-box;transform-origin:148px 93px"><rect width="31" height="22" x="132" y="79" fill="#17152e" stroke="#b99aff" stroke-width="1.4" opacity=".9" rx="7"/><path fill="none" stroke="#8cf5ff" stroke-width="1.5" d="M140 90c3-6 8-6 11 0-3 6-8 6-11 0Z"/><path stroke="#ff81c8" stroke-linecap="round" stroke-wid