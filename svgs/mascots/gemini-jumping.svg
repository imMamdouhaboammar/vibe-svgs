<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="gemini-jumping-title gemini-jumping-desc" role="img" viewBox="0 0 120 120"><title id="gemini-jumping-title">Gemini community mascot jumping</title><desc id="gemini-jumping-desc">A rounded blue-violet character leaping with energetic motion and dynamic floor shadow.</desc><defs><linearGradient id="gemini-jumping-body-gradient" x1=".1" x2=".9" y1="0" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><linearGradient id="gemini-jumping-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#9333ea"/><stop offset="1" stop-color="#2563eb"/></linearGradient><radialGradient id="gemini-jumping-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1e1b4b" stop-opacity=".35"/><stop offset="1" stop-color="#1e1b4b" stop-opacity="0"/></radialGradient><filter id="gemini-jumping-soft-shadow" width="140%" height="150%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#312e81" flood-opacity=".22" stdDeviation="2.2"/></filter></defs><style>@keyframes gemini-jumping-shadow-motion{0%,12%,to{transform:scaleX(1);opacity:.35}40%,58%{transform:scaleX(.48);opacity:.12}78%{transform:scaleX(1.08);opacity:.38}}@keyframes gemini-jumping-pos-motion{0%,12%,to{transform:translateY(0)}22%{transform:translateY(-4px)}45%,55%{transform:translateY(-26px)}72%{transform:translateY(-6px)}78%{transform:translateY(1px)}}@keyframes gemini-jumping-squash-motion{0%,to{transform:scale(1)}12%{transform:scale(1.08,.86)}26%{transform:scale(.94,1.08)}52%{transform:scale(.98,1.03)}78%{transform:scale(1.08,.85)}88%{transform:scale(.98,1.04)}}@keyframes gemini-jumping-larm-motion{0%,12%,to{transform:rotate(8deg)}38%,58%{transform:rotate(-40deg)}78%{transform:rotate(16deg)}}@keyframes gemini-jumping-rarm-motion{0%,12%,to{transform:rotate(-8deg)}38%,58%{transform:rotate(40deg)}78%{transform:rotate(-16deg)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="106" fill="url(#gemini-jumping-shadow-gradient)" data-animated="true" rx="33" ry="6.5" style="animation:gemini-jumping-shadow-motion 1.1s cubic-bezier(.38,.02,.2,1) infinite;transform-box:view-box;transform-origin:60px 106px"/><g data-animated="true" style="animation:gemini-jumping-pos-motion 1.1s cubic-bezier(.38,.02,.2,1) infinite;transform-box:view-box;transform-origin:60px 100px"><g data-animated="true" filter="url(#gemini-jumping-soft-shadow)" style="animation:gemini-jumping-squash-motion 1.1s ease-in-out infinite;transform-box:view-box;transform-origin:60px 96px"><g aria-hidden="true"><path fill="url(#gemini-jumping-limb-gradient)" d="M40 82c-2 8-1 16 4 20 4 3 9 0 9-5l-1-15Z"/><ellipse cx="47" cy="100" fill="#1e1b4b" rx="8.5" ry="4"/><path fill="url(#gemini-jumping-limb-gradient)" d="m68 82-1 15c0 5 5 8 9 5 6-4 6-13 3-20Z"/><ellipse cx="74" cy="100" fill="#1e1b4b" rx="8.5" ry="4"/></g><g data-animated="true" style="animation:gemini-jumping-larm-motion 1.1s ease-in-out infinite;transform-box:view-box;transform-origin:32px 60px"><path fill="url(#gemini-jumping-limb-gradient)" d="M34 56c-12 0-18 8-16 16 2 6 10 8 16 2l6-8Z"/><circle cx="21" cy="71" r="5.2" fill="#f472b6"/></g><g data-animated="true" style="animation:gemini-jumping-rarm-motion 1.1s ease-in-out infinite;transform-box:view-box;transform-origin:88px 60px"><path fill="url(#gemini-jumping-limb-gradient)" d="M86 56c12 0 18 8 16 16-2 6-10 8-16 2l-6-8Z"/><circle cx="99" cy="71" r="5.2" fill="#f472b6"/></g><rect width="64" height="60" x="28" y="30" fill="url(#gemini-jumping-body-gradient)" rx="24"/><path fill="#f0abfc" d="M34 40c11-10 37-12 52-1-12-4-31-2-44 6-4 3-8 2-8-5" opacity=".35"/><ellipse cx="49" cy="53" fill="#0f172a" rx="5.6" ry="7"/><ellipse cx="71" cy="53" fill="#0f172a" rx="5.6" ry="7"/><circle cx="47.4" cy="50.8" r="1.8" fill="#f472b6"/><circle cx="69.4" cy="50.8" r="1.8" fill="#f472b6"/><path fill="#fff" d=