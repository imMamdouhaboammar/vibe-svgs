<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-jumping-title claude-jumping-desc" role="img" viewBox="0 0 120 120"><title id="claude-jumping-title">Claude community mascot jumping</title><desc id="claude-jumping-desc">A rounded terracotta coding character anticipates, lifts, reaches an apex, lands with compression, and recovers while the shadow reacts to height.</desc><defs><linearGradient id="claude-jumping-body-gradient" x1=".1" x2=".85" y1="0" y2="1"><stop offset="0" stop-color="#f7b58e"/><stop offset=".5" stop-color="#e98452"/><stop offset="1" stop-color="#b7512a"/></linearGradient><linearGradient id="claude-jumping-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ea8f5e"/><stop offset="1" stop-color="#aa4524"/></linearGradient><radialGradient id="claude-jumping-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3c2118" stop-opacity=".36"/><stop offset="1" stop-color="#3c2118" stop-opacity="0"/></radialGradient><filter id="claude-jumping-soft-shadow" width="150%" height="165%" x="-25%" y="-25%"><feDropShadow dx="0" dy="2" flood-color="#552718" flood-opacity=".2" stdDeviation="2.2"/></filter></defs><style>@keyframes claude-jumping-shadow-motion{0%,12%,to{transform:scaleX(1);opacity:.34}40%,58%{transform:scaleX(.48);opacity:.12}78%{transform:scaleX(1.08);opacity:.38}}@keyframes claude-jumping-position-motion{0%,12%,to{transform:translateY(0)}22%{transform:translateY(-4px)}45%,55%{transform:translateY(-28px)}72%{transform:translateY(-7px)}78%{transform:translateY(1px)}}@keyframes claude-jumping-rotation-motion{0%,12%,78%,to{transform:rotate(0deg)}28%{transform:rotate(-4deg)}52%{transform:rotate(2deg)}}@keyframes claude-jumping-squash-motion{0%,to{transform:scale(1)}12%{transform:scale(1.08,.87)}26%{transform:scale(.95,1.08)}52%{transform:scale(.98,1.03)}78%{transform:scale(1.1,.84)}88%{transform:scale(.98,1.04)}}@keyframes claude-jumping-left-arm-motion{0%,12%,to{transform:rotate(8deg)}38%,58%{transform:rotate(-42deg)}78%{transform:rotate(18deg)}}@keyframes claude-jumping-right-arm-motion{0%,12%,to{transform:rotate(-8deg)}38%,58%{transform:rotate(42deg)}78%{transform:rotate(-18deg)}}@keyframes claude-jumping-left-leg-motion{0%,12%,to{transform:rotate(0deg)}38%,58%{transform:rotate(18deg)}78%{transform:rotate(-8deg)}}@keyframes claude-jumping-right-leg-motion{0%,12%,to{transform:rotate(0deg)}38%,58%{transform:rotate(-18deg)}78%{transform:rotate(8deg)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="108" fill="url(#claude-jumping-shadow-gradient)" data-animated="true" rx="31" ry="6.5" style="animation:claude-jumping-shadow-motion 1.05s cubic-bezier(.38,.02,.2,1) infinite;transform-box:view-box;transform-origin:60px 108px"/><g data-animated="true" style="animation:claude-jumping-position-motion 1.05s cubic-bezier(.38,.02,.2,1) infinite;transform-box:view-box;transform-origin:60px 103px"><g data-animated="true" style="animation:claude-jumping-rotation-motion 1.05s ease-in-out infinite;transform-box:view-box;transform-origin:60px 76px"><g data-animated="true" filter="url(#claude-jumping-soft-shadow)" style="animation:claude-jumping-squash-motion 1.05s ease-in-out infinite;transform-box:view-box;transform-origin:60px 98px"><g aria-hidden="true"><g data-animated="true" style="animation:claude-jumping-left-leg-motion 1.05s ease-in-out infinite;transform-box:view-box;transform-origin:47px 91px"><path fill="url(#claude-jumping-limb-gradient)" d="M40 84c-2 8-1 17 4 20 4 3 9 0 9-5l-1-15Z"/><ellipse cx="47" cy="102" fill="#8d3921" rx="8.5" ry="4"/></g><g data-animated="true" style="animation:claude-jumping-right-leg-motion 1.05s ease-in-out infinite;transform-box:view-box;transform-origin:73px 91px"><path fill="url(#claude-jumping-limb-gradient)" d="m68 84-1 15c0 5 5 8 9 5 6-4 6-13 3-20Z"/><ellipse cx="74" cy="102" fill="#8d3921" rx="8.5" ry="4"/></g></g><g data-animated="true" style="animation:claude-jumping-left-arm-motion 1.05s ease-in-out infinite;transform-box:view-box;transform-origin:31px 61px"><path fill="url(#claude-jumping-limb-gradient)" d="M34 55c-12 1-18 8-16 17 2 7 9 9 15 4l7-8Z"/><circle cx="21" cy="71" r="5.3" fill="#d86d43"/></g><g data-animated="true" style="animation:claude-jumping-right-arm-motion 1.05s ease-in-out infinite;transform-box:view-box;transform-origin:89px 61px"><path fill="url(#claude-jumping-limb-gradient)" d="M86 55c12 1 18 8 16 17-2 7-9 9-15 4l-7-8Z"/><circle cx="99" cy="71" r="5.3" fill="#d86d43"/></g><rect width="62" height="59" x="29" y="29" fill="url(#claude-jumping-body-gradient)" rx="23"/><path fill="#ffd2b7" d="M35 39c11-10 35-12 49-1-12-4-30-2-42 6-4 3-7 2-7-5" opacity=".34"/><path fill="#8f3a20" d="M31 69c13 13 43 20 58-2v10c-6 10-16 13-29 13-15 0-24-5-29-13Z" opacity=".18"/><ellipse cx="49" cy="55" fill="#21150f" rx="5.6" ry="7"/><ellipse cx="71" cy="55" fill="#21150f" rx="5.6" ry="7"/><circle cx="47.4" cy="52.8" r="1.7" fill="#fff" opacity=".9"/><circle cx="69.4" cy="52.8" r="1.7" fill="#fff" opacity=".9"/><path fill="none" stroke="#71311d" stroke-linecap="round" stroke-width="3" d="M50 70c6 6 15 6 21 0"/><path fill="#fff3ea" d="m60 36 2.4 7.5 7.6-2.3-5.6 5.8 5.6 5.8-7.6-2.3L60 58l-2.4-7.5-7.6 2.3 5.6-5.8-5.6-5.8 7.6 2.3Z" opacity=".13"/></g></g></g></svg>