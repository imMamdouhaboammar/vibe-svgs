<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="copilot-mascot-title copilot-mascot-desc" role="img" viewBox="0 0 120 120"><title id="copilot-mascot-title">Copilot community robot mascot with a cyan visor</title><desc id="copilot-mascot-desc">A rounded dark slate robot mascot with connected limbs, glowing cyan visor, upper-left lighting, and a contact shadow.</desc><defs><linearGradient id="copilot-mascot-body-gradient" x1=".12" x2=".82" y1=".05" y2=".95"><stop offset="0" stop-color="#475569"/><stop offset=".48" stop-color="#334155"/><stop offset="1" stop-color="#1e293b"/></linearGradient><linearGradient id="copilot-mascot-limb-gradient" x1=".1" x2=".9" y1="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/></linearGradient><linearGradient id="copilot-mascot-visor-gradient" x1="0" x2="1" y1="0" y2=".8"><stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#06b6d4"/><stop offset="1" stop-color="#0891b2"/></linearGradient><radialGradient id="copilot-mascot-shadow-gradient" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#0f172a" stop-opacity=".38"/><stop offset="1" stop-color="#0f172a" stop-opacity="0"/></radialGradient><filter id="copilot-mascot-soft-shadow" width="140%" height="155%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2.2" flood-color="#0f172a" flood-opacity=".28" stdDeviation="2.2"/></filter></defs><style>@keyframes copilot-mascot-idle-motion{0%,to{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1.3px) scaleY(1.02)}}@keyframes copilot-mascot-arm-wave{0%,to{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}@keyframes copilot-mascot-visor-glow{0%,to{opacity:.95}50%{opacity:1;filter:drop-shadow(0 0 3px #06b6d4)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="106" fill="url(#copilot-mascot-shadow-gradient)" rx="32" ry="7"/><g data-animated="true" filter="url(#copilot-mascot-soft-shadow)" style="animation:copilot-mascot-idle-motion 3.4s ease-in-out infinite;transform-box:view-box;transform-origin:60px 99px"><g aria-hidden="true"><path fill="url(#copilot-mascot-limb-gradient)" d="M39 84c-3 7-3 17 2 21 4 3 9 0 9-4V85Z"/><path fill="url(#copilot-mascot-limb-gradient)" d="M70 85v16c0 5 6 7 10 3 4-5 3-13 0-20Z"/><ellipse cx="44" cy="103" fill="#0f172a" opacity=".9" rx="9" ry="4.5"/><ellipse cx="77" cy="103" fill="#0f172a" opacity=".9" rx="9" ry="4.5"/></g><g aria-hidden="true"><path fill="url(#copilot-mascot-limb-gradient)" d="M31 55c-11 2-16 11-12 20 3 6 10 5 14 0l6-8Z"/><circle cx="21" cy="73" r="5.5" fill="#2563eb"/></g><rect width="64" height="62" x="28" y="28" fill="url(#copilot-mascot-body-gradient)" rx="24"/><path fill="#94a3b8" d="M34 38c12-11 36-13 50-1-9-4-29-3-42 6-4 3-7 2-8-5" opacity=".28"/><path fill="#0f172a" d="M31 70c12 14 44 21 58-2v11c-5 9-15 13-29 13-15 0-25-5-30-14Z" opacity=".32"/><g data-animated="true" style="animation:copilot-mascot-visor-glow 4.2s ease-in-out infinite;transform-box:view-box;transform-origin:60px 52px"><rect width="40" height="18" x="40" y="46" fill="url(#copilot-mascot-visor-gradient)" rx="9"/><circle cx="49" cy="55" r="3.2" fill="#fff" opacity=".95"/><circle cx="71" cy="55" r="3.2" fill="#fff" opacity=".95"/></g><path fill="none" stroke="#64748b" stroke-linecap="round" stroke-width="2.5" d="M52 73c5 3 11 3 16 0"/><g data-animated="true" style="animation:copilot-mascot-arm-wave 2.6s ease-in-out infinite;transform-box:view-box;transform-origin:91px 59px"><path fill="url(#copilot-mascot-limb-gradient)" d="M88 55c11 0 17 7 14 16-2 6-8 8-13 4l-6-7Z"/><circle cx="101" cy="69" r="5.5" fill="#2563eb"/></g></g></svg>