<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="280" height="168">
  <defs>
    <linearGradient id="cpBodyGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <radialGradient id="cpShadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="cpVisorGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .copilot-float {
      animation: cp-float 3s infinite ease-in-out alternate;
    }
    @keyframes cp-float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
    .visor-scan {
      animation: cp-scan 2s infinite ease-in-out alternate;
    }
    @keyframes cp-scan {
      0% { opacity: 0.7; transform: scaleX(0.95); }
      100% { opacity: 1; transform: scaleX(1.05); }
    }
  </style>

  <!-- Shadow -->
  <ellipse cx="100" cy="108" rx="40" ry="7" fill="url(#cpShadowGrad)" />

  <g class="copilot-float">
    <!-- Robot Head / Body -->
    <rect x="62" y="24" width="76" height="62" rx="24" fill="url(#cpBodyGrad)" stroke="#60A5FA" stroke-width="1.5" />

    <!-- Robot Ears / Antennas -->
    <rect x="52" y="45" width="10" height="18" rx="4" fill="#1D4ED8" />
    <rect x="138" y="45" width="10" height="18" rx="4" fill="#1D4ED8" />

    <!-- Futuristic Glowing Visor -->
    <rect x="72" y="38" width="56" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2" filter="url(#cpVisorGlow)" />

    <!-- Visor Eye Lights -->
    <g class="visor-scan">
      <circle cx="86" cy="50" r="5" fill="#38BDF8" />
      <circle cx="114" cy="50" r="5" fill="#38BDF8" />
    </g>

    <!-- Mouth Line -->
    <line x1="90" y1="72" x2="110" y2="72" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
