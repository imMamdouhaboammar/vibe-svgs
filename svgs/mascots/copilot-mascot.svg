<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="copilot-mascot-title copilot-mascot-desc">
  <title id="copilot-mascot-title">Copilot community robot mascot with a cyan visor</title>
  <desc id="copilot-mascot-desc">A rounded dark slate robot mascot with connected limbs, glowing cyan visor, upper-left lighting, and a contact shadow.</desc>
  <defs>
    <linearGradient id="copilot-mascot-body-gradient" x1="0.12" y1="0.05" x2="0.82" y2="0.95">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.48" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="copilot-mascot-limb-gradient" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="copilot-mascot-visor-gradient" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="copilot-mascot-shadow-gradient" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <filter id="copilot-mascot-soft-shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.2" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
  </defs>
  <style>
    .copilot-mascot-idle {
      animation: copilot-mascot-idle-motion 3.4s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 99px;
    }
    .copilot-mascot-right-arm {
      animation: copilot-mascot-arm-wave 2.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 91px 59px;
    }
    .copilot-mascot-visor {
      animation: copilot-mascot-visor-glow 4.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 52px;
    }
    @keyframes copilot-mascot-idle-motion {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-1.3px) scaleY(1.02); }
    }
    @keyframes copilot-mascot-arm-wave {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes copilot-mascot-visor-glow {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; filter: drop-shadow(0 0 3px #06B6D4); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <ellipse cx="60" cy="106" rx="32" ry="7" fill="url(#copilot-mascot-shadow-gradient)"/>

  <g class="copilot-mascot-idle" data-animated="true" filter="url(#copilot-mascot-soft-shadow)">
    <g aria-hidden="true">
      <path d="M39 84 C36 91 36 101 41 105 C45 108 50 105 50 101 L50 85 Z" fill="url(#copilot-mascot-limb-gradient)"/>
      <path d="M70 85 L70 101 C70 106 76 108 80 104 C84 99 83 91 80 84 Z" fill="url(#copilot-mascot-limb-gradient)"/>
      <ellipse cx="44" cy="103" rx="9" ry="4.5" fill="#0F172A" opacity="0.9"/>
      <ellipse cx="77" cy="103" rx="9" ry="4.5" fill="#0F172A" opacity="0.9"/>
    </g>

    <g aria-hidden="true">
      <path d="M31 55 C20 57 15 66 19 75 C22 81 29 80 33 75 L39 67 Z" fill="url(#copilot-mascot-limb-gradient)"/>
      <circle cx="21" cy="73" r="5.5" fill="#2563EB"/>
    </g>

    <!-- Main rounded robot body -->
    <rect x="28" y="28" width="64" height="62" rx="24" fill="url(#copilot-mascot-body-gradient)"/>
    <path d="M34 38 C46 27 70 25 84 37 C75 33 55 34 42 43 C38 46 35 45 34 38 Z" fill="#94A3B8" opacity="0.28"/>
    <path d="M31 70 C43 84 75 91 89 68 L89 79 C84 88 74 92 60 92 C45 92 35 87 30 78 Z" fill="#0F172A" opacity="0.32"/>

    <!-- Glowing cyan visor -->
    <g class="copilot-mascot-visor" data-animated="true">
      <rect x="40" y="46" width="40" height="18" rx="9" fill="url(#copilot-mascot-visor-gradient)"/>
      <circle cx="49" cy="55" r="3.2" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="71" cy="55" r="3.2" fill="#FFFFFF" opacity="0.95"/>
    </g>
    <path d="M52 73 C57 76 63 76 68 73" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

    <g class="copilot-mascot-right-arm" data-animated="true">
      <path d="M88 55 C99 55 105 62 102 71 C100 77 94 79 89 75 L83 68 Z" fill="url(#copilot-mascot-limb-gradient)"/>
      <circle cx="101" cy="69" r="5.5" fill="#2563EB"/>
    </g>
  </g>
</svg>
