<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-speaking-title claude-speaking-desc" role="img" viewBox="0 0 120 120"><title id="claude-speaking-title">Claude community mascot speaking</title><desc id="claude-speaking-desc">A rounded terracotta character expressing ideas with an animated speech bubble.</desc><defs><linearGradient id="claude-speaking-body-gradient" x1=".1" x2=".85" y1="0" y2="1"><stop offset="0" stop-color="#f7b58e"/><stop offset=".5" stop-color="#e98452"/><stop offset="1" stop-color="#b7512a"/></linearGradient><linearGradient id="claude-speaking-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ea8f5e"/><stop offset="1" stop-color="#aa4524"/></linearGradient><radialGradient id="claude-speaking-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3c2118" stop-opacity=".36"/><stop offset="1" stop-color="#3c2118" stop-opacity="0"/></radialGradient><filter id="claude-speaking-soft-shadow" width="140%" height="150%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#552718" flood-opacity=".2" stdDeviation="2"/></filter></defs><style>@keyframes claude-speaking-shadow-idle{0%,to{transform:scaleX(1);opacity:.36}50%{transform:scaleX(1.03);opacity:.39}}@keyframes claude-speaking-char-gesture{0%,to{transform:rotate(0deg)}30%{transform:rotate(2deg)}70%{transform:rotate(-1deg)}}@keyframes claude-speaking-bubble-pop{0%,to{transform:scale(1)}50%{transform:scale(1.06)}}@keyframes claude-speaking-dot-bounce{0%,to{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="106" fill="url(#claude-speaking-shadow-gradient)" data-animated="true" rx="34" ry="7" style="animation:claude-speaking-shadow-idle 3s ease-in-out infinite;transform-box:view-box;transform-origin:60px 106px"/><g data-animated="true" filter="url(#claude-speaking-soft-shadow)" style="animation:claude-speaking-char-gesture 3s ease-