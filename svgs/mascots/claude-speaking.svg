<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="claude-speaking-title claude-speaking-desc">
  <title id="claude-speaking-title">Claude community mascot speaking</title>
  <desc id="claude-speaking-desc">A rounded terracotta character expressing ideas with an animated speech bubble.</desc>
  <defs>
    <linearGradient id="claude-speaking-body-gradient" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F7B58E"/>
      <stop offset="0.5" stop-color="#E98452"/>
      <stop offset="1" stop-color="#B7512A"/>
    </linearGradient>
    <linearGradient id="claude-speaking-limb-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EA8F5E"/>
      <stop offset="1" stop-color="#AA4524"/>
    </linearGradient>
    <radialGradient id="claude-speaking-shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3C2118" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#3C2118" stop-opacity="0"/>
    </radialGradient>
    <filter id="claude-speaking-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#552718" flood-opacity="0.2"/>
    </filter>
  </defs>
  <style>
    .claude-speaking-shadow {
      animation: claude-speaking-shadow-idle 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 106px;
    }
    .claude-speaking-character {
      animation: claude-speaking-char-gesture 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 96px;
    }
    .claude-speaking-bubble {
      animation: claude-speaking-bubble-pop 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 85px 35px;
    }
    .claude-speaking-dot-1 {
      animation: claude-speaking-dot-bounce 1.5s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 75px 32px;
    }
    .claude-speaking-dot-2 {
      animation: claude-speaking-dot-bounce 1.5s ease-in-out 0.2s infinite;
      transform-box: view-box;
      transform-origin: 85px 32px;
    }
    .claude-speaking-dot-3 {
      animation: claude-speaking-dot-bounce 1.5s ease-in-out 0.4s infinite;
      transform-box: view-box;
      transform-origin: 95px 32px;
    }
    @keyframes claude-speaking-shadow-idle {
      0%, 100% { transform: scaleX(1); opacity: .36; }
      50% { transform: scaleX(1.03); opacity: .39; }
    }
    @keyframes claude-speaking-char-gesture {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(2deg); }
      70% { transform: rotate(-1deg); }
    }
    @keyframes claude-speaking-bubble-pop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes claude-speaking-dot-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <ellipse class="claude-speaking-shadow" data-animated="true" cx="60" cy="106" rx="34" ry="7" fill="url(#claude-speaking-shadow-gradient)"/>

  <g class="claude-speaking-character" data-animated="true" filter="url(#claude-speaking-soft-shadow)">
    <!-- Legs -->
    <g aria-hidden="true">
      <path d="M40 82 C38 90 39 98 44 102 C48 105 53 102 53 97 L52 82 Z" fill="url(#claude-speaking-limb-gradient)"/>
      <ellipse cx="47" cy="100" rx="8.5" ry="4" fill="#8D3921"/>
      <path d="M68 82 L67 97 C67 102 72 105 76 102 C82 98 82 89 79 82 Z" fill="url(#claude-speaking-limb-gradient)"/>
      <ellipse cx="74" cy="100" rx="8.5" ry="4" fill="#8D3921"/>
    </g>

    <!-- Arms Gesturing -->
    <path d="M32 58 C22 56 16 64 20 72 C24 78 32 76 36 68 Z" fill="url(#claude-speaking-limb-gradient)"/>
    <path d="M88 58 C96 52 104 56 100 66 C96 72 90 74 84 66 Z" fill="url(#claude-speaking-limb-gradient)"/>

    <!-- Main Body -->
    <rect x="29" y="32" width="62" height="59" rx="23" fill="url(#claude-speaking-body-gradient)"/>
    <!-- Specular Highlight -->
    <path d="M35 42 C46 32 70 30 84 41 C72 37 54 39 42 47 C38 50 35 49 35 42 Z" fill="#FFD2B7" opacity=".34"/>
    <path d="M31 72 C44 85 74 92 89 70 L89 80 C83 90 73 93 60 93 C45 93 36 88 31 80 Z" fill="#8F3A20" opacity=".18"/>

    <!-- Expressive Open Eyes -->
    <ellipse cx="49" cy="54" rx="5.6" ry="7" fill="#21150F"/>
    <ellipse cx="71" cy="54" rx="5.6" ry="7" fill="#21150F"/>
    <circle cx="47.4" cy="51.8" r="1.7" fill="#FFF" opacity=".9"/>
    <circle cx="69.4" cy="51.8" r="1.7" fill="#FFF" opacity=".9"/>

    <!-- Speaking Open Mouth -->
    <path d="M50 67 C54 75 66 75 70 67 Z" fill="#21150F"/>
    <path d="M54 71 C58 74 62 74 66 71" fill="#E25F38"/>
  </g>

  <!-- Speech Bubble -->
  <g class="claude-speaking-bubble" data-animated="true">
    <path d="M65 32 C65 22 75 16 85 16 C95 16 105 22 105 32 C105 40 97 46 87 46 C84 46 81 48 78 51 C79 47 77 46 75 45 C69 43 65 38 65 32 Z" fill="#FFFFFF" stroke="#E98452" stroke-width="2.5" filter="url(#claude-speaking-soft-shadow)"/>
    <!-- Animated typing dots -->
    <circle class="claude-speaking-dot-1" data-animated="true" cx="77" cy="31" r="2.8" fill="#B7512A"/>
    <circle class="claude-speaking-dot-2" data-animated="true" cx="85" cy="31" r="2.8" fill="#B7512A"/>
    <circle class="claude-speaking-dot-3" data-animated="true" cx="93" cy="31" r="2.8" fill="#B7512A"/>
  </g>
</svg>
