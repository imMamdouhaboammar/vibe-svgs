<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" role="img" aria-labelledby="copilot-suite-hd-title copilot-suite-hd-desc">
  <title id="copilot-suite-hd-title">Copilot Community Suite Banner</title>
  <desc id="copilot-suite-hd-desc">A showcase banner displaying rounded 2.5D robot Copilot mascot artwork and ninja scenes.</desc>
  <defs>
    <linearGradient id="copilot-suite-hd-bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="copilot-suite-hd-body-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.5" stop-color="#334155"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="copilot-suite-hd-shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="copilot-suite-hd-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <style>
    .copilot-suite-hd-main-char {
      animation: copilot-suite-hd-float 3.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 250px 110px;
    }
    @keyframes copilot-suite-hd-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <!-- Background -->
  <rect width="500" height="220" rx="16" fill="url(#copilot-suite-hd-bg-gradient)"/>
  <rect width="496" height="216" x="2" y="2" rx="14" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.3"/>

  <!-- Title Text -->
  <text x="30" y="45" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#CBD5E1" opacity="0.95">COPILOT MASCOT SUITE</text>
  <text x="30" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#38BDF8" opacity="0.8">Community 2.5D Vector Artwork</text>

  <!-- Main Mascot Showcase Center -->
  <g class="copilot-suite-hd-main-char" data-animated="true" filter="url(#copilot-suite-hd-soft-shadow)">
    <ellipse cx="250" cy="180" rx="42" ry="9" fill="url(#copilot-suite-hd-shadow-gradient)"/>
    <rect x="215" y="85" width="70" height="68" rx="24" fill="url(#copilot-suite-hd-body-gradient)"/>
    <path d="M222 96 C235 85 262 83 278 95 C264 91 244 93 230 101 C226 104 222 103 222 96 Z" fill="#94A3B8" opacity=".3"/>

    <!-- Glowing Cyan Visor -->
    <rect x="225" y="106" width="50" height="15" rx="7" fill="#06B6D4"/>
    <rect x="228" y="108.5" width="44" height="8" rx="4" fill="#67E8F9"/>

    <!-- Antenna -->
    <circle cx="250" cy="74" r="4" fill="#06B6D4"/>
    <line x1="250" y1="78" x2="250" y2="85" stroke="#06B6D4" stroke-width="2"/>
  </g>
</svg>
