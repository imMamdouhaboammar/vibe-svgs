igin:250px 110px"><ellipse cx="250" cy="180" fill="url(#copilot-suite-hd-shadow-gradient)" rx="42" ry="9"/><rect width="70" height="68" x="215" y="85" fill="url(#copilot-suite-hd-body-gradient)" rx="24"/><path fill="#94a3b8" d="M222 96c13-11 40-13 56-1-14-4-34-2-48 6-4 3-8 2-8-5" opacity=".3"/><rect width="50" height="15" x="225" y="106" fill="#06b6d4" rx="7"/><rect width="44" height="8" x="228" y="108.5" fill="#67e8f9" rx="4"/><circle cx="250" cy="74" r="4" fill="#06b6d4"/><path stroke="#06b6d4" stroke-width="2" d="M250 78v7"/></g></svg>