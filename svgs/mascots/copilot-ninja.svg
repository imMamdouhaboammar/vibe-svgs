<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="copilot-ninja-title copilot-ninja-desc" role="img" viewBox="0 0 120 120"><title id="copilot-ninja-title">Copilot community mascot as a stealth ninja robot</title><desc id="copilot-ninja-desc">A dark rounded robot wearing a red ninja headband with a glowing cyan visor and animated code slash effect.</desc><defs><linearGradient id="copilot-ninja-body-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#475569"/><stop offset=".5" stop-color="#334155"/><stop offset="1" stop-color="#0f172a"/></linearGradient><linearGradient id="copilot-ninja-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#020617"/></linearGradient><radialGradient id="copilot-ninja-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#020617" stop-opacity=".4"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient><filter id="copilot-ninja-soft-shadow" width="140%" height="150%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".3" stdDeviation="2.2"/></filter></defs><style>@keyframes copilot-ninja-shadow-pulse{0%,to{transform:scaleX(1);opacity:.4}50%{transform:scaleX(1.04);opacity:.45}}@keyframes copilot-ninja-char-stealth{0%,to{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-2px) rotate(-1deg)}}@keyframes copilot-ninja-slash-anim{0%,to{stroke-dasharray:0 100;opacity:0}20%{stroke-dasharray:100 0;opacity:1}60%{opacity:.8}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="106" fill="url(#copilot-ninja-shadow-gradient)" data-animated="true" rx="34" ry="7" style="animation:copilot-ninja-shadow-pulse 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:60px 106px"/><g data-animated="true" filter="url(#copilot-ninja-soft-shadow)" style="animation:copilot-ninja-char-stealth 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:60px 96px"><g aria-hidden="true"><path fill="url(#copilot-ninja-limb-gradient)" d="M40 82c-2 8-1 16 4 20 4 3 9 0 9-5l-1-15Z"/><ellipse cx="47" cy="100" fill="#020617" rx="8.5" ry="4"/><path fill="url(#copilot-ninja-limb-gradient)" d="m68 82-1 15c0 5 5 8 9 5 6-4 6-13 3-20Z"/><ellipse cx="74" cy="100" fill="#020617" rx="8.5" ry="4"/></g><path fill="url(#copilot-ninja-limb-gradient)" d="M34 56c-10 6-16 14-6 20 8 2 12-6 8-12Z"/><path fill="url(#copilot-ninja-limb-gradient)" d="M86 56c10-4 18 2 14 10-4 6-10 6-16-2Z"/><rect width="64" height="60" x="28" y="30" fill="url(#copilot-ninja-body-gradient)" rx="24"/><path fill="#94a3b8" d="M34 40c11-10 37-12 52-1-12-4-31-2-44 6-4 3-8 2-8-5" opacity=".3"/><rect width="68" height="9" x="26" y="44" fill="#ef4444" rx="3"/><path fill="none" stroke="#ef4444" stroke-linecap="round" stroke-width="4" d="M26 48c-10 0-14 8-12 16"/><rect width="48" height="7" x="36" y="45" fill="#06b6d4" rx="3.5"/><rect width="42" height="4" x="39" y="46.5" fill="#67e8f9" rx="2"/><circle cx="60" cy="24" r="3.5" fill="#06b6d4"/><path stroke="#06b6d4" stroke-width="2" d="M60 27v3"/></g><path fill="none" stroke="#22d3ee" stroke-linecap="round" stroke-width="3" d="m15 85 90-50" data-animated="true" style="animation:copilot-ninja-slash-anim 2.4s cubic-bezier(.16,1,.3,1) infinite;transform-box:view-box;transform-origin:60px 60px"/></svg>