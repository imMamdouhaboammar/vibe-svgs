<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="devin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e0e" />
      <stop offset="100%" stop-color="#090303" />
    </linearGradient>
    <linearGradient id="wheel-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <style>
    .bg { fill: url(#devin-bg); rx: 16px; }
    .spin-wheel {
      animation: spin-loop 2s linear infinite;
      transform-origin: 200px 130px;
    }
    @keyframes spin-loop {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .sweat-drop {
      animation: drip 1.5s infinite ease-in;
    }
    @keyframes drip {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(15px); opacity: 0; }
    }
    .devin-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; font-size: 16px; }
    .devin-sub { font-family: system-ui, -apple-system, sans-serif; fill: #fca5a5; font-size: 12px; font-weight: 500; }
  </style>

  <rect width="400" height="300" class="bg" />

  <!-- Animated Hamster Wheel / Loop -->
  <g class="spin-wheel">
    <circle cx="200" cy="130" r="55" fill="none" stroke="url(#wheel-gradient)" stroke-width="4" stroke-dasharray="16 8" />
    <line x1="200" y1="75" x2="200" y2="185" stroke="#451a1a" stroke-width="2" />
    <line x1="145" y1="130" x2="255" y2="130" stroke="#451a1a" stroke-width="2" />
  </g>

  <!-- Devin Agent Running inside Wheel -->
  <g transform="translate(200, 150)">
    <!-- Body -->
    <rect x="-18" y="-20" width="36" height="30" rx="8" fill="#ef4444" />
    <!-- Eyes (dizzy/running) -->
    <circle cx="-7" cy="-8" r="3" fill="#ffffff" />
    <circle cx="7" cy="-8" r="3" fill="#ffffff" />
    <path d="M-9 -9 L-5 -7 M-9 -7 L-5 -9" stroke="#180e0e" stroke-width="1.5" />
    <path d="M5 -9 L9 -7 M5 -7 L9 -9" stroke="#180e0e" stroke-width="1.5" />

    <!-- Open Mouth Panting -->
    <ellipse cx="0" cy="0" rx="4" ry="5" fill="#451a1a" />

    <!-- Sweat Drop -->
    <path d="M12 -15 Q14 -10 12 -5 Q10 -10 12 -15 Z" fill="#38bdf8" class="sweat-drop" />
  </g>

  <!-- Status pill -->
  <g transform="translate(110, 45)">
    <rect width="180" height="26" rx="13" fill="#2a1212" stroke="#ef4444" stroke-width="1.5" />
    <text x="90" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#fca5a5">Retry Loop #4,821 🔄</text>
  </g>

  <!-- Typography -->
  <text x="200" y="245" text-anchor="middle" class="devin-title">Devin's Infinite Self-Healing Loop</text>
  <text x="200" y="267" text-anchor="middle" class="devin-sub">Fixing error #1 created error #2, which recreates error #1 🔁</text>
</svg>
