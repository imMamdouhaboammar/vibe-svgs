<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="codex-jumping-title codex-jumping-desc">
  <title id="codex-jumping-title">Codex community mascot jumping</title>
  <desc id="codex-jumping-desc">A rounded violet-cyan coding character leaping upwards with terminal prompt details and dynamic shadow scaling.</desc>
  <defs>
    <linearGradient id="codex-jumping-body-gradient" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="codex-jumping-limb-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="codex-jumping-shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1E1B4B" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
    <filter id="codex-jumping-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#312E81" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    .codex-jumping-shadow {
      animation: codex-jumping-shadow-motion 1.1s cubic-bezier(.38,.02,.2,1) infinite;
      transform-box: view-box;
      transform-origin: 60px 106px;
    }
    .codex-jumping-character-position {
      animation: codex-jumping-pos-motion 1.1s cubic-bezier(.38,.02,.2,1) infinite;
      transform-box: view-box;
      transform-origin: 60px 100px;
    }
    .codex-jumping-character-squash {
      animation: codex-jumping-squash-motion 1.1s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 96px;
    }
    .codex-jumping-left-arm {
      animation: codex-jumping-larm-motion 1.1s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 32px 60px;
    }
    .codex-jumping-right-arm {
      animation: codex-jumping-rarm-motion 1.1s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 88px 60px;
    }
    @keyframes codex-jumping-shadow-motion {
      0%, 12%, 100% { transform: scaleX(1); opacity: .38; }
      40%, 58% { transform: scaleX(.48); opacity: .14; }
      78% { transform: scaleX(1.08); opacity: .42; }
    }
    @keyframes codex-jumping-pos-motion {
      0%, 12%, 100% { transform: translateY(0); }
      22% { transform: translateY(-4px); }
      45%, 55% { transform: translateY(-26px); }
      72% { transform: translateY(-6px); }
      78% { transform: translateY(1px); }
    }
    @keyframes codex-jumping-squash-motion {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.08,.86); }
      26% { transform: scale(.94,1.08); }
      52% { transform: scale(.98,1.03); }
      78% { transform: scale(1.08,.85); }
      88% { transform: scale(.98,1.04); }
    }
    @keyframes codex-jumping-larm-motion {
      0%, 12%, 100% { transform: rotate(8deg); }
      38%, 58% { transform: rotate(-40deg); }
      78% { transform: rotate(16deg); }
    }
    @keyframes codex-jumping-rarm-motion {
      0%, 12%, 100% { transform: rotate(-8deg); }
      38%, 58% { transform: rotate(40deg); }
      78% { transform: rotate(-16deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <ellipse class="codex-jumping-shadow" data-animated="true" cx="60" cy="106" rx="33" ry="6.5" fill="url(#codex-jumping-shadow-gradient)"/>

  <g class="codex-jumping-character-position" data-animated="true">
    <g class="codex-jumping-character-squash" data-animated="true" filter="url(#codex-jumping-soft-shadow)">
      <!-- Legs -->
      <g aria-hidden="true">
        <path d="M40 82 C38 90 39 98 44 102 C48 105 53 102 53 97 L52 82 Z" fill="url(#codex-jumping-limb-gradient)"/>
        <ellipse cx="47" cy="100" rx="8.5" ry="4" fill="#312E81"/>
        <path d="M68 82 L67 97 C67 102 72 105 76 102 C82 98 82 89 79 82 Z" fill="url(#codex-jumping-limb-gradient)"/>
        <ellipse cx="74" cy="100" rx="8.5" ry="4" fill="#312E81"/>
      </g>

      <!-- Arms -->
      <g class="codex-jumping-left-arm" data-animated="true">
        <path d="M34 56 C22 56 16 64 18 72 C20 78 28 80 34 74 L40 66 Z" fill="url(#codex-jumping-limb-gradient)"/>
        <circle cx="21" cy="71" r="5.2" fill="#06B6D4"/>
      </g>
      <g class="codex-jumping-right-arm" data-animated="true">
        <path d="M86 56 C98 56 104 64 102 72 C100 78 92 80 86 74 L80 66 Z" fill="url(#codex-jumping-limb-gradient)"/>
        <circle cx="99" cy="71" r="5.2" fill="#06B6D4"/>
      </g>

      <!-- Main Body -->
      <rect x="28" y="30" width="64" height="60" rx="24" fill="url(#codex-jumping-body-gradient)"/>
      <path d="M34 40 C45 30 71 28 86 39 C74 35 55 37 42 45 C38 48 34 47 34 40 Z" fill="#DDD6FE" opacity=".38"/>

      <!-- Eyes with cyan glow -->
      <ellipse cx="49" cy="53" rx="5.6" ry="7" fill="#0F172A"/>
      <ellipse cx="71" cy="53" rx="5.6" ry="7" fill="#0F172A"/>
      <circle cx="47.4" cy="50.8" r="1.8" fill="#22D3EE"/>
      <circle cx="69.4" cy="50.8" r="1.8" fill="#22D3EE"/>

      <!-- Terminal Prompt Symbol on Chest (>_) -->
      <path d="M52 68 L57 71 L52 74" fill="none" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="60" y1="74" x2="66" y2="74" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
