<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="deepseek-mascot-title deepseek-mascot-desc">
  <title id="deepseek-mascot-title">DeepSeek community whale mascot with a blowhole sparkle</title>
  <desc id="deepseek-mascot-desc">A rounded ocean blue whale coding mascot with side flippers, upper-left lighting, deep-reasoning cues, and a contact shadow.</desc>
  <defs>
    <linearGradient id="deepseek-mascot-body-gradient" x1="0.12" y1="0.05" x2="0.82" y2="0.95">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.48" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="deepseek-mascot-flipper-gradient" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="deepseek-mascot-sprout-gradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <radialGradient id="deepseek-mascot-shadow-gradient" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <filter id="deepseek-mascot-soft-shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.2" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    .deepseek-mascot-idle {
      animation: deepseek-mascot-idle-motion 3.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 99px;
    }
    .deepseek-mascot-flipper {
      animation: deepseek-mascot-flipper-wave 2.5s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 85px 68px;
    }
    .deepseek-mascot-sprout {
      animation: deepseek-mascot-sprout-pulse 2.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 22px;
    }
    .deepseek-mascot-eyes {
      animation: deepseek-mascot-blink 4.4s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 52px 55px;
    }
    @keyframes deepseek-mascot-idle-motion {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-1.5px) scaleY(1.02); }
    }
    @keyframes deepseek-mascot-flipper-wave {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(10deg); }
    }
    @keyframes deepseek-mascot-sprout-pulse {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.85; }
      50% { transform: translateY(-2px) scale(1.1); opacity: 1; }
    }
    @keyframes deepseek-mascot-blink {
      0%, 44%, 48%, 100% { transform: scaleY(1); }
      46% { transform: scaleY(0.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <ellipse cx="60" cy="104" rx="36" ry="7.5" fill="url(#deepseek-mascot-shadow-gradient)"/>

  <g class="deepseek-mascot-idle" data-animated="true" filter="url(#deepseek-mascot-soft-shadow)">
    <!-- Tail fin -->
    <path d="M18 68 C12 60 8 50 14 44 C20 48 24 58 28 66 Z" fill="url(#deepseek-mascot-flipper-gradient)"/>
    <path d="M18 70 C10 76 6 86 12 92 C19 88 23 78 28 72 Z" fill="url(#deepseek-mascot-flipper-gradient)"/>

    <!-- Left flipper (background) -->
    <path d="M42 74 C34 78 28 85 32 90 C38 91 46 84 50 78 Z" fill="url(#deepseek-mascot-flipper-gradient)" opacity="0.8"/>

    <!-- Main whale body -->
    <path d="M24 68 C24 45 42 32 68 32 C92 32 104 48 104 68 C104 84 88 94 62 94 C38 94 24 85 24 68 Z" fill="url(#deepseek-mascot-body-gradient)"/>

    <!-- Belly highlight -->
    <path d="M36 76 C42 86 60 92 78 88 C90 84 98 76 96 70 C92 78 78 84 62 84 C48 84 38 78 36 76 Z" fill="#DBEAFE" opacity="0.45"/>

    <!-- Top specular curve -->
    <path d="M38 42 C50 35 72 35 88 44 C76 39 56 39 42 46 Z" fill="#E0F2FE" opacity="0.4"/>

    <!-- Blowhole sprout -->
    <g class="deepseek-mascot-sprout" data-animated="true">
      <path d="M60 32 C58 24 52 18 46 16 C52 20 57 26 59 31 Z" fill="url(#deepseek-mascot-sprout-gradient)"/>
      <path d="M60 32 C62 24 68 18 74 16 C68 20 63 26 61 31 Z" fill="url(#deepseek-mascot-sprout-gradient)"/>
      <circle cx="60" cy="14" r="2.5" fill="#E0F2FE"/>
    </g>

    <!-- Eyes & smile -->
    <g class="deepseek-mascot-eyes" data-animated="true">
      <ellipse cx="68" cy="56" rx="5.5" ry="7" fill="#0F172A"/>
      <circle cx="66.5" cy="53.8" r="1.8" fill="#FFFFFF"/>
    </g>
    <path d="M72 68 C76 72 82 72 86 68" fill="none" stroke="#1E3A8A" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Right flipper (foreground) -->
    <g class="deepseek-mascot-flipper" data-animated="true">
      <path d="M78 72 C88 78 96 84 92 90 C85 93 74 85 70 76 Z" fill="url(#deepseek-mascot-flipper-gradient)"/>
    </g>
  </g>
</svg>
