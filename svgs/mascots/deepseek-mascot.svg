<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="deepseek-mascot-title deepseek-mascot-desc" role="img" viewBox="0 0 120 120"><title id="deepseek-mascot-title">DeepSeek community whale mascot with a blowhole sparkle</title><desc id="deepseek-mascot-desc">A rounded ocean blue whale coding mascot with side flippers, upper-left lighting, deep-reasoning cues, and a contact shadow.</desc><defs><linearGradient id="deepseek-mascot-body-gradient" x1=".12" x2=".82" y1=".05" y2=".95"><stop offset="0" stop-color="#60a5fa"/><stop offset=".48" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient><linearGradient id="deepseek-mascot-flipper-gradient" x1=".1" x2=".9" y1="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/></linearGradient><linearGradient id="deepseek-mascot-sprout-gradient" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient><radialGradient id="deepseek-mascot-shadow-gradient" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#0f172a" stop-opacity=".36"/><stop offset="1" stop-color="#0f172a" stop-opacity="0"/></radialGradient><filter id="deepseek-mascot-soft-shadow" width="140%" height="155%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2.2" flood-color="#0f172a" flood-opacity=".25" stdDeviation="2.2"/></filter></defs><style>@keyframes deepseek-mascot-idle-motion{0%,to{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1.5px) scaleY(1.02)}}@keyframes deepseek-mascot-flipper-wave{0%,to{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}@keyframes deepseek-mascot-sprout-pulse{0%,to{transform:translateY(0) scale(1);opacity:.85}50%{transform:translateY(-2px) scale(1.1);opacity:1}}@keyframes deepseek-mascot-blink{0%,44%,48%,to{transform:scaleY(1)}46%{transform:scaleY(.12)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="104" fill="url(#deepseek-mascot-shadow-gradient)" rx="36" ry="7.5"/><g data-animated="true" filter="url(#deepseek-mascot-soft-shadow)" style="animation:deepseek-mascot-idle-motion 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:60px 99px"><path fill="url(#deepseek-mascot-flipper-gradient)" d="M18 68c-6-8-10-18-4-24 6 4 10 14 14 22Z"/><path fill="url(#deepseek-mascot-flipper-gradient)" d="M18 70c-8 6-12 16-6 22 7-4 11-14 16-20Z"/><path fill="url(#deepseek-mascot-flipper-gradient)" d="M42 74c-8 4-14 11-10 16 6 1 14-6 18-12Z" opacity=".8"/><path fill="url(#deepseek-mascot-body-gradient)" d="M24 68c0-23 18-36 44-36 24 0 36 16 36 36 0 16-16 26-42 26-24 0-38-9-38-26"/><path fill="#dbeafe" d="M36 76c6 10 24 16 42 12 12-4 20-12 18-18-4 8-18 14-34 14-14 0-24-6-26-8" opacity=".45"/><path fill="#e0f2fe" d="M38 42c12-7 34-7 50 2-12-5-32-5-46 2Z" opacity=".4"/><g data-animated="true" style="animation:deepseek-mascot-sprout-pulse 2.2s ease-in-out infinite;transform-box:view-box;transform-origin:60px 22px"><path fill="url(#deepseek-mascot-sprout-gradient)" d="M60 32c-2-8-8-14-14-16 6 4 11 10 13 15Z"/><path fill="url(#deepseek-mascot-sprout-gradient)" d="M60 32c2-8 8-14 14-16-6 4-11 10-13 15Z"/><circle cx="60" cy="14" r="2.5" fill="#e0f2fe"/></g><g data-animated="true" style="animation:deepseek-mascot-blink 4.4s ease-in-out infinite;transform-box:view-box;transform-origin:52px 55px"><ellipse cx="68" cy="56" fill="#0f172a" rx="5.5" ry="7"/><circle cx="66.5" cy="53.8" r="1.8" fill="#fff"/></g><path fill="none" stroke="#1e3a8a" stroke-linecap="round" stroke-width="2.6" d="M72 68c4 4 10 4 14 0"/><g data-animated="true" style="animation:deepseek-mascot-flipper-wave 2.5s ease-in-out infinite;transform-box:view-box;transform-origin:85px 68px"><path fill="url(#deepseek-mascot-flipper-gradient)" d="M78 72c10 6 18 12 14 18-7 3-18-5-22-14Z"/></g></g></svg>