<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="ghost-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#010409" />
    </linearGradient>
    <linearGradient id="ghost-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="ghost-glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#ghost-bg); rx: 16px; }
    .ghost-float {
      animation: float-ghost 3s infinite ease-in-out;
    }
    @keyframes float-ghost {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    .keyboard-tap {
      animation: tap-hand 0.4s infinite ease-in-out alternate;
    }
    @keyframes tap-hand {
      0% { transform: translateY(0); }
      100% { transform: translateY(4px); }
    }
    .ghost-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; font-size: 16px; }
    .ghost-sub { font-family: system-ui, -apple-system, sans-serif; fill: #7dd3fc; font-size: 12px; font-weight: 500; }
  </style>

  <rect width="400" height="300" class="bg" />

  <!-- Ghost Floating Mascot -->
  <g class="ghost-float" transform="translate(200, 125)">
    <!-- Main Ghost Silhouette -->
    <path d="M-40 20 C-40 -35 -25 -50 0 -50 C25 -50 40 -35 40 20 C40 35 30 40 20 30 C10 40 0 30 -10 40 C-20 30 -30 40 -40 20 Z" fill="url(#ghost-body)" filter="url(#ghost-glow)" opacity="0.9" />

    <!-- Cute Eyes -->
    <circle cx="-14" cy="-15" r="5" fill="#ffffff" />
    <circle cx="14" cy="-15" r="5" fill="#ffffff" />
    <circle cx="-12" cy="-15" r="2" fill="#0f172a" />
    <circle cx="16" cy="-15" r="2" fill="#0f172a" />

    <!-- Ghost Smile -->
    <path d="M-6 -2 Q0 4 6 -2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Cute Floating Ghost Hands Typing -->
    <g class="keyboard-tap">
      <ellipse cx="-24" cy="10" rx="6" ry="4" fill="#7dd3fc" />
      <ellipse cx="24" cy="10" rx="6" ry="4" fill="#7dd3fc" />
    </g>

    <!-- Floating Ghostly Code Snippet -->
    <g transform="translate(-60, 45)">
      <rect width="120" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 2" />
      <text x="60" y="16" text-anchor="middle" font-family="monospace" font-size="11" fill="#7dd3fc" opacity="0.8">// ghost suggestion</text>
    </g>
  </g>

  <!-- Typography -->
  <text x="200" y="245" text-anchor="middle" class="ghost-title">Copilot Ghost Writer</text>
  <text x="200" y="267" text-anchor="middle" class="ghost-sub">Whispering code suggestions into your editor at 3 AM 👻</text>
</svg>
