<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="anti-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="gemini-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="purple-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#anti-bg); rx: 16px; }
    .levitate {
      animation: levitate-anim 3.5s infinite ease-in-out;
    }
    @keyframes levitate-anim {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(2deg); }
    }
    .ring-rotate {
      animation: rotate-ring 6s linear infinite;
      transform-origin: 200px 135px;
    }
    @keyframes rotate-ring {
      0% { transform: rotateX(70deg) rotateZ(0deg); }
      100% { transform: rotateX(70deg) rotateZ(360deg); }
    }
    .star-pulse {
      animation: star-glow 2s infinite ease-in-out alternate;
    }
    @keyframes star-glow {
      0% { transform: scale(0.95); opacity: 0.85; }
      100% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 12px #818cf8); }
    }
    .orbit-particle { animation: particle-orbit 4s infinite linear; }
    @keyframes particle-orbit {
      0% { transform: rotate(0deg) translateX(75px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(75px) rotate(-360deg); }
    }
    .anti-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; font-size: 16px; letter-spacing: 0.5px; }
    .anti-sub { font-family: system-ui, -apple-system, sans-serif; fill: #a5b4fc; font-size: 12px; font-weight: 500; }
  </style>

  <rect width="400" height="300" class="bg" />

  <!-- Shadow on ground floating under -->
  <ellipse cx="200" cy="210" rx="55" ry="10" fill="#000000" opacity="0.4">
    <animate attributeName="rx" values="55;40;55" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.2;0.4" dur="3.5s" repeatCount="indefinite" />
  </ellipse>

  <!-- Animated Levitating Group -->
  <g class="levitate">
    <!-- Glowing Orbital Ring -->
    <ellipse cx="200" cy="140" rx="85" ry="25" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 200 140" to="360 200 140" dur="10s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="200" cy="140" rx="95" ry="30" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360 200 140" to="0 200 140" dur="12s" repeatCount="indefinite" />
    </ellipse>

    <!-- Gemini 4-Point Star Core (Antigravity Mascot) -->
    <g transform="translate(200, 130)">
      <g class="star-pulse">
        <path d="M0 -55 C5 -20 20 -5 55 0 C20 5 5 20 0 55 C-5 20 -20 5 -55 0 C-20 -5 -5 -20 0 -55 Z" fill="url(#gemini-star)" filter="url(#purple-glow)" />
      </g>
      
      <!-- Cute Face inside Gemini Core -->
      <circle cx="-12" cy="-6" r="4.5" fill="#ffffff" />
      <circle cx="12" cy="-6" r="4.5" fill="#ffffff" />
      <circle cx="-11" cy="-7" r="1.8" fill="#1e1b4b" />
      <circle cx="13" cy="-7" r="1.8" fill="#1e1b4b" />
      
      <!-- Winking/Happy Mouth -->
      <path d="M-6 6 Q0 12 6 6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Floating zero-gravity particles -->
    <g transform="translate(200, 130)">
      <circle cx="0" cy="0" r="4" fill="#a5b4fc" class="orbit-particle" />
      <circle cx="0" cy="0" r="3" fill="#e0e7ff" class="orbit-particle" style="animation-duration: 3s; animation-direction: reverse;" />
    </g>
  </g>

  <!-- Typography -->
  <text x="200" y="245" text-anchor="middle" class="anti-title">Google Antigravity</text>
  <text x="200" y="267" text-anchor="middle" class="anti-sub">Zero-G Agentic Coding &amp; High-Speed Inference 🚀</text>
</svg>
