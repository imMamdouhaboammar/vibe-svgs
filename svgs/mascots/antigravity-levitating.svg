<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 300"><defs><linearGradient id="anti-bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="gemini-star" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#4f46e5"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="purple-glow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes levitate-anim{0%,to{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-16px) rotate(2deg)}}@keyframes rotate-ring{0%{transform:rotateX(70deg) rotateZ(0deg)}to{transform:rotateX(70deg) rotateZ(360deg)}}@keyframes star-glow{0%{transform:scale(.95);opacity:.85}to{transform:scale(1.08);opacity:1;filter:drop-shadow(0 0 12px #818cf8)}}@keyframes particle-orbit{0%{transform:rotate(0deg) translateX(75px) rotate(0deg)}to{transform:rotate(360deg) translateX(75px) rotate(-360deg)}}.orbit-particle{animation:particle-orbit 4s infinite linear}</style><path d="M0 0h400v300H0z" style="fill:url(#anti-bg);rx:16px"/><ellipse cx="200" cy="210" fill="#000" opacity=".4" rx="55" ry="10"><animate attributeName="rx" dur="3.5s" repeatCount="indefinite" values="55;40;55"/><animate attributeName="opacity" dur="3.5s" repeatCount="indefinite" values="0.4;0.2;0.4"/></ellipse><g style="animation:levitate-anim 3.5s infinite ease-in-out"><ellipse cx="200" cy="140" fill="none" stroke="#818cf8" stroke-dasharray="8 6" stroke-width="2.5" opacity=".8" rx="85" ry="25"><animateTransform attributeName="transform" dur="10s" from="0 200 140" repeatCount="indefinite" to="360 200 140" type="rotate"/></ellipse><ellipse cx="200" cy="140" fill="none" stroke="#c084fc" stroke-width="1.5" opacity=".5" rx="95" ry="30"><animateTransform attributeName="transform" dur="12s" from="360 200 140" repeatCount="indefinite" to="0 200 140" type="rotate"/></ellipse><g transform="translate(200 130)"><g style="animation:star-glow 2s infinite ease-in-out alternate"><path fill="url(#gemini-star)" d="M0-55C5-20 20-5 55 0 20 5 5 20 0 55-5 20-20 5-55 0-20-5-5-20 0-55" filter="url(#purple-glow)"/></g><circle cx="-12" cy="-6" r="4.5" fill="#fff"/><circle cx="12" cy="-6" r="4.5" fill="#fff"/><circle cx="-11" cy="-7" r="1.8" fill="#1e1b4b"/><circle cx="13" cy="-7" r="1.8" fill="#1e1b4b"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2" d="M-6 6q6 6 12 0"/></g><g transform="translate(200 130)"><circle cx="0" cy="0" r="4" fill="#a5b4fc" class="orbit-particle"/><circle cx="0" cy="0" r="3" fill="#e0e7ff" class="orbit-particle" style="animation-duration:3s;animation-direction:reverse"/></g></g><text x="200" y="245" style="font-family:system-ui,-apple-system,sans-serif;font-weight:800;fill:#fff;font-size:16px;letter-spacing:.5px" text-anchor="middle">Google Antigravity</text><text x="200" y="267" style="font-family:system-ui,-apple-system,sans-serif;fill:#a5b4fc;font-size:12px;font-weight:500" text-anchor="middle">Zero-G Agentic Coding &amp; High-Speed Inference 🚀</text></svg>