<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="codex-mascot-title codex-mascot-desc">
  <title id="codex-mascot-title">Codex community mascot holding a keyboard key</title>
  <desc id="codex-mascot-desc">A rounded violet and cyan coding character with connected limbs, a dark face panel, terminal cue, and a small keyboard key attached to its hand.</desc>
  <defs>
    <linearGradient id="codex-mascot-body-gradient" x1="0.08" y1="0.05" x2="0.88" y2="0.95">
      <stop offset="0" stop-color="#B58CFF"/>
      <stop offset="0.48" stop-color="#7257E8"/>
      <stop offset="1" stop-color="#27C6D9"/>
    </linearGradient>
    <linearGradient id="codex-mascot-limb-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8065EC"/>
      <stop offset="1" stop-color="#289DB9"/>
    </linearGradient>
    <linearGradient id="codex-mascot-key-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#A8B7C7"/>
    </linearGradient>
    <radialGradient id="codex-mascot-shadow-gradient" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#1C163E" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#1C163E" stop-opacity="0"/>
    </radialGradient>
    <filter id="codex-mascot-soft-shadow" x="-24%" y="-24%" width="148%" height="160%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.4" flood-color="#251B54" flood-opacity="0.24"/>
    </filter>
  </defs>
  <style>
    .codex-mascot-idle {
      animation: codex-mascot-idle-motion 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 99px;
    }
    .codex-mascot-left-arm {
      animation: codex-mascot-key-wave 2.8s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 30px 61px;
    }
    .codex-mascot-visor {
      animation: codex-mascot-visor-pulse 2.2s ease-in-out infinite;
    }
    @keyframes codex-mascot-idle-motion {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-1.2px) scaleY(1.016); }
    }
    @keyframes codex-mascot-key-wave {
      0%, 20%, 100% { transform: rotate(7deg); }
      50% { transform: rotate(-7deg); }
      70% { transform: rotate(-2deg); }
    }
    @keyframes codex-mascot-visor-pulse {
      0%, 100% { opacity: .68; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <ellipse cx="60" cy="106" rx="32" ry="7" fill="url(#codex-mascot-shadow-gradient)"/>

  <g class="codex-mascot-idle" data-animated="true" filter="url(#codex-mascot-soft-shadow)">
    <g aria-hidden="true">
      <path d="M39 84 C36 91 37 100 42 104 C46 107 51 104 51 100 L51 84 Z" fill="url(#codex-mascot-limb-gradient)"/>
      <path d="M69 84 L69 100 C69 105 74 107 78 104 C83 100 84 91 81 84 Z" fill="url(#codex-mascot-limb-gradient)"/>
      <ellipse cx="45" cy="102" rx="8.8" ry="4.4" fill="#31578D"/>
      <ellipse cx="76" cy="102" rx="8.8" ry="4.4" fill="#27647F"/>
    </g>

    <g class="codex-mascot-left-arm" data-animated="true">
      <path d="M34 56 C22 56 16 64 19 73 C21 79 28 81 34 75 L40 68 Z" fill="url(#codex-mascot-limb-gradient)"/>
      <circle cx="21" cy="72" r="5.4" fill="#6C65D8"/>
      <g transform="translate(16 68) rotate(-12)">
        <rect x="-8" y="-12" width="16" height="14" rx="4" fill="url(#codex-mascot-key-gradient)" stroke="#56687A" stroke-width="1.2"/>
        <path d="M-3 -7 L0 -4 L3 -7" fill="none" stroke="#4F5F70" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <g aria-hidden="true">
      <path d="M86 56 C98 56 104 64 101 73 C99 79 92 81 86 75 L80 68 Z" fill="url(#codex-mascot-limb-gradient)"/>
      <circle cx="99" cy="72" r="5.4" fill="#37A8C3"/>
    </g>

    <path d="M37 31 C42 25 50 23 57 25 C63 20 74 22 78 28 C87 29 94 37 92 46 C99 53 96 65 89 70 C91 81 82 90 71 90 L45 90 C34 90 26 82 28 72 C20 67 18 56 24 49 C21 40 28 32 37 31 Z" fill="url(#codex-mascot-body-gradient)"/>
    <path d="M36 37 C48 26 69 27 82 38 C68 33 50 35 39 43 C35 46 33 43 36 37 Z" fill="#E9DEFF" opacity=".34"/>
    <path d="M31 70 C43 83 75 90 90 68 C88 82 80 90 69 91 L46 91 C37 90 31 83 31 70 Z" fill="#243D88" opacity=".2"/>

    <rect x="38" y="43" width="44" height="30" rx="14" fill="#17152E" opacity=".94"/>
    <rect class="codex-mascot-visor" data-animated="true" x="43" y="48" width="34" height="4" rx="2" fill="#76F2FF" opacity=".8"/>
    <ellipse cx="50" cy="58" rx="4.6" ry="5.6" fill="#E8FAFF"/>
    <ellipse cx="70" cy="58" rx="4.6" ry="5.6" fill="#E8FAFF"/>
    <circle cx="49" cy="57" r="1.6" fill="#4A4BD0"/>
    <circle cx="69" cy="57" r="1.6" fill="#29B8CE"/>
    <path d="M48 67 L53 71 L48 75" fill="none" stroke="#8AF7FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M58 75 H70" fill="none" stroke="#8AF7FF" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
