<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" role="img" aria-labelledby="deepseek-suite-hd-title deepseek-suite-hd-desc">
  <title id="deepseek-suite-hd-title">DeepSeek Community Suite Banner</title>
  <desc id="deepseek-suite-hd-desc">A showcase banner displaying rounded 2.5D ocean blue DeepSeek whale artwork and diving scenes.</desc>
  <defs>
    <linearGradient id="deepseek-suite-hd-bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091E42"/>
      <stop offset="0.5" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="deepseek-suite-hd-body-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.6" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="deepseek-suite-hd-shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="deepseek-suite-hd-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .deepseek-suite-hd-main-char {
      animation: deepseek-suite-hd-float 3.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 250px 110px;
    }
    @keyframes deepseek-suite-hd-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <!-- Background -->
  <rect width="500" height="220" rx="16" fill="url(#deepseek-suite-hd-bg-gradient)"/>
  <rect width="496" height="216" x="2" y="2" rx="14" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.3"/>

  <!-- Title Text -->
  <text x="30" y="45" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#93C5FD" opacity="0.95">DEEPSEEK MASCOT SUITE</text>
  <text x="30" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#60A5FA" opacity="0.8">Community 2.5D Vector Artwork</text>

  <!-- Main Mascot Showcase Center -->
  <g class="deepseek-suite-hd-main-char" data-animated="true" filter="url(#deepseek-suite-hd-soft-shadow)">
    <ellipse cx="250" cy="180" rx="55" ry="9" fill="url(#deepseek-suite-hd-shadow-gradient)"/>
    <path d="M190 120 C190 90 230 85 275 98 C300 105 308 122 300 138 C290 154 245 158 210 150 C195 146 190 135 190 120 Z" fill="url(#deepseek-suite-hd-body-gradient)"/>
    <circle cx="282" cy="115" r="6" fill="#0F172A"/>
    <circle cx="280" cy="113" r="2" fill="#FFFFFF"/>
    <path d="M250 88 Q250 78 255 78 Q250 78 250 68 Q250 78 245 78 Q250 78 250 88 Z" fill="#60A5FA"/>
  </g>
</svg>
