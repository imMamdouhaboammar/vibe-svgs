iew-box;transform-origin:250px 110px"><ellipse cx="250" cy="180" fill="url(#deepseek-suite-hd-shadow-gradient)" rx="55" ry="9"/><path fill="url(#deepseek-suite-hd-body-gradient)" d="M190 120c0-30 40-35 85-22 25 7 33 24 25 40-10 16-55 20-90 12-15-4-20-15-20-30"/><circle cx="282" cy="115" r="6" fill="#0f172a"/><circle cx="280" cy="113" r="2" fill="#fff"/><path fill="#60a5fa" d="M250 88q0-10 5-10-5 0-5-10 0 10-5 10 5 0 5 10"/></g></svg>