<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="ds-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="50%" stop-color="#14213d" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <linearGradient id="dsBodyGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4D6BFE"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <radialGradient id="dsShadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .card-bg { fill: url(#ds-bg); rx: 20px; stroke: #3b82f6; stroke-width: 2px; }
    .whale-float { animation: float-ds 4s infinite ease-in-out alternate; }
    @keyframes float-ds { 0% { transform: translateY(0px) rotate(-2deg); } 100% { transform: translateY(-10px) rotate(2deg); } }
    .sonar-spout { animation: spout-ds 2.5s infinite linear; transform-origin: 390px 85px; }
    @keyframes spout-ds { 0% { r: 6px; opacity: 1; stroke-width: 2px; } 100% { r: 28px; opacity: 0; stroke-width: 0.5px; } }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; fill: #ffffff; font-size: 22px; }
    .sub-text { font-family: monospace; fill: #93c5fd; font-size: 13px; font-weight: 600; }
  </style>

  <rect width="500" height="280" class="card-bg" />

  <!-- Platform Badge -->
  <g transform="translate(30, 25)">
    <rect width="130" height="28" rx="14" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="65" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#bfdbfe">DEEPSEEK V3</text>
  </g>

  <!-- Title & Info -->
  <g transform="translate(30, 85)">
    <text x="0" y="0" class="title-text">DeepSeek Open-Source Reasoning</text>
    <text x="0" y="24" class="sub-text">🐳 Deep Sea Ocean Code Architecture</text>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="370" cy="225" rx="65" ry="9" fill="url(#dsShadowGrad)" />

  <!-- Whale 3D Mascot Character (Right Side) -->
  <g class="whale-float" transform="translate(240, 60)">
    <!-- Whale Body -->
    <path d="M 40 80 C 40 35 90 25 150 40 C 190 50 210 65 200 90 C 195 110 140 115 80 110 C 55 105 40 95 40 80 Z" fill="url(#dsBodyGrad)" />
    <!-- Whale Tail -->
    <path d="M 40 80 Q 15 65 0 45 Q 20 70 40 80 Q 20 90 0 115 Q 15 95 40 80 Z" fill="#1E40AF" />

    <!-- Eye -->
    <circle cx="165" cy="65" r="6" fill="#FFFFFF" />
    <circle cx="167" cy="65" r="2.5" fill="#0F172A" />

    <!-- Blowhole Sonar Wave -->
    <circle cx="150" cy="25" r="12" fill="none" stroke="#60A5FA" class="sonar-spout" />
  </g>
</svg>
