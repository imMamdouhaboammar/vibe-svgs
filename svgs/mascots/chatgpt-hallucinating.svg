<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="gpt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f1d" />
      <stop offset="100%" stop-color="#09050e" />
    </linearGradient>
    <linearGradient id="teal-radial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" />
      <stop offset="100%" stop-color="#0d7a5f" />
    </linearGradient>
    <filter id="teal-glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#gpt-bg); rx: 16px; }
    .confetti {
      animation: float-confetti 3s infinite linear;
    }
    @keyframes float-confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-50px) rotate(360deg); opacity: 0; }
    }
    .spin-eye {
      animation: spin-eye-anim 4s linear infinite;
      transform-origin: center;
    }
    @keyframes spin-eye-anim {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .badge-bounce {
      animation: bounce-badge 2s infinite ease-in-out alternate;
    }
    @keyframes bounce-badge {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }
    .gpt-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; font-size: 16px; }
    .gpt-sub { font-family: system-ui, -apple-system, sans-serif; fill: #6ee7b7; font-size: 12px; font-weight: 500; }
  </style>

  <rect width="400" height="300" class="bg" />

  <!-- Floating Hallucinated Statements -->
  <g transform="translate(60, 60)" class="confetti">
    <rect width="130" height="26" rx="13" fill="#2d1b4e" stroke="#a855f7" stroke-width="1" />
    <text x="65" y="17" text-anchor="middle" font-family="monospace" font-size="10" fill="#e9d5ff">100% Sure Facts ✨</text>
  </g>
  <g transform="translate(230, 80)" class="confetti" style="animation-delay: 1.5s;">
    <rect width="120" height="26" rx="13" fill="#2d1b4e" stroke="#10a37f" stroke-width="1" />
    <text x="60" y="17" text-anchor="middle" font-family="monospace" font-size="10" fill="#a7f3d0">Python created in 1742</text>
  </g>

  <!-- ChatGPT Mascot Body -->
  <g transform="translate(200, 150)">
    <!-- Main Node Circle -->
    <circle cx="0" cy="0" r="45" fill="url(#teal-radial)" filter="url(#teal-glow)" />
    
    <!-- Inner Spiral Swirl -->
    <path d="M-20 -20 Q0 -40 20 -20 Q40 0 20 20 Q0 40 -20 20 Q-40 0 -20 -20 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4" />

    <!-- Starry Hallucinating Eyes -->
    <g class="spin-eye">
      <!-- Left Star Eye -->
      <path d="M-18 -8 L-15 -3 L-10 -3 L-14 1 L-12 6 L-18 3 L-24 6 L-22 1 L-26 -3 L-21 -3 Z" fill="#fef08a" />
      <!-- Right Star Eye -->
      <path d="M18 -8 L21 -3 L26 -3 L22 1 L24 6 L18 3 L12 6 L14 1 L10 -3 L15 -3 Z" fill="#fef08a" />
    </g>

    <!-- Big Confident Smile -->
    <path d="M-15 14 Q0 24 15 14" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

    <!-- 100% Confidence Badge overlay -->
    <g transform="translate(30, 20)" class="badge-bounce">
      <circle cx="0" cy="0" r="18" fill="#eab308" stroke="#ffffff" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="10" fill="#422006">100%</text>
    </g>
  </g>

  <!-- Floating stars -->
  <circle cx="90" cy="180" r="3" fill="#a855f7" />
  <circle cx="310" cy="170" r="4" fill="#fef08a" />
  <circle cx="120" cy="220" r="2.5" fill="#10a37f" />

  <!-- Typography -->
  <text x="200" y="245" text-anchor="middle" class="gpt-title">ChatGPT Hallucinating with Confidence</text>
  <text x="200" y="267" text-anchor="middle" class="gpt-sub">Completely wrong, but delivered with supreme authority ✨</text>
</svg>
