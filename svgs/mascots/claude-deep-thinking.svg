<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 300"><defs><linearGradient id="claude-bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e1b18"/><stop offset="100%" stop-color="#12100e"/></linearGradient><linearGradient id="claude-body" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#d97757"/><stop offset="100%" stop-color="#b85433"/></linearGradient><linearGradient id="glow-wave" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f97316" stop-opacity="0"/><stop offset="50%" stop-color="#fb923c" stop-opacity=".8"/><stop offset="100%" stop-color="#f97316" stop-opacity="0"/></linearGradient><filter id="orange-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-wave{0%{transform:scale(.85);opacity:.8;stroke-width:2}50%{transform:scale(1.15);opacity:.3;stroke-width:4}to{transform:scale(1.35);opacity:0;stroke-width:1}}@keyframes float-up{0%{transform:translateY(0) scale(.9);opacity:0}30%{opacity:.9}80%{opacity:.8}to{transform:translateY(-45px) scale(1.1);opacity:0}}@keyframes blink{0%,94%,98%,to{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes spin-sparkle{0%{transform:rotate(0deg)}to{transform:rotate(360deg)}}.thinking-wave{animation:pulse-wave 2s infinite ease-in-out;transform-origin:200px 130px}</style><path d="M0 0h400v300H0z" style="fill:url(#claude-bg);rx:16px"/><circle cx="200" cy="130" r="60" fill="none" stroke="#f97316" class="thinking-wave"/><circle cx="200" cy="130" r="60" fill="none" stroke="#fdba74" class="thinking-wave" style="animation-delay:.6s"/><circle cx="200" cy="130" r="60" fill="none" stroke="#ffedd5" class="thinking-wave" style="animation-delay:1.2s"/><g style="animation:float-up 3s infinite ease-in-out" transform="translate(110 100)"><rect width="70" height="24" x="-35" y="-12" fill="#292524" stroke="#ea580c" stroke-width="1.5" rx="12"/><text x="0" y="4" fill="#fdba74" font-family="monospace" font-size="11" text-anchor="middle">&lt;prompt&gt;</text></g><g style="animation:float-up 3.5s infinite ease-in-out 1s" transform="translate(290 110)"><rect width="80" height="24" x="-40" y="-12" fill="#292524" stroke="#f97316" stroke-width="1.5" rx="12"/><text x="0" y="4" fill="#fed7aa" font-family="monospace" font-size="11" text-anchor="middle">thinking...</text></g><g style="animation:float-up 2.8s infinite ease-in-out 1.8s" transform="translate(200 60)"><rect width="90" height="24" x="-45" y="-12" fill="#292524" stroke="#fb923c" stroke-width="1.5" rx="12"/><text x="0" y="4" fill="#ffedd5" font-family="monospace" font-size="11" text-anchor="middle">{ reasoning }</text></g><g transform="translate(200 155)"><rect width="90" height="70" x="-45" y="-35" fill="url(#claude-body)" filter="url(#orange-glow)" rx="24"/><rect width="70" height="50" x="-35" y="-25" fill="#1c1917" rx="16"/><g style="animation:blink 4s infinite;transform-origin:center"><circle cx="-16" cy="-4" r="6" fill="#ffedd5"/><circle cx="16" cy="-4" r="6" fill="#ffedd5"/><circle cx="-14" cy="-6" r="2.5" fill="#1c1917"/><circle cx="18" cy="-6" r="2.5" fill="#1c1917"/></g><path fill="none" stroke="#ffedd5" stroke-linecap="round" stroke-width="2.5" d="M-10 10q10 8 20 0"/><rect width="10" height="15" x="-38" y="-45" fill="#d97757" rx="5" transform="rotate(-20 -33 -37)"/><rect width="10" height="15" x="28" y="-45" fill="#d97757" rx="5" transform="rotate(20 33 -37)"/></g><g style="animation:spin-sparkle 4s linear infinite;transform-origin:200px 70px"><path fill="#fb923c" d="m200 55 3 12 12 3-12 3-3 12-3-12-12-3 12-3Z"/></g><text x="200" y="240" style="font-family:system-ui,-apple-system,sans-serif;font-weight:700;fill:#f3f4f6;font-size:16px" text-anchor="middle">Claude Code</text><text x="200" y="262" style="font-family:system-ui,-apple-system,sans-serif;fill:#d1d5db;font-size:12px;font-weight:500" text-anchor="middle">Deeply