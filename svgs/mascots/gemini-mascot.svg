<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="gemini-mascot-title gemini-mascot-desc" role="img" viewBox="0 0 120 120"><title id="gemini-mascot-title">Gemini community mascot holding a glowing four-point sparkle</title><desc id="gemini-mascot-desc">A rounded blue-violet coding mascot with connected limbs, upper-left lighting, spatial sparkles, and a grounded contact shadow.</desc><defs><linearGradient id="gemini-mascot-body-gradient" x1=".12" x2=".82" y1=".05" y2=".95"><stop offset="0" stop-color="#818cf8"/><stop offset=".48" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/></linearGradient><linearGradient id="gemini-mascot-limb-gradient" x1=".1" x2=".9" y1="0" y2="1"><stop offset="0" stop-color="#717cf6"/><stop offset="1" stop-color="#3730a3"/></linearGradient><linearGradient id="gemini-mascot-sparkle-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset=".5" stop-color="#a5b4fc"/><stop offset="1" stop-color="#6366f1"/></linearGradient><radialGradient id="gemini-mascot-shadow-gradient" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#1e1b4b" stop-opacity=".36"/><stop offset="1" stop-color="#1e1b4b" stop-opacity="0"/></radialGradient><filter id="gemini-mascot-soft-shadow" width="140%" height="155%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2.2" flood-color="#1e1b4b" flood-opacity=".25" stdDeviation="2.2"/></filter></defs><style>@keyframes gemini-mascot-idle-motion{0%,to{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1.3px) scaleY(1.02)}}@keyframes gemini-mascot-sparkle-pulse{0%,to{transform:rotate(-5deg) scale(1)}50%{transform:rotate(10deg) scale(1.08)}}@keyframes gemini-mascot-blink{0%,44%,48%,to{transform:scaleY(1)}46%{transform:scaleY(.12)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="106" fill="url(#gemini-mascot-shadow-gradient)" rx="32" ry="7"/><g data-animated="true" filter="url(#gemini-mascot-soft-shadow)" style="animation:gemini-mascot-idle-motion 3.3s ease-in-out infinite;transform-box:view-box;transform-origin:60px 99px"><g aria-hidden="true"><path fill="url(#gemini-mascot-limb-gradient)" d="M39 84c-3 7-3 17 2 21 4 3 9 0 9-4V85Z"/><path fill="url(#gemini-mascot-limb-gradient)" d="M70 85v16c0 5 6 7 10 3 4-5 3-13 0-20Z"/><ellipse cx="44" cy="103" fill="#312e81" opacity=".9" rx="9" ry="4.5"/><ellipse cx="77" cy="103" fill="#312e81" opacity=".9" rx="9" ry="4.5"/></g><g aria-hidden="true"><path fill="url(#gemini-mascot-limb-gradient)" d="M31 55c-11 2-16 11-12 20 3 6 10 5 14 0l6-8Z"/><circle cx="21" cy="73" r="5.5" fill="#4f46e5"/></g><rect width="64" height="62" x="28" y="28" fill="url(#gemini-mascot-body-gradient)" rx="24"/><path fill="#c7d2fe" d="M34 38c12-11 36-13 50-1-9-4-29-3-42 6-4 3-7 2-8-5" opacity=".32"/><path fill="#1e1b4b" d="M31 70c12 14 44 21 58-2v11c-5 9-15 13-29 13-15 0-25-5-30-14Z" opacity=".25"/><g data-animated="true" style="animation:gemini-mascot-blink 4.5s ease-in-out infinite;transform-box:view-box;transform-origin:60px 54px"><ellipse cx="49" cy="54" fill="#1e1b4b" rx="5.7" ry="7.2"/><ellipse cx="72" cy="54" fill="#1e1b4b" rx="5.7" ry="7.2"/><circle cx="47.4" cy="51.7" r="1.8" fill="#fff" opacity=".92"/><circle cx="70.4" cy="51.7" r="1.8" fill="#fff" opacity=".92"/></g><path fill="none" stroke="#312e81" stroke-linecap="round" stroke-width="2.8" d="M52 69c5 4 12 4 17 0"/><g data-animated="true" style="animation:gemini-mascot-sparkle-pulse 2.7s ease-in-out infinite;transform-box:view-box;transform-origin:91px 59px"><path fill="url(#gemini-mascot-limb-gradient)" d="M88 55c11 0 17 7 14 16-2 6-8 8-13 4l-6-7Z"/><circle cx="101" cy="69" r="5.5" fill="#4f46e5"/><g transform="translate(101 64)"><path fill="url(#gemini-mascot-sparkle-gradient)" d="M0-12Q0 0 12 0 0 0 0 12 0 0-12 0 0 0 0-12"/><circle cx="0" cy="0" r="2.2" fill="#fff"/></g></g></g></svg>