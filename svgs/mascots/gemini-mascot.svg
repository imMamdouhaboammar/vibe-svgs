<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="gemini-mascot-title gemini-mascot-desc">
  <title id="gemini-mascot-title">Gemini community mascot holding a glowing four-point sparkle</title>
  <desc id="gemini-mascot-desc">A rounded blue-violet coding mascot with connected limbs, upper-left lighting, spatial sparkles, and a grounded contact shadow.</desc>
  <defs>
    <linearGradient id="gemini-mascot-body-gradient" x1="0.12" y1="0.05" x2="0.82" y2="0.95">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.48" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="gemini-mascot-limb-gradient" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#717CF6"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="gemini-mascot-sparkle-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0E7FF"/>
      <stop offset="0.5" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="gemini-mascot-shadow-gradient" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#1E1B4B" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
    <filter id="gemini-mascot-soft-shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.2" flood-color="#1E1B4B" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    .gemini-mascot-idle {
      animation: gemini-mascot-idle-motion 3.3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 99px;
    }
    .gemini-mascot-sparkle-hand {
      animation: gemini-mascot-sparkle-pulse 2.7s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 91px 59px;
    }
    .gemini-mascot-eyes {
      animation: gemini-mascot-blink 4.5s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 54px;
    }
    @keyframes gemini-mascot-idle-motion {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-1.3px) scaleY(1.02); }
    }
    @keyframes gemini-mascot-sparkle-pulse {
      0%, 100% { transform: rotate(-5deg) scale(1); }
      50% { transform: rotate(10deg) scale(1.08); }
    }
    @keyframes gemini-mascot-blink {
      0%, 44%, 48%, 100% { transform: scaleY(1); }
      46% { transform: scaleY(0.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <ellipse cx="60" cy="106" rx="32" ry="7" fill="url(#gemini-mascot-shadow-gradient)"/>

  <g class="gemini-mascot-idle" data-animated="true" filter="url(#gemini-mascot-soft-shadow)">
    <g aria-hidden="true">
      <path d="M39 84 C36 91 36 101 41 105 C45 108 50 105 50 101 L50 85 Z" fill="url(#gemini-mascot-limb-gradient)"/>
      <path d="M70 85 L70 101 C70 106 76 108 80 104 C84 99 83 91 80 84 Z" fill="url(#gemini-mascot-limb-gradient)"/>
      <ellipse cx="44" cy="103" rx="9" ry="4.5" fill="#312E81" opacity="0.9"/>
      <ellipse cx="77" cy="103" rx="9" ry="4.5" fill="#312E81" opacity="0.9"/>
    </g>

    <g aria-hidden="true">
      <path d="M31 55 C20 57 15 66 19 75 C22 81 29 80 33 75 L39 67 Z" fill="url(#gemini-mascot-limb-gradient)"/>
      <circle cx="21" cy="73" r="5.5" fill="#4F46E5"/>
    </g>

    <rect x="28" y="28" width="64" height="62" rx="24" fill="url(#gemini-mascot-body-gradient)"/>
    <path d="M34 38 C46 27 70 25 84 37 C75 33 55 34 42 43 C38 46 35 45 34 38 Z" fill="#C7D2FE" opacity="0.32"/>
    <path d="M31 70 C43 84 75 91 89 68 L89 79 C84 88 74 92 60 92 C45 92 35 87 30 78 Z" fill="#1E1B4B" opacity="0.25"/>

    <g class="gemini-mascot-eyes" data-animated="true">
      <ellipse cx="49" cy="54" rx="5.7" ry="7.2" fill="#1E1B4B"/>
      <ellipse cx="72" cy="54" rx="5.7" ry="7.2" fill="#1E1B4B"/>
      <circle cx="47.4" cy="51.7" r="1.8" fill="#FFFFFF" opacity="0.92"/>
      <circle cx="70.4" cy="51.7" r="1.8" fill="#FFFFFF" opacity="0.92"/>
    </g>
    <path d="M52 69 C57 73 64 73 69 69" fill="none" stroke="#312E81" stroke-width="2.8" stroke-linecap="round"/>

    <g class="gemini-mascot-sparkle-hand" data-animated="true">
      <path d="M88 55 C99 55 105 62 102 71 C100 77 94 79 89 75 L83 68 Z" fill="url(#gemini-mascot-limb-gradient)"/>
      <circle cx="101" cy="69" r="5.5" fill="#4F46E5"/>
      <g transform="translate(101 64)">
        <path d="M0 -12 Q0 0 12 0 Q0 0 0 12 Q0 0 -12 0 Q0 0 0 -12 Z" fill="url(#gemini-mascot-sparkle-gradient)"/>
        <circle cx="0" cy="0" r="2.2" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
</svg>
