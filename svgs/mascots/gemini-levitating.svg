<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="gemini-levitating-title gemini-levitating-desc" role="img" viewBox="0 0 120 120"><title id="gemini-levitating-title">Gemini community mascot levitating in zero-gravity</title><desc id="gemini-levitating-desc">A rounded blue-violet character floating gracefully above the ground with a glowing four-point sparkle core.</desc><defs><linearGradient id="gemini-levitating-body-gradient" x1=".1" x2=".9" y1="0" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><linearGradient id="gemini-levitating-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#9333ea"/><stop offset="1" stop-color="#2563eb"/></linearGradient><radialGradient id="gemini-levitating-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1e1b4b" stop-opacity=".32"/><stop offset="1" stop-color="#1e1b4b" stop-opacity="0"/></radialGradient><filter id="gemini-levitating-soft-shadow" width="140%" height="150%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#312e81" flood-opacity=".22" stdDeviation="2.2"/></filter></defs><style>@keyframes gemini-levitating-shadow-float{0%,to{transform:scaleX(1);opacity:.32}50%{transform:scaleX(.65);opacity:.15}}@keyframes gemini-levitating-char-float{0%,to{transform:translateY(0)}50%{transform:translateY(-16px)}}@keyframes gemini-levitating-sparkle-pulse{0%,to{transform:scale(1) rotate(0deg)}50%{transform:scale(1.25) rotate(90deg)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="106" fill="url(#gemini-levitating-shadow-gradient)" data-animated="true" rx="32" ry="6" style="animation:gemini-levitating-shadow-float 3s ease-in-out infinite;transform-box:view-box;transform-origin:60px 106px"/><g data-animated="true" filter="url(#gemini-levitating-soft-shadow)" style="animation:gemini-levitating-char-float 3s ease-in-out infinite;transform-box:view-box;transform-origin:60px 85px"><g aria-hidden="true"><path fill="url(#gemini-levitating-limb-gradient)" d="M40 82c-2 8 1 16 6 19 4 3 8-1 7-6l-1-13Z"/><ellipse cx="47" cy="99" fill="#1e1b4b" rx="7.5" ry="3.8"/><path fill="url(#gemini-levitating-limb-gradient)" d="m68 82-1 13c-1 5 3 9 7 6 5-3 8-11 5-19Z"/><ellipse cx="73" cy="99" fill="#1e1b4b" rx="7.5" ry="3.8"/></g><path fill="url(#gemini-levitating-limb-gradient)" d="M34 56c-12-4-20 2-18 10 2 6 10 8 18 2Z"/><path fill="url(#gemini-levitating-limb-gradient)" d="M86 56c12-4 20 2 18 10-2 6-10 8-18 2Z"/><rect width="64" height="60" x="28" y="30" fill="url(#gemini-levitating-body-gradient)" rx="24"/><path fill="#f0abfc" d="M34 40c11-10 37-12 52-1-12-4-31-2-44 6-4 3-8 2-8-5" opacity=".35"/><ellipse cx="49" cy="53" fill="#0f172a" rx="5.6" ry="7"/><ellipse cx="71" cy="53" fill="#0f172a" rx="5.6" ry="7"/><circle cx="47.4" cy="50.8" r="1.8" fill="#f472b6"/><circle cx="69.4" cy="50.8" r="1.8" fill="#f472b6"/><path fill="none" stroke="#f0abfc" stroke-linecap="round" stroke-width="2.5" d="M53 64c4 3 10 3 14 0"/><g data-animated="true" style="animation:gemini-levitating-sparkle-pulse 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:60px 73px"><path fill="#fff" d="M60 67q0 6 6 6-6 0-6 6 0-6-6-6 6 0 6-6"/></g></g></svg>