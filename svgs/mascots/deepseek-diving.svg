<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="deepseek-diving-title deepseek-diving-desc">
  <title id="deepseek-diving-title">DeepSeek community whale mascot diving deep into code</title>
  <desc id="deepseek-diving-desc">A rounded ocean-blue whale character diving downward into deep reasoning with floating water bubbles.</desc>
  <defs>
    <linearGradient id="deepseek-diving-body-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.6" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="deepseek-diving-belly-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <radialGradient id="deepseek-diving-shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <filter id="deepseek-diving-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    .deepseek-diving-shadow {
      animation: deepseek-diving-shadow-scale 3.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 106px;
    }
    .deepseek-diving-character {
      animation: deepseek-diving-whale-dive 3.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 60px;
    }
    .deepseek-diving-bubble-1 {
      animation: deepseek-diving-bubble-float 2.5s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 30px 70px;
    }
    .deepseek-diving-bubble-2 {
      animation: deepseek-diving-bubble-float 2.5s ease-in-out 1.2s infinite;
      transform-box: view-box;
      transform-origin: 90px 65px;
    }
    @keyframes deepseek-diving-shadow-scale {
      0%, 100% { transform: scaleX(1); opacity: .3; }
      50% { transform: scaleX(.75); opacity: .18; }
    }
    @keyframes deepseek-diving-whale-dive {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(10px) rotate(4deg); }
    }
    @keyframes deepseek-diving-bubble-float {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      30% { opacity: 0.9; }
      80% { transform: translate(0, -25px) scale(1.1); opacity: 0.6; }
      100% { transform: translate(0, -35px) scale(1.2); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <ellipse class="deepseek-diving-shadow" data-animated="true" cx="60" cy="106" rx="35" ry="6" fill="url(#deepseek-diving-shadow-gradient)"/>

  <g class="deepseek-diving-character" data-animated="true" filter="url(#deepseek-diving-soft-shadow)">
    <!-- Whale Body -->
    <path d="M20 54 C20 30 50 25 82 34 C100 40 106 54 100 68 C92 82 58 84 34 78 C24 75 20 66 20 54 Z" fill="url(#deepseek-diving-body-gradient)"/>
    <!-- Soft Belly -->
    <path d="M34 65 C44 76 76 77 92 64 C86 73 66 80 40 76 C30 74 27 68 34 65 Z" fill="url(#deepseek-diving-belly-gradient)"/>

    <!-- Tail Fin up top/back -->
    <path d="M22 50 C14 42 10 32 14 26 C20 34 25 42 26 48 Z" fill="url(#deepseek-diving-body-gradient)"/>

    <!-- Side Flippers -->
    <path d="M48 64 C42 74 38 82 46 84 C52 82 56 74 54 66 Z" fill="url(#deepseek-diving-body-gradient)"/>

    <!-- Eye -->
    <circle cx="78" cy="50" r="5" fill="#0F172A"/>
    <circle cx="76.5" cy="48.5" r="1.6" fill="#FFFFFF"/>

    <!-- Blowhole Sparkle / Sprout -->
    <path d="M58 28 Q58 20 62 20 Q58 20 58 12 Q58 20 54 20 Q58 20 58 28 Z" fill="#60A5FA"/>
  </g>

  <!-- Ocean Bubbles -->
  <circle class="deepseek-diving-bubble-1" data-animated="true" cx="30" cy="70" r="4" fill="#93C5FD" opacity="0.8"/>
  <circle class="deepseek-diving-bubble-2" data-animated="true" cx="90" cy="65" r="3" fill="#93C5FD" opacity="0.8"/>
</svg>
