<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="deepseek-diving-title deepseek-diving-desc" role="img" viewBox="0 0 120 120"><title id="deepseek-diving-title">DeepSeek community whale mascot diving deep into code</title><desc id="deepseek-diving-desc">A rounded ocean-blue whale character diving downward into deep reasoning with floating water bubbles.</desc><defs><linearGradient id="deepseek-diving-body-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset=".6" stop-color="#1e40af"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient><linearGradient id="deepseek-diving-belly-gradient" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#93c5fd"/></linearGradient><radialGradient id="deepseek-diving-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0f172a" stop-opacity=".3"/><stop offset="1" stop-color="#0f172a" stop-opacity="0"/></radialGradient><filter id="deepseek-diving-soft-shadow" width="140%" height="150%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#1e3a8a" flood-opacity=".25" stdDeviation="2.2"/></filter></defs><style>@keyframes deepseek-diving-shadow-scale{0%,to{transform:scaleX(1);opacity:.3}50%{transform:scaleX(.75);opacity:.18}}@keyframes deepseek-diving-whale-dive{0%,to{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(4deg)}}@keyframes deepseek-diving-bubble-float{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:.9}80%{transform:translate(0,-25px) scale(1.1);opacity:.6}to{transform:translate(0,-35px) scale(1.2);opacity:0}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="106" fill="url(#deepseek-diving-shadow-gradient)" data-animated="true" rx="35" ry="6" style="animation:deepseek-diving-shadow-scale 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:60px 106px"/><g data-animated="true" filter="url(#deepseek-diving-soft-shadow)" style="animation:deepseek-diving-whale-dive 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:60px 60px"><path fill="url(#deepseek-diving-body-gradient)" d="M20 54c0-24 30-29 62-20 18 6 24 20 18 34-8 14-42 16-66 10-10-3-14-12-14-24"/><path fill="url(#deepseek-diving-belly-gradient)" d="M34 65c10 11 42 12 58-1-6 9-26 16-52 12-10-2-13-8-6-11"/><path fill="url(#deepseek-diving-body-gradient)" d="M22 50c-8-8-12-18-8-24 6 8 11 16 12 22Z"/><path fill="url(#deepseek-diving-body-gradient)" d="M48 64c-6 10-10 18-2 20 6-2 10-10 8-18Z"/><circle cx="78" cy="50" r="5" fill="#0f172a"/><circle cx="76.5" cy="48.5" r="1.6" fill="#fff"/><path fill="#60a5fa" d="M58 28q0-8 4-8-4 0-4-8 0 8-4 8 4 0 4 8"/></g><circle cx="30" cy="70" r="4" fill="#93c5fd" data-animated="true" opacity=".8" style="animation:deepseek-diving-bubble-float 2.5s ease-in-out infinite;transform-box:view-box;transform-origin:30px 70px"/><circle cx="90" cy="65" r="3" fill="#93c5fd" data-animated="true" opacity=".8" style="animation:deepseek-diving-bubble-float 2.5s ease-in-out 1.2s infinite;transform-box:view-box;transform-origin:90px 65px"/></svg>