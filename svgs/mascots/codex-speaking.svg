<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="codex-speaking-title codex-speaking-desc">
  <title id="codex-speaking-title">Codex community mascot speaking terminal commands</title>
  <desc id="codex-speaking-desc">A rounded violet-cyan character speaking code instructions with an animated terminal bubble.</desc>
  <defs>
    <linearGradient id="codex-speaking-body-gradient" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="codex-speaking-limb-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="codex-speaking-shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1E1B4B" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
    <filter id="codex-speaking-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#312E81" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    .codex-speaking-shadow {
      animation: codex-speaking-shadow-breath 3.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 106px;
    }
    .codex-speaking-character {
      animation: codex-speaking-char-lean 3.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 96px;
    }
    .codex-speaking-bubble {
      animation: codex-speaking-bubble-pulse 3.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 85px 32px;
    }
    .codex-speaking-cursor {
      animation: codex-speaking-blink 1s step-end infinite;
    }
    @keyframes codex-speaking-shadow-breath {
      0%, 100% { transform: scaleX(1); opacity: .38; }
      50% { transform: scaleX(1.04); opacity: .42; }
    }
    @keyframes codex-speaking-char-lean {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-2deg); }
    }
    @keyframes codex-speaking-bubble-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes codex-speaking-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <ellipse class="codex-speaking-shadow" data-animated="true" cx="60" cy="106" rx="33" ry="6.5" fill="url(#codex-speaking-shadow-gradient)"/>

  <g class="codex-speaking-character" data-animated="true" filter="url(#codex-speaking-soft-shadow)">
    <!-- Legs -->
    <g aria-hidden="true">
      <path d="M40 82 C38 90 39 98 44 102 C48 105 53 102 53 97 L52 82 Z" fill="url(#codex-speaking-limb-gradient)"/>
      <ellipse cx="47" cy="100" rx="8.5" ry="4" fill="#312E81"/>
      <path d="M68 82 L67 97 C67 102 72 105 76 102 C82 98 82 89 79 82 Z" fill="url(#codex-speaking-limb-gradient)"/>
      <ellipse cx="74" cy="100" rx="8.5" ry="4" fill="#312E81"/>
    </g>

    <!-- Arms -->
    <path d="M34 56 C24 60 22 70 30 76 C36 80 42 74 38 66 Z" fill="url(#codex-speaking-limb-gradient)"/>
    <path d="M86 56 C96 50 104 54 100 64 C96 70 90 72 84 64 Z" fill="url(#codex-speaking-limb-gradient)"/>

    <!-- Main Body -->
    <rect x="28" y="30" width="64" height="60" rx="24" fill="url(#codex-speaking-body-gradient)"/>
    <path d="M34 40 C45 30 71 28 86 39 C74 35 55 37 42 45 C38 48 34 47 34 40 Z" fill="#DDD6FE" opacity=".38"/>

    <!-- Eyes with cyan glow -->
    <ellipse cx="49" cy="53" rx="5.6" ry="7" fill="#0F172A"/>
    <ellipse cx="71" cy="53" rx="5.6" ry="7" fill="#0F172A"/>
    <circle cx="47.4" cy="50.8" r="1.8" fill="#22D3EE"/>
    <circle cx="69.4" cy="50.8" r="1.8" fill="#22D3EE"/>

    <!-- Speaking Open Mouth -->
    <path d="M52 66 C56 73 64 73 68 66 Z" fill="#0F172A"/>
  </g>

  <!-- Terminal Speech Bubble -->
  <g class="codex-speaking-bubble" data-animated="true" filter="url(#codex-speaking-soft-shadow)">
    <rect x="62" y="14" width="46" height="34" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="72,48 76,54 82,48" fill="#0F172A"/>
    <!-- Terminal prompt symbol inside bubble -->
    <path d="M68 25 L73 28 L68 31" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line class="codex-speaking-cursor" data-animated="true" x1="77" y1="31" x2="84" y2="31" stroke="#22D3EE" stroke-width="2"/>
    <!-- Fake code lines -->
    <line x1="68" y1="37" x2="98" y2="37" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
