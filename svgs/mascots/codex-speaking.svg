<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="codex-speaking-title codex-speaking-desc" role="img" viewBox="0 0 120 120"><title id="codex-speaking-title">Codex community mascot speaking terminal commands</title><desc id="codex-speaking-desc">A rounded violet-cyan character speaking code instructions with an animated terminal bubble.</desc><defs><linearGradient id="codex-speaking-body-gradient" x1=".1" x2=".9" y1="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><linearGradient id="codex-speaking-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0284c7"/></linearGradient><radialGradient id="codex-speaking-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1e1b4b" stop-opacity=".38"/><stop offset="1" stop-color="#1e1b4b" stop-opacity="0"/></radialGradient><filter id="codex-speaking-soft-shadow" width="140%" height="150%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#312e81" flood-opacity=".25" stdDeviation="2.2"/></filter></defs><style>@keyframes codex-speaking-shadow-breath{0%,to{transform:scaleX(1);opacity:.38}50%{transform:scaleX(1.04);opacity:.42}}@keyframes codex-speaking-char-lean{0%,to{transform:rotate(0deg)}50%{transform:rotate(-2deg)}}@keyframes codex-speaking-bubble-pulse{0%,to{transform:scale(1)}50%{transform:scale(1.05)}}@keyframes codex-speaking-blink{0%,to{opacity:1}50%{opacity:0}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="106" fill="url(#codex-speaking-shadow-gradient)" data-animated="true" rx="33" ry="6.5" style="animation:codex-speaking-shadow-breath 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:60px 106px"/><g data-animated="true" filter="url(#codex-speaking-soft-shadow)" style="animation:codex-speaking-char-lean 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:60px 96px"><g aria-hidden="true"><path fill="url(#codex-speaking-limb-gradient)" d="M40 82c-2 8-1 16 4 20 4 3 9 0 9-5l-1-15Z"/><ellipse cx="47" cy="100" fill="#312e81" rx="8.5" ry="4"/><path fill="url(#codex-speaking-limb-gradient)" d="m68 82-1 15c0 5 5 8 9 5 6-4 6-13 3-20Z"/><ellipse cx="74" cy="100" fill="#312e81" rx="8.5" ry="4"/></g><path fill="url(#codex-speaking-limb-gradient)" d="M34 56c-10 4-12 14-4 20 6 4 12-2 8-10Z"/><path fill="url(#codex-speaking-limb-gradient)" d="M86 56c10-6 18-2 14 8-4 6-10 8-16 0Z"/><rect width="64" height="60" x="28" y="30" fill="url(#codex-speaking-body-gradient)" rx="24"/><path fill="#ddd6fe" d="M34 40c11-10 37-12 52-1-12-4-31-2-44 6-4 3-8 2-8-5" opacity=".38"/><ellipse cx="49" cy="53" fill="#0f172a" rx="5.6" ry="7"/><ellipse cx="71" cy="53" fill="#0f172a" rx="5.6" ry="7"/><circle cx="47.4" cy="50.8" r="1.8" fill="#22d3ee"/><circle cx="69.4" cy="50.8" r="1.8" fill="#22d3ee"/><path fill="#0f172a" d="M52 66c4 7 12 7 16 0Z"/></g><g data-animated="true" filter="url(#codex-speaking-soft-shadow)" style="animation:codex-speaking-bubble-pulse 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:85px 32px"><rect width="46" height="34" x="62" y="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="6"/><path fill="#0f172a" d="m72 48 4 6 6-6z"/><path fill="none" stroke="#22d3ee" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m68 25 5 3-5 3"/><path stroke="#22d3ee" stroke-width="2" d="M77 31h7" data-animated="true" style="animation:codex-speaking-blink 1s step-end infinite"/><path stroke="#94a3b8" stroke-linecap="round" stroke-width="1.5" d="M68 37h30"/></g></svg>