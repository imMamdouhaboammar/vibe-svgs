<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="claude-sleeping-title claude-sleeping-desc" role="img" viewBox="0 0 120 120"><title id="claude-sleeping-title">Claude community mascot sleeping peacefully</title><desc id="claude-sleeping-desc">A rounded terracotta character resting with closed eyes while animated Zzz symbols float upward.</desc><defs><linearGradient id="claude-sleeping-body-gradient" x1=".1" x2=".85" y1="0" y2="1"><stop offset="0" stop-color="#f7b58e"/><stop offset=".5" stop-color="#e98452"/><stop offset="1" stop-color="#b7512a"/></linearGradient><linearGradient id="claude-sleeping-limb-gradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ea8f5e"/><stop offset="1" stop-color="#aa4524"/></linearGradient><radialGradient id="claude-sleeping-shadow-gradient" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3c2118" stop-opacity=".36"/><stop offset="1" stop-color="#3c2118" stop-opacity="0"/></radialGradient><filter id="claude-sleeping-soft-shadow" width="140%" height="150%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#552718" flood-opacity=".2" stdDeviation="2"/></filter></defs><style>@keyframes claude-sleeping-shadow-breath{0%,to{transform:scaleX(1);opacity:.36}50%{transform:scaleX(1.05);opacity:.42}}@keyframes claude-sleeping-body-breath{0%,to{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}@keyframes claude-sleeping-zzz-float{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:.9}80%{transform:translate(8px,-7px) scale(1.06);opacity:.6}to{transform:translate(11px,-10px) scale(1.1);opacity:0}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><ellipse cx="60" cy="106" fill="url(#claude-sleeping-shadow-gradient)" data-animated="true" rx="34" ry="7" style="animation:claude-sleeping-shadow-breath 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:60px 106px"/><g data-animated="true" filter="url(#claude-sleeping-soft-shadow)" style="animation:claude-sleeping-body-breath 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:60px 96px"><g aria-hidden="true"><path fill="url(#claude-sleeping-limb-gradient)" d="M40 82c-2 8-1 16 4 20 4 3 9 0 9-5l-1-15Z"/><ellipse cx="47" cy="100" fill="#8d3921" rx="8.5" ry="4"/><path fill="url(#claude-sleeping-limb-gradient)" d="m68 82-1 15c0 5 5 8 9 5 6-4 6-13 3-20Z"/><ellipse cx="74" cy="100" fill="#8d3921" rx="8.5" ry="4"/></g><path fill="url(#claude-sleeping-limb-gradient)" d="M32 58c-6 10 0 20 12 18 4-1 4-8-2-10Z"/><path fill="url(#claude-sleeping-limb-gradient)" d="M88 58c6 10 0 20-12 18-4-1-4-8 2-10Z"/><rect width="62" height="59" x="29" y="32" fill="url(#claude-sleeping-body-gradient)" rx="23"/><path fill="#ffd2b7" d="M35 42c11-10 35-12 49-1-12-4-30-2-42 6-4 3-7 2-7-5" opacity=".34"/><path fill="#8f3a20" d="M31 72c13 13 43 20 58-2v10c-6 10-16 13-29 13-15 0-24-5-29-13Z" opacity=".18"/><path fill="none" stroke="#21150f" stroke-linecap="round" stroke-width="3" d="M44 58c3 4 8 4 11 0m10 0c3 4 8 4 11 0"/><path fill="none" stroke="#71311d" stroke-linecap="round" stroke-width="2.5" d="M54 68c3 3 9 3 12 0"/><ellipse cx="40" cy="62" fill="#e25f38" opacity=".4" rx="4" ry="2.5"/><ellipse cx="80" cy="62" fill="#e25f38" opacity=".4" rx="4" ry="2.5"/></g><text x="75" y="45" fill="#e98452" data-animated="true" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" opacity=".9" style="animation:claude-sleeping-zzz-float 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:75px 45px">Z</text><text x="85" y="35" fill="#e98452" data-animated="true" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" opacity=".9" style="animation:claude-sleeping-zzz-float 3.2s ease-in-out 1.05s infinite;transform-box:view-box;transform-origin:85px 35px">z</text><text x="93" y="25" fill="#e98452" data-animated="true" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" opacity=".9" style="animation:claude-sleeping-zzz-float 3.2s ease-in-out 2.1s infinite;transform-box:view-box;transform-origin:95px 25px">z</text></svg>