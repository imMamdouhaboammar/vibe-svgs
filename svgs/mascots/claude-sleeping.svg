<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="280" height="168">
  <defs>
    <!-- 3D body gradient -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F4A67A"/>
      <stop offset="30%" stop-color="#E8854F"/>
      <stop offset="65%" stop-color="#E07C4C"/>
      <stop offset="100%" stop-color="#B85A28"/>
    </linearGradient>
    <linearGradient id="earGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0966A"/>
      <stop offset="100%" stop-color="#C0612E"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E07C4C"/>
      <stop offset="50%" stop-color="#C86030"/>
      <stop offset="100%" stop-color="#A04D1E"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.8" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <style>
    .zzz-float {
      animation: zzz-anim 2.5s infinite linear;
    }
    @keyframes zzz-anim {
      0% { transform: translateY(0px) scale(0.8); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-20px) scale(1.2); opacity: 0; }
    }
    .snooze-breathe {
      animation: breathe 3s infinite ease-in-out alternate;
      transform-origin: 50px 45px;
    }
    @keyframes breathe {
      0% { transform: scaleY(1); }
      100% { transform: scaleY(0.96); }
    }
  </style>

  <!-- Ground Shadow -->
  <ellipse cx="60" cy="85" rx="35" ry="6" fill="url(#shadowGrad)"/>

  <!-- Pile of 200k tokens under head -->
  <g transform="translate(100, 65)">
    <rect x="0" y="0" width="75" height="22" rx="4" fill="#292524" stroke="#ea580c" stroke-width="1" />
    <text x="37" y="15" text-anchor="middle" font-family="monospace" font-size="10" fill="#fdba74">200K Tokens</text>
  </g>

  <!-- Claude Sleeping Body -->
  <g class="snooze-breathe" filter="url(#dropShadow)">
    <!-- Left ear -->
    <rect x="22" y="20" width="8" height="14" fill="url(#earGrad)"/>
    <rect x="70" y="20" width="8" height="14" fill="url(#earGrad)"/>

    <!-- Main body resting horizontally -->
    <rect x="14" y="32" width="72" height="32" fill="url(#bodyGrad)"/>

    <!-- Closed Sleeping Eyes (>_< or -_-) -->
    <path d="M 36 48 L 44 48 M 68 48 L 76 48" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cute Snoring Mouth -->
    <circle cx="56" cy="54" r="3" fill="#1C1917" />

    <!-- Legs Resting -->
    <rect x="24" y="64" width="12" height="12" fill="url(#legGrad)"/>
    <rect x="64" y="64" width="12" height="12" fill="url(#legGrad)"/>

    <!-- Floating Zzz -->
    <g class="zzz-float" transform="translate(85, 20)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#fb923c">Zzz...</text>
    </g>
  </g>
</svg>
