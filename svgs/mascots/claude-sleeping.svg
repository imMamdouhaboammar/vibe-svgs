<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="claude-sleeping-title claude-sleeping-desc">
  <title id="claude-sleeping-title">Claude community mascot sleeping peacefully</title>
  <desc id="claude-sleeping-desc">A rounded terracotta character resting with closed eyes while animated Zzz symbols float upward.</desc>
  <defs>
    <linearGradient id="claude-sleeping-body-gradient" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F7B58E"/>
      <stop offset="0.5" stop-color="#E98452"/>
      <stop offset="1" stop-color="#B7512A"/>
    </linearGradient>
    <linearGradient id="claude-sleeping-limb-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EA8F5E"/>
      <stop offset="1" stop-color="#AA4524"/>
    </linearGradient>
    <radialGradient id="claude-sleeping-shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3C2118" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#3C2118" stop-opacity="0"/>
    </radialGradient>
    <filter id="claude-sleeping-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#552718" flood-opacity="0.2"/>
    </filter>
  </defs>
  <style>
    .claude-sleeping-shadow {
      animation: claude-sleeping-shadow-breath 3.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 106px;
    }
    .claude-sleeping-body {
      animation: claude-sleeping-body-breath 3.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 60px 96px;
    }
    .claude-sleeping-zzz-1 {
      animation: claude-sleeping-zzz-float 3.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 75px 45px;
    }
    .claude-sleeping-zzz-2 {
      animation: claude-sleeping-zzz-float 3.2s ease-in-out 1.05s infinite;
      transform-box: view-box;
      transform-origin: 85px 35px;
    }
    .claude-sleeping-zzz-3 {
      animation: claude-sleeping-zzz-float 3.2s ease-in-out 2.1s infinite;
      transform-box: view-box;
      transform-origin: 95px 25px;
    }
    @keyframes claude-sleeping-shadow-breath {
      0%, 100% { transform: scaleX(1); opacity: .36; }
      50% { transform: scaleX(1.05); opacity: .42; }
    }
    @keyframes claude-sleeping-body-breath {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.03, 0.97); }
    }
    @keyframes claude-sleeping-zzz-float {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      30% { opacity: 0.9; }
      80% { transform: translate(12px, -20px) scale(1.1); opacity: 0.6; }
      100% { transform: translate(18px, -28px) scale(1.2); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <ellipse class="claude-sleeping-shadow" data-animated="true" cx="60" cy="106" rx="34" ry="7" fill="url(#claude-sleeping-shadow-gradient)"/>

  <g class="claude-sleeping-body" data-animated="true" filter="url(#claude-sleeping-soft-shadow)">
    <!-- Legs resting -->
    <g aria-hidden="true">
      <path d="M40 82 C38 90 39 98 44 102 C48 105 53 102 53 97 L52 82 Z" fill="url(#claude-sleeping-limb-gradient)"/>
      <ellipse cx="47" cy="100" rx="8.5" ry="4" fill="#8D3921"/>
      <path d="M68 82 L67 97 C67 102 72 105 76 102 C82 98 82 89 79 82 Z" fill="url(#claude-sleeping-limb-gradient)"/>
      <ellipse cx="74" cy="100" rx="8.5" ry="4" fill="#8D3921"/>
    </g>

    <!-- Arms resting over belly -->
    <path d="M32 58 C26 68 32 78 44 76 C48 75 48 68 42 66 Z" fill="url(#claude-sleeping-limb-gradient)"/>
    <path d="M88 58 C94 68 88 78 76 76 C72 75 72 68 78 66 Z" fill="url(#claude-sleeping-limb-gradient)"/>

    <!-- Main Body -->
    <rect x="29" y="32" width="62" height="59" rx="23" fill="url(#claude-sleeping-body-gradient)"/>
    <!-- Specular Highlight -->
    <path d="M35 42 C46 32 70 30 84 41 C72 37 54 39 42 47 C38 50 35 49 35 42 Z" fill="#FFD2B7" opacity=".34"/>
    <path d="M31 72 C44 85 74 92 89 70 L89 80 C83 90 73 93 60 93 C45 93 36 88 31 80 Z" fill="#8F3A20" opacity=".18"/>

    <!-- Sleeping Eyes (Happy Arcs) -->
    <path d="M44 58 C47 62 52 62 55 58" fill="none" stroke="#21150F" stroke-width="3" stroke-linecap="round"/>
    <path d="M65 58 C68 62 73 62 76 58" fill="none" stroke="#21150F" stroke-width="3" stroke-linecap="round"/>

    <!-- Slight Smile -->
    <path d="M54 68 C57 71 63 71 66 68" fill="none" stroke="#71311D" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Soft Cheek Blush -->
    <ellipse cx="40" cy="62" rx="4" ry="2.5" fill="#E25F38" opacity=".4"/>
    <ellipse cx="80" cy="62" rx="4" ry="2.5" fill="#E25F38" opacity=".4"/>
  </g>

  <!-- Floating Zzz symbols -->
  <text class="claude-sleeping-zzz-1" data-animated="true" x="75" y="45" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#E98452" opacity="0.9">Z</text>
  <text class="claude-sleeping-zzz-2" data-animated="true" x="85" y="35" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#E98452" opacity="0.9">z</text>
  <text class="claude-sleeping-zzz-3" data-animated="true" x="93" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#E98452" opacity="0.9">z</text>
</svg>
