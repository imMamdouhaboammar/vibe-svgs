<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="c-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1512" />
      <stop offset="50%" stop-color="#2a1a14" />
      <stop offset="100%" stop-color="#120c09" />
    </linearGradient>

    <!-- 3D body gradient -->
    <linearGradient id="cBodyGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F4A67A"/>
      <stop offset="30%" stop-color="#E8854F"/>
      <stop offset="65%" stop-color="#E07C4C"/>
      <stop offset="100%" stop-color="#B85A28"/>
    </linearGradient>

    <!-- Ear gradient -->
    <linearGradient id="cEarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0966A"/>
      <stop offset="100%" stop-color="#C0612E"/>
    </linearGradient>

    <!-- Arm gradients -->
    <linearGradient id="cArmL" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#C0612E"/>
      <stop offset="50%" stop-color="#E07C4C"/>
      <stop offset="100%" stop-color="#D06838"/>
    </linearGradient>
    <linearGradient id="cArmR" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#E8854F"/>
      <stop offset="60%" stop-color="#E07C4C"/>
      <stop offset="100%" stop-color="#B85A28"/>
    </linearGradient>

    <!-- Leg gradient -->
    <linearGradient id="cLegGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E07C4C"/>
      <stop offset="50%" stop-color="#C86030"/>
      <stop offset="100%" stop-color="#A04D1E"/>
    </linearGradient>

    <!-- Eye radial -->
    <radialGradient id="cEyeGrad" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Ground shadow radial -->
    <radialGradient id="cShadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="cOrangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .card-bg { fill: url(#c-bg); rx: 20px; stroke: #ea580c; stroke-width: 2px; }
    .claude-float { animation: float-c 3.5s infinite ease-in-out alternate; }
    @keyframes float-c { 0% { transform: translateY(0px); } 100% { transform: translateY(-8px); } }
    .eye-blink { animation: blink-c 4s infinite; transform-origin: center; }
    @keyframes blink-c { 0%, 94%, 98%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    .token-float { animation: token-anim 3s infinite ease-in-out; }
    @keyframes token-anim { 0% { transform: translateY(0); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; fill: #ffffff; font-size: 22px; }
    .sub-text { font-family: monospace; fill: #fdba74; font-size: 13px; font-weight: 600; }
  </style>

  <rect width="500" height="280" class="card-bg" />

  <!-- Platform Badge Top Left -->
  <g transform="translate(30, 25)">
    <rect width="130" height="28" rx="14" fill="#431407" stroke="#ea580c" stroke-width="1.5" />
    <text x="65" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ffedd5">CLAUDE CODE</text>
  </g>

  <!-- Title & Info -->
  <g transform="translate(30, 85)">
    <text x="0" y="0" class="title-text">Anthropic Claude 3.7 Sonnet</text>
    <text x="0" y="24" class="sub-text">⚡ 200,000 Token Reasoning Engine</text>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="370" cy="225" rx="55" ry="9" fill="url(#cShadowGrad)" />

  <!-- 3D Mascot Character (Right Side) -->
  <g class="claude-float" transform="translate(270, 70)" filter="url(#cOrangeGlow)">
    <!-- Ears -->
    <rect x="68" y="28" width="12" height="20" fill="url(#cEarGrad)"/>
    <rect x="120" y="28" width="12" height="20" fill="url(#cEarGrad)"/>

    <!-- Main body -->
    <rect x="58" y="44" width="84" height="90" rx="36" fill="url(#cBodyGrad)" />

    <!-- Eyes -->
    <g class="eye-blink">
      <circle cx="86" cy="78" r="10" fill="url(#cEyeGrad)" />
      <circle cx="83" cy="75" r="3.5" fill="#FFFFFF" />

      <circle cx="114" cy="78" r="10" fill="url(#cEyeGrad)" />
      <circle cx="111" cy="75" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- Mouth -->
    <path d="M 94 94 Q 100 102 106 94" fill="none" stroke="#2A180E" stroke-width="3" stroke-linecap="round" />

    <!-- Arms -->
    <rect x="36" y="74" width="24" height="14" rx="7" fill="url(#cArmL)" />
    <rect x="140" y="74" width="24" height="14" rx="7" fill="url(#cArmR)" />

    <!-- Legs -->
    <rect x="76" y="130" width="16" height="22" rx="8" fill="url(#cLegGrad)" />
    <rect x="108" y="130" width="16" height="22" rx="8" fill="url(#cLegGrad)" />
  </g>

  <!-- Floating Tokens -->
  <g class="token-float" transform="translate(410, 80)">
    <rect width="70" height="22" rx="11" fill="#292524" stroke="#fb923c" stroke-width="1" />
    <text x="35" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#fed7aa">&lt;reasoning&gt;</text>
  </g>
</svg>
