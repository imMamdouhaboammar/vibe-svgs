<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" role="img" aria-labelledby="claude-suite-hd-title claude-suite-hd-desc">
  <title id="claude-suite-hd-title">Claude Community Suite Banner</title>
  <desc id="claude-suite-hd-desc">A showcase banner displaying rounded 2.5D terracotta Claude mascot artwork and scenes.</desc>
  <defs>
    <linearGradient id="claude-suite-hd-bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F130E"/>
      <stop offset="0.5" stop-color="#2C1A14"/>
      <stop offset="1" stop-color="#140C08"/>
    </linearGradient>
    <linearGradient id="claude-suite-hd-body-gradient" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F7B58E"/>
      <stop offset="0.5" stop-color="#E98452"/>
      <stop offset="1" stop-color="#B7512A"/>
    </linearGradient>
    <radialGradient id="claude-suite-hd-shadow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="claude-suite-hd-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .claude-suite-hd-main-char {
      animation: claude-suite-hd-float 3.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 250px 110px;
    }
    @keyframes claude-suite-hd-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <!-- Background -->
  <rect width="500" height="220" rx="16" fill="url(#claude-suite-hd-bg-gradient)"/>
  <rect width="496" height="216" x="2" y="2" rx="14" fill="none" stroke="#EA8F5E" stroke-width="1.5" opacity="0.25"/>

  <!-- Title Text Path / Decorative Title -->
  <text x="30" y="45" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#FFD2B7" opacity="0.95">CLAUDE MASCOT SUITE</text>
  <text x="30" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#E98452" opacity="0.8">Community 2.5D Vector Artwork</text>

  <!-- Main Mascot Showcase Center -->
  <g class="claude-suite-hd-main-char" data-animated="true" filter="url(#claude-suite-hd-soft-shadow)">
    <ellipse cx="250" cy="180" rx="42" ry="9" fill="url(#claude-suite-hd-shadow-gradient)"/>
    <rect x="215" y="85" width="70" height="68" rx="26" fill="url(#claude-suite-hd-body-gradient)"/>
    <path d="M222 96 C235 85 262 83 278 95 C264 91 244 93 230 101 C226 104 222 103 222 96 Z" fill="#FFD2B7" opacity=".35"/>

    <!-- Eyes -->
    <ellipse cx="237" cy="112" rx="6" ry="7.5" fill="#21150F"/>
    <ellipse cx="263" cy="112" rx="6" ry="7.5" fill="#21150F"/>
    <circle cx="235.3" cy="109.6" r="1.8" fill="#FFF" opacity=".9"/>
    <circle cx="261.3" cy="109.6" r="1.8" fill="#FFF" opacity=".9"/>

    <!-- Smile -->
    <path d="M242 128 C247 133 253 133 258 128" fill="none" stroke="#71311D" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Left Side Miniature Scene Component (Sleeping) -->
  <g transform="translate(100, 115) scale(0.65)" opacity="0.85" filter="url(#claude-suite-hd-soft-shadow)">
    <rect x="-35" y="-30" width="70" height="60" rx="22" fill="url(#claude-suite-hd-body-gradient)"/>
    <path d="M-18 -4 C-14 0 -8 0 -4 -4" fill="none" stroke="#21150F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M4 -4 C8 0 14 0 18 -4" fill="none" stroke="#21150F" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Right Side Miniature Scene Component (Debugging) -->
  <g transform="translate(400, 115) scale(0.65)" opacity="0.85" filter="url(#claude-suite-hd-soft-shadow)">
    <rect x="-35" y="-30" width="70" height="60" rx="22" fill="url(#claude-suite-hd-body-gradient)"/>
    <circle cx="15" cy="15" r="14" fill="#EBF8FF" fill-opacity="0.3" stroke="#D97706" stroke-width="3.5"/>
  </g>
</svg>
