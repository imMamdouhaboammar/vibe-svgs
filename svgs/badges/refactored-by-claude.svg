<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="refactored-by-claude-title refactored-by-claude-desc" role="img" viewBox="0 0 200 40"><title id="refactored-by-claude-title">Refactored by Claude Badge</title><desc id="refactored-by-claude-desc">Community badge for code refactored using Claude AI models.</desc><defs><linearGradient id="refactored-by-claude-bg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#ea8f5e"/><stop offset="1" stop-color="#c0612e"/></linearGradient></defs><style>@keyframes refactored-by-claude-pulse{0%,to{opacity:.95}50%{opacity:1}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><g data-animated="true" style="animation:refactored-by-claude-pulse 3s ease-in-out infinite;transform-box:view-box;transform-origin:100px 20px"><rect width="90" height="40" fill="#1e293b" rx="6"/><text x="45" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">REFACTORED</text><rect width="110" height="40" x="90" fill="url(#refactored-by-claude-bg)" rx="6"/><text x="145" y="25" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BY CLAUDE</text></g></svg>