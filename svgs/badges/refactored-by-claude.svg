<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" role="img" aria-labelledby="refactored-by-claude-title refactored-by-claude-desc">
  <title id="refactored-by-claude-title">Refactored by Claude Badge</title>
  <desc id="refactored-by-claude-desc">Community badge for code refactored using Claude AI models.</desc>
  <defs>
    <linearGradient id="refactored-by-claude-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EA8F5E"/>
      <stop offset="1" stop-color="#C0612E"/>
    </linearGradient>
  </defs>
  <style>
    .refactored-by-claude-pulse {
      animation: refactored-by-claude-pulse 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 100px 20px;
    }
    @keyframes refactored-by-claude-pulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <g class="refactored-by-claude-pulse" data-animated="true">
    <rect width="90" height="40" rx="6" fill="#1E293B"/>
    <text x="45" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#94A3B8" text-anchor="middle">REFACTORED</text>

    <rect x="90" width="110" height="40" rx="6" fill="url(#refactored-by-claude-bg)"/>
    <text x="145" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">BY CLAUDE</text>
  </g>
</svg>
