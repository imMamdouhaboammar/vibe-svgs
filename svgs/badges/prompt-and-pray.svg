<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="prompt-and-pray-title prompt-and-pray-desc" role="img" viewBox="0 0 200 40"><title id="prompt-and-pray-title">Prompt and Pray Badge</title><desc id="prompt-and-pray-desc">Humorous community badge for prompting workflows.</desc><defs><linearGradient id="prompt-and-pray-bg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0284c7"/><stop offset="1" stop-color="#0369a1"/></linearGradient></defs><style>@keyframes prompt-and-pray-pulse{0%,to{opacity:.95}50%{opacity:1}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><g data-animated="true" style="animation:prompt-and-pray-pulse 3s ease-in-out infinite;transform-box:view-box;transform-origin:100px 20px"><rect width="90" height="40" fill="#1e293b" rx="6"/><text x="45" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">METHOD</text><rect width="110" height="40" x="90" fill="url(#prompt-and-pray-bg)" rx="6"/><text x="145" y="25" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PROMPT &amp; PRAY</text></g></svg>