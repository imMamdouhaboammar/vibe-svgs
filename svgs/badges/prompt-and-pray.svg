<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" role="img" aria-labelledby="prompt-and-pray-title prompt-and-pray-desc">
  <title id="prompt-and-pray-title">Prompt and Pray Badge</title>
  <desc id="prompt-and-pray-desc">Humorous community badge for prompting workflows.</desc>
  <defs>
    <linearGradient id="prompt-and-pray-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <style>
    .prompt-and-pray-pulse {
      animation: prompt-and-pray-pulse 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 100px 20px;
    }
    @keyframes prompt-and-pray-pulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <g class="prompt-and-pray-pulse" data-animated="true">
    <rect width="90" height="40" rx="6" fill="#1E293B"/>
    <text x="45" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#94A3B8" text-anchor="middle">METHOD</text>

    <rect x="90" width="110" height="40" rx="6" fill="url(#prompt-and-pray-bg)"/>
    <text x="145" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">PROMPT &amp; PRAY</text>
  </g>
</svg>
