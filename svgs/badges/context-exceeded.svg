<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="context-exceeded-title context-exceeded-desc" role="img" viewBox="0 0 200 40"><title id="context-exceeded-title">Context Exceeded Badge</title><desc id="context-exceeded-desc">Humorous warning badge for context window overflow.</desc><defs><linearGradient id="context-exceeded-bg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#dc2626"/><stop offset="1" stop-color="#991b1b"/></linearGradient></defs><style>@keyframes context-exceeded-pulse{0%,to{opacity:.9}50%{opacity:1}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><g data-animated="true" style="animation:context-exceeded-pulse 2s ease-in-out infinite;transform-box:view-box;transform-origin:100px 20px"><rect width="90" height="40" fill="#1e293b" rx="6"/><text x="45" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CONTEXT</text><rect width="110" height="40" x="90" fill="url(#context-exceeded-bg)" rx="6"/><text x="145" y="25" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">EXCEEDED (200k)</text></g></svg>