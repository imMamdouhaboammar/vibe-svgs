<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" role="img" aria-labelledby="context-exceeded-title context-exceeded-desc">
  <title id="context-exceeded-title">Context Exceeded Badge</title>
  <desc id="context-exceeded-desc">Humorous warning badge for context window overflow.</desc>
  <defs>
    <linearGradient id="context-exceeded-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#991B1B"/>
    </linearGradient>
  </defs>
  <style>
    .context-exceeded-pulse {
      animation: context-exceeded-pulse 2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 100px 20px;
    }
    @keyframes context-exceeded-pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <g class="context-exceeded-pulse" data-animated="true">
    <rect width="90" height="40" rx="6" fill="#1E293B"/>
    <text x="45" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#94A3B8" text-anchor="middle">CONTEXT</text>

    <rect x="90" width="110" height="40" rx="6" fill="url(#context-exceeded-bg)"/>
    <text x="145" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">EXCEEDED (200k)</text>
  </g>
</svg>
