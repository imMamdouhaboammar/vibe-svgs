<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" role="img" aria-labelledby="vibe-certified-title vibe-certified-desc">
  <title id="vibe-certified-title">Vibe Certified Badge</title>
  <desc id="vibe-certified-desc">Gold community certification badge for vibe coding repository projects.</desc>
  <defs>
    <linearGradient id="vibe-certified-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97706"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <style>
    .vibe-certified-pulse {
      animation: vibe-certified-pulse 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 100px 20px;
    }
    @keyframes vibe-certified-pulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <g class="vibe-certified-pulse" data-animated="true">
    <rect width="90" height="40" rx="6" fill="#1E293B"/>
    <text x="45" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#94A3B8" text-anchor="middle">VIBE CODING</text>

    <rect x="90" width="110" height="40" rx="6" fill="url(#vibe-certified-bg)"/>
    <text x="145" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">★ CERTIFIED</text>
  </g>
</svg>
