<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" role="img" aria-labelledby="zero-human-code-title zero-human-code-desc">
  <title id="zero-human-code-title">Zero Human Code Badge</title>
  <desc id="zero-human-code-desc">Humorous community badge declaring code generated by AI agents.</desc>
  <defs>
    <linearGradient id="zero-human-code-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15803D"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
  </defs>
  <style>
    .zero-human-code-pulse {
      animation: zero-human-code-pulse 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 100px 20px;
    }
    @keyframes zero-human-code-pulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <g class="zero-human-code-pulse" data-animated="true">
    <rect width="90" height="40" rx="6" fill="#1E293B"/>
    <text x="45" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#94A3B8" text-anchor="middle">HUMAN CODE</text>

    <rect x="90" width="110" height="40" rx="6" fill="url(#zero-human-code-bg)"/>
    <text x="145" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">0% (100% AI)</text>
  </g>
</svg>
