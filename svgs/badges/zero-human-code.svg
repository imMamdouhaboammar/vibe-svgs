<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="zero-human-code-title zero-human-code-desc" role="img" viewBox="0 0 200 40"><title id="zero-human-code-title">Zero Human Code Badge</title><desc id="zero-human-code-desc">Humorous community badge declaring code generated by AI agents.</desc><defs><linearGradient id="zero-human-code-bg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#15803d"/><stop offset="1" stop-color="#166534"/></linearGradient></defs><style>@keyframes zero-human-code-pulse{0%,to{opacity:.95}50%{opacity:1}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><g data-animated="true" style="animation:zero-human-code-pulse 3s ease-in-out infinite;transform-box:view-box;transform-origin:100px 20px"><rect width="90" height="40" fill="#1e293b" rx="6"/><text x="45" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HUMAN CODE</text><rect width="110" height="40" x="90" fill="url(#zero-human-code-bg)" rx="6"/><text x="145" y="25" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">0% (100% AI)</text></g></svg>