<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="yolo-deploy-title yolo-deploy-desc" role="img" viewBox="0 0 200 40"><title id="yolo-deploy-title">YOLO Deploy Badge</title><desc id="yolo-deploy-desc">Humorous community badge for direct main branch deployments.</desc><defs><linearGradient id="yolo-deploy-bg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#be185d"/></linearGradient></defs><style>@keyframes yolo-deploy-pulse{0%,to{opacity:.95}50%{opacity:1}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><g data-animated="true" style="animation:yolo-deploy-pulse 2s ease-in-out infinite;transform-box:view-box;transform-origin:100px 20px"><rect width="90" height="40" fill="#1e293b" rx="6"/><text x="45" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DEPLOY</text><rect width="110" height="40" x="90" fill="url(#yolo-deploy-bg)" rx="6"/><text x="145" y="25" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⚡ YOLO MAIN</text></g></svg>