<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" role="img" aria-labelledby="yolo-deploy-title yolo-deploy-desc">
  <title id="yolo-deploy-title">YOLO Deploy Badge</title>
  <desc id="yolo-deploy-desc">Humorous community badge for direct main branch deployments.</desc>
  <defs>
    <linearGradient id="yolo-deploy-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#BE185D"/>
    </linearGradient>
  </defs>
  <style>
    .yolo-deploy-pulse {
      animation: yolo-deploy-pulse 2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 100px 20px;
    }
    @keyframes yolo-deploy-pulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <g class="yolo-deploy-pulse" data-animated="true">
    <rect width="90" height="40" rx="6" fill="#1E293B"/>
    <text x="45" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#94A3B8" text-anchor="middle">DEPLOY</text>

    <rect x="90" width="110" height="40" rx="6" fill="url(#yolo-deploy-bg)"/>
    <text x="145" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">⚡ YOLO MAIN</text>
  </g>
</svg>
