<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" role="img" aria-labelledby="ai-reviewer-approved-title ai-reviewer-approved-desc">
  <title id="ai-reviewer-approved-title">AI Reviewer Approved Badge</title>
  <desc id="ai-reviewer-approved-desc">Community badge for pull requests reviewed by AI code reviewers.</desc>
  <defs>
    <linearGradient id="ai-reviewer-approved-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <style>
    .ai-reviewer-approved-pulse {
      animation: ai-reviewer-approved-pulse 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 100px 20px;
    }
    @keyframes ai-reviewer-approved-pulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <g class="ai-reviewer-approved-pulse" data-animated="true">
    <rect width="90" height="40" rx="6" fill="#1E293B"/>
    <text x="45" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#94A3B8" text-anchor="middle">AI REVIEWER</text>

    <rect x="90" width="110" height="40" rx="6" fill="url(#ai-reviewer-approved-bg)"/>
    <text x="145" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">✓ APPROVED</text>
  </g>
</svg>
