<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="ai-reviewer-approved-title ai-reviewer-approved-desc" role="img" viewBox="0 0 200 40"><title id="ai-reviewer-approved-title">AI Reviewer Approved Badge</title><desc id="ai-reviewer-approved-desc">Community badge for pull requests reviewed by AI code reviewers.</desc><defs><linearGradient id="ai-reviewer-approved-bg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#6d28d9"/></linearGradient></defs><style>@keyframes ai-reviewer-approved-pulse{0%,to{opacity:.95}50%{opacity:1}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><g data-animated="true" style="animation:ai-reviewer-approved-pulse 3s ease-in-out infinite;transform-box:view-box;transform-origin:100px 20px"><rect width="90" height="40" fill="#1e293b" rx="6"/><text x="45" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AI REVIEWER</text><rect width="110" height="40" x="90" fill="url(#ai-reviewer-approved-bg)" rx="6"/><text x="145" y="25" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓ APPROVED</text></g></svg>