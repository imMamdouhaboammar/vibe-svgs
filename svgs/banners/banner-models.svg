<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" role="img" aria-labelledby="banner-models-title banner-models-desc">
  <title id="banner-models-title">AI Models Community Banner</title>
  <desc id="banner-models-desc">A banner featuring model names in community vector artwork presentation.</desc>
  <defs>
    <linearGradient id="banner-models-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#311B92"/>
    </linearGradient>
  </defs>
  <style>
    .banner-models-pulse {
      animation: banner-models-pulse 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 250px 50px;
    }
    @keyframes banner-models-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <rect width="500" height="100" rx="12" fill="url(#banner-models-bg)"/>
  <g class="banner-models-pulse" data-animated="true">
    <text x="250" y="45" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#F472B6" text-anchor="middle">LLM &amp; REASONING MODELS</text>
    <text x="250" y="68" font-family="system-ui, sans-serif" font-size="12" fill="#A7F3D0" text-anchor="middle">Claude 3.7 • Gemini 2.5 • DeepSeek R1 • GPT-4o</text>
  </g>
</svg>
