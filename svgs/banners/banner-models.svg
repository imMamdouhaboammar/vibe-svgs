<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="banner-models-title banner-models-desc" role="img" viewBox="0 0 500 100"><title id="banner-models-title">AI Models Community Banner</title><desc id="banner-models-desc">A banner featuring model names in community vector artwork presentation.</desc><defs><linearGradient id="banner-models-bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#311b92"/></linearGradient></defs><style>@keyframes banner-models-pulse{0%,to{transform:scale(1)}50%{transform:scale(1.02)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><rect width="500" height="100" fill="url(#banner-models-bg)" rx="12"/><g data-animated="true" style="animation:banner-models-pulse 3s ease-in-out infinite;transform-box:view-box;transform-origin:250px 50px"><text x="250" y="45" fill="#f472b6" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LLM &amp; REASONING MODELS</text><text x="250" y="68" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Claude 3.7 • Gemini 2.5 • DeepSeek R1 • GPT-4o</text></g></svg>