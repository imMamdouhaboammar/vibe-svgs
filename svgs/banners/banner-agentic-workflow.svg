<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="banner-agentic-workflow-title banner-agentic-workflow-desc" role="img" viewBox="0 0 500 120"><title id="banner-agentic-workflow-title">Agentic Workflow Banner</title><desc id="banner-agentic-workflow-desc">A humorous community diagram showing Prompt -&gt; Subagent -&gt; PR workflow steps.</desc><defs><linearGradient id="banner-agentic-workflow-bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#18181b"/><stop offset="1" stop-color="#09090b"/></linearGradient></defs><style>@keyframes banner-agentic-workflow-pulse{0%,to{transform:scale(1)}50%{transform:scale(1.02)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><rect width="500" height="120" fill="url(#banner-agentic-workflow-bg)" rx="14"/><g data-animated="true" style="animation:banner-agentic-workflow-pulse 3s ease-in-out infinite;transform-box:view-box;transform-origin:250px 60px"><rect width="110" height="44" x="30" y="38" fill="#27272a" stroke="#a1a1aa" stroke-width="1.5" rx="8"/><text x="85" y="65" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. Prompt</text><path stroke="#e4e4e7" stroke-dasharray="4 3" stroke-width="2" d="M145 60h25"/><rect width="150" height="44" x="175" y="38" fill="#27272a" stroke="#6366f1" stroke-width="1.5" rx="8"/><text x="250" y="65" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. Autonomous Agent</text><path stroke="#e4e4e7" stroke-dasharray="4 3" stroke-width="2" d="M330 60h25"/><rect width="110" height="44" x="360" y="38" fill="#27272a" stroke="#10b981" stroke-width="1.5" rx="8"/><text x="415" y="65" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. Green PR</text></g></svg>