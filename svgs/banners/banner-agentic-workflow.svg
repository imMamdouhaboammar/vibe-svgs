<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" role="img" aria-labelledby="banner-agentic-workflow-title banner-agentic-workflow-desc">
  <title id="banner-agentic-workflow-title">Agentic Workflow Banner</title>
  <desc id="banner-agentic-workflow-desc">A humorous community diagram showing Prompt -&gt; Subagent -&gt; PR workflow steps.</desc>
  <defs>
    <linearGradient id="banner-agentic-workflow-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18181B"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
  </defs>
  <style>
    .banner-agentic-workflow-flow {
      animation: banner-agentic-workflow-pulse 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 250px 60px;
    }
    @keyframes banner-agentic-workflow-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <rect width="500" height="120" rx="14" fill="url(#banner-agentic-workflow-bg)"/>
  <g class="banner-agentic-workflow-flow" data-animated="true">
    <!-- Step 1 -->
    <rect x="30" y="38" width="110" height="44" rx="8" fill="#27272A" stroke="#A1A1AA" stroke-width="1.5"/>
    <text x="85" y="65" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#F4F4F5" text-anchor="middle">1. Prompt</text>

    <path d="M145 60 L170 60" stroke="#E4E4E7" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- Step 2 -->
    <rect x="175" y="38" width="150" height="44" rx="8" fill="#27272A" stroke="#6366F1" stroke-width="1.5"/>
    <text x="250" y="65" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#818CF8" text-anchor="middle">2. Autonomous Agent</text>

    <path d="M330 60 L355 60" stroke="#E4E4E7" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- Step 3 -->
    <rect x="360" y="38" width="110" height="44" rx="8" fill="#27272A" stroke="#10B981" stroke-width="1.5"/>
    <text x="415" y="65" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#34D399" text-anchor="middle">3. Green PR</text>
  </g>
</svg>
