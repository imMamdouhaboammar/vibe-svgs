<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="banner-pills-title banner-pills-desc" role="img" viewBox="0 0 500 100"><title id="banner-pills-title">AI Coding Tools Community Banner</title><desc id="banner-pills-desc">A banner featuring pill badges representing community AI coding tools.</desc><defs><linearGradient id="banner-pills-bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs><style>@keyframes banner-pills-float{0%,to{transform:translateY(0)}50%{transform:translateY(-4px)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><rect width="500" height="100" fill="url(#banner-pills-bg)" rx="12"/><g data-animated="true" style="animation:banner-pills-float 3s ease-in-out infinite;transform-box:view-box;transform-origin:250px 50px"><rect width="90" height="36" x="30" y="32" fill="#ea8f5e" rx="18"/><text x="75" y="55" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Claude</text><rect width="90" height="36" x="140" y="32" fill="#6366f1" rx="18"/><text x="185" y="55" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Codex</text><rect width="90" height="36" x="250" y="32" fill="#06b6d4" rx="18"/><text x="295" y="55" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cursor</text><rect width="90" height="36" x="360" y="32" fill="#a855f7" rx="18"/><text x="405" y="55" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Gemini</text></g></svg>