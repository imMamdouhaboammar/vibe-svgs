<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" role="img" aria-labelledby="banner-pills-title banner-pills-desc">
  <title id="banner-pills-title">AI Coding Tools Community Banner</title>
  <desc id="banner-pills-desc">A banner featuring pill badges representing community AI coding tools.</desc>
  <defs>
    <linearGradient id="banner-pills-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <style>
    .banner-pills-float {
      animation: banner-pills-float 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 250px 50px;
    }
    @keyframes banner-pills-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <rect width="500" height="100" rx="12" fill="url(#banner-pills-bg)"/>
  <g class="banner-pills-float" data-animated="true">
    <rect x="30" y="32" width="90" height="36" rx="18" fill="#EA8F5E"/>
    <text x="75" y="55" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">Claude</text>

    <rect x="140" y="32" width="90" height="36" rx="18" fill="#6366F1"/>
    <text x="185" y="55" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">Codex</text>

    <rect x="250" y="32" width="90" height="36" rx="18" fill="#06B6D4"/>
    <text x="295" y="55" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#0F172A" text-anchor="middle">Cursor</text>

    <rect x="360" y="32" width="90" height="36" rx="18" fill="#A855F7"/>
    <text x="405" y="55" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">Gemini</text>
  </g>
</svg>