<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="banner-vibe-coding-arena-title banner-vibe-coding-arena-desc" role="img" viewBox="0 0 500 120"><title id="banner-vibe-coding-arena-title">Vibe Coding Arena Banner</title><desc id="banner-vibe-coding-arena-desc">A dynamic animated arena banner presenting AI coding mascot showdowns.</desc><defs><linearGradient id="banner-vibe-coding-arena-bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".5" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient></defs><style>@keyframes banner-vibe-coding-arena-pulse{0%,to{opacity:.9;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}@media (prefers-reduced-motion:reduce){[data-animated]{animation:none!important}}</style><rect width="500" height="120" fill="url(#banner-vibe-coding-arena-bg)" rx="14"/><rect width="494" height="114" x="3" y="3" fill="none" stroke="#6366f1" stroke-width="1.5" opacity=".35" rx="12"/><g data-animated="true" style="animation:banner-vibe-coding-arena-pulse 2.5s ease-in-out infinite;transform-box:view-box;transform-origin:250px 60px"><text x="250" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="extrabold" text-anchor="middle">VIBE CODING ARENA</text><text x="250" y="78" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Multi-Agent Vector Ecosystem &amp; Community Mascots</text></g></svg>