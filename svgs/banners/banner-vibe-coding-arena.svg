<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" role="img" aria-labelledby="banner-vibe-coding-arena-title banner-vibe-coding-arena-desc">
  <title id="banner-vibe-coding-arena-title">Vibe Coding Arena Banner</title>
  <desc id="banner-vibe-coding-arena-desc">A dynamic animated arena banner presenting AI coding mascot showdowns.</desc>
  <defs>
    <linearGradient id="banner-vibe-coding-arena-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <style>
    .banner-vibe-coding-arena-glow {
      animation: banner-vibe-coding-arena-pulse 2.5s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 250px 60px;
    }
    @keyframes banner-vibe-coding-arena-pulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animated] { animation: none !important; }
    }
  </style>

  <rect width="500" height="120" rx="14" fill="url(#banner-vibe-coding-arena-bg)"/>
  <rect width="494" height="114" x="3" y="3" rx="12" fill="none" stroke="#6366F1" stroke-width="1.5" opacity="0.35"/>

  <g class="banner-vibe-coding-arena-glow" data-animated="true">
    <text x="250" y="52" font-family="system-ui, sans-serif" font-weight="extrabold" font-size="22" fill="#38BDF8" text-anchor="middle">VIBE CODING ARENA</text>
    <text x="250" y="78" font-family="system-ui, sans-serif" font-size="13" fill="#C084FC" text-anchor="middle">Multi-Agent Vector Ecosystem &amp; Community Mascots</text>
  </g>
</svg>
